<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>PopStudies26 — Study Reference</title>
<style>
  :root{
    --paper:#FAF7F0;
    --ink:#1B2A4A;
    --charcoal:#3D3B36;
    --teal:#2F6F6B;
    --teal-tint:#E8F0EE;
    --line:#D9D2C2;
    --paper-raised:#F3EFE4;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--paper);
    color:var(--charcoal);
    font-family:'Iowan Old Style','Palatino Linotype',Georgia,serif;
    display:flex;
    min-height:100vh;
  }
  ::selection{background:var(--teal-tint);}

  nav.toc{
    width:250px;
    flex-shrink:0;
    background:var(--paper-raised);
    border-right:1px solid var(--line);
    padding:24px 0 40px;
    overflow-y:auto;
    height:100vh;
    position:sticky;
    top:0;
  }
  .toc-brand{
    font-size:18px;
    font-weight:600;
    color:var(--ink);
    padding:0 20px 3px;
  }
  .toc-sub{
    padding:0 20px 16px;
    font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
    font-size:12px;
    color:#8A8578;
    border-bottom:1px solid var(--line);
    margin-bottom:6px;
  }
  .toc-subject{
    padding:13px 20px 4px;
    font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
    font-size:13.5px;
    font-weight:600;
    color:var(--ink);
    cursor:pointer;
  }
  .toc-subject:hover{color:var(--teal);}
  .toc-subject.active-subject{color:var(--teal);}
  ul.toc-list{list-style:none;margin:0 0 4px;padding:0;}
  .toc-item{
    display:flex;
    align-items:baseline;
    gap:9px;
    padding:6px 20px 6px 28px;
    cursor:pointer;
    font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
    font-size:13.5px;
    color:var(--charcoal);
    border-left:3px solid transparent;
  }
  .toc-item:hover{background:#EFE9DA;}
  .toc-item.active{
    border-left-color:var(--teal);
    background:var(--teal-tint);
    color:var(--ink);
    font-weight:600;
  }
  .toc-num{
    font-family:'SF Mono','JetBrains Mono',monospace;
    font-size:11.5px;
    color:#A39D8C;
    min-width:14px;
  }
  .toc-item.active .toc-num{color:var(--teal);}
  .toc-item.empty{color:#B5AF9E; font-style:italic; cursor:default;}

  main{
    flex:1;
    padding:48px 56px 120px;
    max-width:820px;
  }
  .eyebrow{
    font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
    font-size:13px;
    color:var(--teal);
    margin-bottom:5px;
  }
  h1.section-title{
    font-size:29px;
    color:var(--ink);
    margin:0 0 30px;
    line-height:1.25;
  }
  h2.block-title{
    font-size:15px;
    color:var(--teal);
    margin:30px 0 12px;
    font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
    font-weight:600;
    border-bottom:1px solid var(--line);
    padding-bottom:7px;
  }
  p.body-text{
    font-size:15.5px;
    line-height:1.6;
    max-width:660px;
    margin:0 0 12px;
  }
  .empty-note{
    font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
    font-size:14px;
    color:#8A8578;
    padding:8px 0 4px;
  }

  #gate{
    position:fixed; inset:0; background:var(--paper);
    display:flex; align-items:center; justify-content:center;
    z-index:1000;
  }
  #gate-box{
    background:#fff; border:1px solid var(--line);
    padding:40px 36px; max-width:340px; width:90%;
    text-align:center;
  }
  #gate-box h2{
    font-size:20px; color:var(--ink); margin:0 0 6px;
    font-family:'Iowan Old Style',Georgia,serif;
  }
  #gate-box p{
    font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
    font-size:13.5px; color:#8A8578; margin:0 0 20px;
  }
  #gate-box input{
    width:100%; padding:10px 12px; font-size:15px;
    border:1px solid var(--line); margin-bottom:12px;
    font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
    box-sizing:border-box;
  }
  #gate-box button{
    width:100%; padding:10px; font-size:14.5px; font-weight:600;
    background:var(--teal); color:#fff; border:none; cursor:pointer;
    font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
  }
  #gate-box button:hover{background:#25534F;}
  #gate-error{
    color:#B34A3C; font-size:13px; margin-top:10px; height:16px;
    font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
  }
  #app{display:none;}

  ul.materials{list-style:none;margin:0;padding:0;}
  ul.materials li{
    font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
    font-size:14.5px;
    padding:9px 0;
    border-bottom:1px solid var(--line);
    display:flex;
    justify-content:space-between;
    gap:12px;
  }
  ul.materials li a{color:var(--teal); text-decoration:none; font-weight:600;}
  ul.materials li a:hover{text-decoration:underline;}
  .mat-tag{
    font-family:'SF Mono',monospace;
    font-size:10.5px;
    color:#A39D8C;
    white-space:nowrap;
  }

  ul.notes{margin:0; padding:0; list-style:none;}
  ul.notes li{
    font-size:15px;
    line-height:1.55;
    padding:9px 0 9px 20px;
    position:relative;
    border-bottom:1px solid #EDE7D8;
  }
  ul.notes li:before{
    content:"\00b7";
    position:absolute;
    left:4px;
    color:var(--teal);
    font-size:19px;
    line-height:1.1;
  }
  ul.notes li .f{
    font-family:'SF Mono','JetBrains Mono',monospace;
    font-size:14px;
    color:var(--ink);
    background:var(--teal-tint);
    padding:1px 5px;
  }

  .quiz-item{
    border:1px solid var(--line);
    margin-bottom:8px;
    background:#fff;
  }
  .quiz-q{
    padding:12px 16px;
    font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
    font-size:14.5px;
    color:var(--ink);
    cursor:pointer;
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:12px;
  }
  .quiz-q:hover{background:#FAFAF7;}
  .quiz-toggle{
    font-family:'SF Mono',monospace;
    font-size:12px;
    color:var(--teal);
    flex-shrink:0;
  }
  .quiz-a{
    display:none;
    padding:0 16px 14px;
    font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
    font-size:14px;
    line-height:1.55;
    color:var(--charcoal);
    border-top:1px solid var(--line);
    padding-top:10px;
  }
  .quiz-item.open .quiz-a{display:block;}

  .overview-list{list-style:none;margin:0;padding:0;}
  .overview-list li{
    padding:12px 0;
    border-bottom:1px solid var(--line);
    font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
  }
  .overview-list li a{
    color:var(--ink);
    text-decoration:none;
    font-size:15.5px;
    font-weight:600;
    cursor:pointer;
  }
  .overview-list li a:hover{color:var(--teal);}
  .overview-count{font-size:12.5px; color:#8A8578;}

  @media (max-width: 800px){
    body{flex-direction:column;}
    nav.toc{width:100%; height:auto; position:relative; border-right:none; border-bottom:1px solid var(--line);}
    main{padding:28px 20px 80px;}
  }
</style>
</head>
<body>

<div id="gate">
  <div id="gate-box">
    <h2>PopStudies26</h2>
    <p>Enter the class password to continue</p>
    <input type="password" id="gate-input" placeholder="Password">
    <button onclick="checkPassword()">Enter</button>
    <div id="gate-error"></div>
  </div>
</div>

<div id="app">
<nav class="toc" id="toc"></nav>
<main id="main"></main>
</div>

<script>

let active = { type: "section", id: "f1" };

function renderTOC(){
  const toc = document.getElementById('toc');
  let html = '<div class="toc-brand">PopStudies26</div><div class="toc-sub">Year 1 study reference, built as we go</div>';
  for(const key in DATA){
    const subj = DATA[key];
    const isActiveSubject = active.type==='overview' && active.id===key;
    html += '<div class="toc-subject ' + (isActiveSubject?'active-subject':'') + '" data-overview="' + key + '">' + subj.label + '</div>';
    if(subj.sections.length === 0){
      html += '<ul class="toc-list"><li class="toc-item empty">No materials yet</li></ul>';
      continue;
    }
    html += '<ul class="toc-list">';
    subj.sections.forEach(function(sec, i){
      const shortTitle = sec.title.replace(/^.*?\u2014\s*/,'');
      const activeClass = (active.type==='section' && sec.id===active.id) ? 'active' : '';
      html += '<li class="toc-item ' + activeClass + '" data-id="' + sec.id + '"><span class="toc-num">' + String(i+1).padStart(2,'0') + '</span>' + shortTitle + '</li>';
    });
    html += '</ul>';
  }
  toc.innerHTML = html;
  toc.querySelectorAll('.toc-item[data-id]').forEach(function(el){
    el.addEventListener('click', function(){ active = {type:'section', id: el.dataset.id}; render(); });
  });
  toc.querySelectorAll('.toc-subject[data-overview]').forEach(function(el){
    el.addEventListener('click', function(){ active = {type:'overview', id: el.dataset.overview}; render(); });
  });
}

function findSection(id){
  for(const key in DATA){
    const found = DATA[key].sections.find(function(s){ return s.id===id; });
    if(found) return {subjKey: key, subj: DATA[key], sec: found};
  }
  return null;
}

function driveLinkHTML(key, label){
  const link = DRIVE_LINKS[key];
  if(link){
    return '<a href="' + link + '" target="_blank" rel="noopener">' + label + '</a>';
  }
  return '<span style="color:#B5AF9E;">' + label + ' (add your Drive link in the code to make this clickable)</span>';
}

function renderOverview(key){
  const subj = DATA[key];
  let html = '<div class="eyebrow">Subject overview</div><h1 class="section-title">' + subj.label + '</h1>';

  html += '<h2 class="block-title">Materials</h2><ul class="materials">';
  const hasLocalFiles = subj.sections.some(function(s){ return s.filePath; });
  if(hasLocalFiles){
    html += '<li>Lecture slides are hosted directly, open each session to download.<span class="mat-tag">SLIDES</span></li>';
  } else {
    html += '<li>' + driveLinkHTML(key, 'Open lecture slide folder (Google Drive)') + '<span class="mat-tag">DRIVE</span></li>';
  }
  html += '<li>' + subj.textbook + '<span class="mat-tag">TEXTBOOK</span></li>';
  html += '</ul>';

  html += '<h2 class="block-title">Notes by session</h2>';
  if(subj.sections.length === 0){
    html += '<div class="empty-note">Nothing uploaded for this subject yet.</div>';
  } else {
    html += '<ul class="overview-list">';
    subj.sections.forEach(function(sec){
      const count = sec.notes.length;
      html += '<li><a data-id="' + sec.id + '">' + sec.title + '</a><br><span class="overview-count">' + (count ? count + ' notes' : 'not covered yet') + '</span></li>';
    });
    html += '</ul>';
  }

  document.getElementById('main').innerHTML = html;
  document.querySelectorAll('.overview-list a[data-id]').forEach(function(el){
    el.addEventListener('click', function(){ active = {type:'section', id: el.dataset.id}; render(); });
  });
}

function renderSection(id){
  const found = findSection(id);
  if(!found) return;
  const subj = found.subj;
  const sec = found.sec;

  let html = '<div class="eyebrow">' + subj.label + '</div><h1 class="section-title">' + sec.title + '</h1>';

  html += '<h2 class="block-title">Materials</h2><ul class="materials">';
  if(sec.filePath){
    html += '<li><a href="' + sec.filePath + '" target="_blank" rel="noopener">' + sec.lecture + '</a><span class="mat-tag">SLIDES</span></li>';
  } else {
    html += '<li>' + sec.lecture + '<span class="mat-tag">SLIDES (not hosted yet)</span></li>';
  }
  if(sec.textbookRef){
    html += '<li>' + subj.textbook + '<span class="mat-tag">' + sec.textbookRef.toUpperCase() + '</span></li>';
  }
  html += '</ul>';

  html += '<h2 class="block-title">Notes</h2>';
  if(sec.notes.length){
    html += '<ul class="notes">';
    sec.notes.forEach(function(n){ html += '<li>' + n + '</li>'; });
    html += '</ul>';
  } else {
    html += '<div class="empty-note">Not covered yet. Ask Claude to add this session\'s notes once we go through it.</div>';
  }

  html += '<h2 class="block-title">Exercises</h2>';
  if(sec.exercises.length){
    sec.exercises.forEach(function(item){
      html += '<div class="quiz-item"><div class="quiz-q">' + item.q + '<span class="quiz-toggle">reveal</span></div><div class="quiz-a">' + item.a + '</div></div>';
    });
  } else {
    html += '<div class="empty-note">No exercises added yet.</div>';
  }

  document.getElementById('main').innerHTML = html;
  document.querySelectorAll('.quiz-item').forEach(function(el){
    el.querySelector('.quiz-q').addEventListener('click', function(){
      el.classList.toggle('open');
      el.querySelector('.quiz-toggle').textContent = el.classList.contains('open') ? 'hide' : 'reveal';
    });
  });
}

function render(){
  renderTOC();
  if(active.type === 'overview'){ renderOverview(active.id); }
  else { renderSection(active.id); }
  window.scrollTo(0,0);
}

const SITE_PASSWORD = "pstudies7777";

function checkPassword(){
  const input = document.getElementById('gate-input').value;
  const err = document.getElementById('gate-error');
  if(input === SITE_PASSWORD){
    sessionStorage.setItem('popstudies26_unlocked', 'yes');
    document.getElementById('gate').style.display = 'none';
    document.getElementById('app').style.display = 'flex';
    render();
  } else {
    err.textContent = 'Wrong password, try again.';
  }
}

document.getElementById('gate-input').addEventListener('keydown', function(e){
  if(e.key === 'Enter') checkPassword();
});

if(sessionStorage.getItem('popstudies26_unlocked') === 'yes'){
  document.getElementById('gate').style.display = 'none';
  document.getElementById('app').style.display = 'flex';
  render();
}
