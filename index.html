  .quiz-item{

  .quiz-item:hover{

<script>
const DRIVE_LINKS = {
  fundamental: null,
  statistics: null,
  econ: null,
  population: null,
  datapolicy: null
};

const DATA = {
  statistics: {
    label: "Research Methodology and Data Analytics",
    textbook: "Gravetter & Wallnau, Statistics for the Behavioral Sciences (9th ed.)",
    sections: [
      {
        id: "s1", title: "Ch.1 \u2014 Introduction to Statistics",
        lecture: "Stats 2026 lecture_1_2026.pdf", textbookRef: "Chapter 1",
        notes: [
          "Population = everyone you care about. Sample = smaller group you measure to represent it. Parameter describes a population, statistic describes a sample.",
          "Descriptive stats just summarizes what you found. Inferential stats uses a sample to guess about the whole population.",
          "Sampling error is the natural, expected gap between a sample statistic and the true population value. Not a mistake.",
          "Discrete variable has no in-between values (siblings). Continuous variable can be any value including fractions (height). Real limits sit half a unit above and below a continuous score.",
          "Scales of measurement, weakest to strongest: Nominal (labels only), Ordinal (ranked order), Interval (equal spacing, no true zero), Ratio (equal spacing plus true zero).",
          "Correlational studies find relationships but never prove causation. Experiments manipulate an independent variable and can show cause and effect."
        ],
        exercises: [
          {q: "30 students out of 1,000 are measured and the average reported. Descriptive or inferential?", a: "Descriptive. Just describing the sample measured, not generalizing to all 1,000."}
        ]
      },
      {
        id: "s2", title: "Ch.2 \u2014 Frequency Distributions",
        lecture: "Stats 2026lecture 2 (to print).pdf", textbookRef: "Chapter 2",
        notes: [
          "<span class='f'>p = f / N</span> where f is frequency and N is total people. Percentage = p times 100.",
          "Grouped table rules: equal interval widths, bottom of each interval a multiple of the width, 10 or fewer intervals, round widths like 2, 5, 10, 20.",
          "Apparent limits (the label, e.g. 20 to 29) are 1 unit narrower than real limits (19.5 to 29.5).",
          "Histogram is for numeric data, bars touch. Bar graph is for nominal or ordinal data, gaps between bars.",
          "Skew is named by the direction of the tail, not where scores pile up. Tail right means positive skew, tail left means negative skew."
        ],
        exercises: [
          {q: "Interval labeled 20 to 29. Real limits?", a: "19.5 to 29.5."}
        ]
      },
      {
        id: "s3", title: "Ch.3 \u2014 Central Tendency",
        lecture: "Stats 2026lecture 2 (to print).pdf", textbookRef: "Chapter 3",
        notes: [
          "<span class='f'>\u03bc = \u03a3X / N</span> for a population, <span class='f'>M = \u03a3X / n</span> for a sample. \u03a3X means sum of scores.",
          "Mean is sensitive to every score. Adding a constant shifts the mean by that constant. Multiplying scales the mean the same way.",
          "Median only cares about order, so it resists extreme scores. Mean gets pulled toward outliers.",
          "Mode is the most frequent score. Only measure that works with nominal, category based data.",
          "Mean minus Median greater than 0 means positive skew. Mean minus Median less than 0 means negative skew."
        ],
        exercises: [
          {q: "Income data has one billionaire, everyone else modest. Mean or median is more typical?", a: "Median. The billionaire drags the mean up, median ignores how extreme it is."}
        ]
      },
      {
        id: "s4", title: "Ch.4 \u2014 Variability",
        lecture: "Stats 2026 lecture 3 (290819).pdf", textbookRef: "Chapter 4",
        notes: [
          "The pipeline: deviation (X minus mean), square it, sum it (SS), divide by N or n minus 1 (variance), square root (SD).",

          "Demography is basically the study of people, counting them, measuring how their numbers change, and figuring out why. There are two branches. <strong>Formal demography</strong> is the math side, tracking births, deaths, and migration with numbers and formulas. <strong>Population studies</strong> asks the deeper question of why those numbers move the way they do, borrowing from economics and sociology. Think of it like a car: formal demography knows exactly how fast the car is going and how much fuel is left, population studies asks why the driver chose that speed and where they're headed.",

        summary: [
          "This session is really about two things: the simple math of how a population's size changes, and where population numbers actually come from in the real world.",
          "The balancing equation is the most important formula in demography, and it's really just common sense written as math. Think of a population like a bank account. The starting balance is P1. Money comes in as births and moving-in (deposits), and money goes out as deaths and moving-out (withdrawals). Whatever's left is P2, the new balance. That's the whole idea: new population equals old population, plus natural increase, plus net migration.",
          "Populations don't grow in a straight line, they grow the way a bank account grows with compound interest, a little faster each year because the growth builds on itself. That's why the exponential formula uses e (a special growth constant) raised to a power, instead of just multiplying by a fixed amount. The Rule of 70 is a shortcut for the question everyone actually wants to know: how long until this population doubles? Just divide 70 by the growth rate percentage and you get a rough answer in years.",
          "Where do all these population numbers actually come from? Four main places, each with tradeoffs. A census tries to count literally everyone, which makes it very accurate but slow and expensive, so it only happens every 5 to 10 years. Civil registration records births and deaths continuously as they happen, but not every country registers every event completely. Sample surveys ask a smaller group of people detailed questions, but come with sampling error. Population registers track everyone continuously, but only work well if a country already has a strong ID system.",
          "One sneaky data quality problem is age heaping, people rounding their age to a number ending in 0 or 5 instead of giving their exact age, especially in surveys where literacy or record-keeping is weaker. Whipple's Index catches this by checking how many people in a sample reported suspiciously round ages. A score of 100 means no rounding problem at all. A score way above that, like 150 or more, means a lot of people are just guessing round numbers instead of stating their real age, which can throw off any analysis that depends on exact ages."

          "A population pyramid is just a picture showing how many people are at each age, split by sex, males on the left, females on the right, youngest at the bottom, oldest at the top. There's a classic mistake to avoid: each bar's length has to be calculated as a percentage of the TOTAL population, not as a percentage of all males or all females separately. If you divide by the sex-specific total instead, both sides are forced to add up to 100% on their own, which completely hides any real difference in how many men versus women there actually are.",
          "<div style='background:#fff;border:1px solid var(--line);padding:18px;margin:6px 0;'><svg viewBox='0 0 600 380' style='width:100%;height:auto;max-width:420px;display:block;margin:0 auto;'><text x='150' y='30' font-size='13' text-anchor='middle' fill='#2A2823' font-weight='700'>Males</text><text x='450' y='30' font-size='13' text-anchor='middle' fill='#2A2823' font-weight='700'>Females</text><line x1='300' y1='45' x2='300' y2='330' stroke='#888' stroke-width='1'/><text x='300' y='60' font-size='10' text-anchor='middle' fill='#2A2823'>60+</text><rect x='262' y='65' width='38' height='28' fill='#3A5A8C'/><rect x='300' y='65' width='45' height='28' fill='#8A2E24'/><text x='300' y='108' font-size='10' text-anchor='middle' fill='#2A2823'>45-59</text><rect x='232' y='113' width='68' height='28' fill='#3A5A8C'/><rect x='300' y='113' width='72' height='28' fill='#8A2E24'/><text x='300' y='156' font-size='10' text-anchor='middle' fill='#2A2823'>30-44</text><rect x='195' y='161' width='105' height='28' fill='#3A5A8C'/><rect x='300' y='161' width='105' height='28' fill='#8A2E24'/><text x='300' y='204' font-size='10' text-anchor='middle' fill='#2A2823'>15-29</text><rect x='158' y='209' width='142' height='28' fill='#3A5A8C'/><rect x='300' y='209' width='138' height='28' fill='#8A2E24'/><text x='300' y='252' font-size='10' text-anchor='middle' fill='#2A2823'>0-14</text><rect x='130' y='257' width='170' height='28' fill='#3A5A8C'/><rect x='300' y='257' width='161' height='28' fill='#8A2E24'/></svg><p style='font-family:-apple-system,sans-serif;font-size:12.5px;color:#8A8578;margin:8px 0 0;text-align:center;'>Illustrative pyramid: wide base, narrow top, typical of a young, fast-growing population. Bar length = % of the TOTAL population, not % of the same-sex total.</p></div>",
          "Sex ratio and sex ratio at birth both just compare male counts to female counts, one for the whole population, one specifically for babies born in a year. The normal biological range at birth is about 104 to 106 boys per 100 girls, a number so consistent across human history that any big departure from it is a red flag worth investigating.",
          "The three dependency ratios all follow the same idea: how many dependents (children, or elderly, or both combined) exist for every 100 working-age people. A country with a youth-heavy burden and a country with an elderly-heavy burden can have the exact same headline dependency number, but they need completely different policies, one needs more schools, the other needs more pensions and elder healthcare. The Aging Index just directly compares elderly people to children, so once it crosses 100, there are officially more old people than young people in that country.",
          "The demographic dividend is one of the more hopeful ideas in demography. As fertility falls, a bigger share of the population ends up in the working ages, simply because fewer children are being born to sit outside the workforce. More workers per dependent can mean more economic output per person, even before anyone gets more productive, this is the first dividend, and it's purely mechanical and temporary. As people live longer, they also tend to save more for a longer retirement and invest more in skills, which can create a second, longer-lasting wave of growth, the second dividend, but only if a country's financial and education systems are strong enough to actually put those savings to good use."
        ],
        notes: [
          "Pyramid rule: always divide by the total population, never the same-sex subtotal, or it hides real sex imbalance.",
          "<span class='f'>SR = (Males / Females) \u00d7 100</span>. <span class='f'>SRB = (Male births / Female births) \u00d7 100</span>, normal range about 104 to 106.",
          "<span class='f'>Youth DR = (Pop 0\u201314 / Pop 15\u201364) \u00d7 100</span>. <span class='f'>Old-Age DR = (Pop 65+ / Pop 15\u201364) \u00d7 100</span>. Total DR = Youth DR plus Old-Age DR.",
          "<span class='f'>Aging Index = (Pop 65+ / Pop 0\u201314) \u00d7 100</span>. Over 100 means elderly outnumber children.",
          "First dividend: working age share rises as fertility falls, temporary. Second dividend: longer lifespans push saving and skill building, can persist longer.",
          "Growth contribution formula: annual growth equals (support ratio end divided by support ratio start), raised to the power of 1 over n years, minus 1."
        ],
        formulas: [
          {name: "Sex Ratio (SR)", expr: "SR = (Males / Females) \u00d7 100", def: "Reads as males per 100 females."},
          {name: "Sex Ratio at Birth (SRB)", expr: "SRB = (Male births / Female births) \u00d7 100", def: "Normal biological range \u2248 104\u2013106."},
          {name: "Youth Dependency Ratio", expr: "Youth DR = (Pop 0\u201314 / Pop 15\u201364) \u00d7 100", def: "Children per 100 working-age people."},
          {name: "Old-Age Dependency Ratio", expr: "Old-Age DR = (Pop 65+ / Pop 15\u201364) \u00d7 100", def: "Elderly per 100 working-age people."},
          {name: "Total Dependency Ratio", expr: "Total DR = Youth DR + Old-Age DR", def: "All dependents per 100 working-age people."},
          {name: "Aging Index", expr: "Aging Index = (Pop 65+ / Pop 0\u201314) \u00d7 100", def: "Over 100 means elderly outnumber children."},
          {name: "First Dividend Growth Contribution", expr: "annual growth = (support ratio end / support ratio start)^(1/n) \u2212 1", def: "n = years between the two points. Measures the first dividend's contribution to growth."}
        ],
        exercises: [
          {q: "Why must population pyramid percentages be calculated against the total population, not the male or female subtotal separately?", a: "Dividing by the sex-specific subtotal forces both sides to add up to 100% independently, which hides any real imbalance between the number of men and women and breaks the left-right comparison."},
          {q: "A country has 48,000,000 males and 50,000,000 females. Calculate the sex ratio.", a: "SR = (48,000,000/50,000,000) \u00d7 100 = 96 males per 100 females."},
          {q: "A country records 515,000 male births and 490,000 female births. Calculate the SRB. Is it within the normal biological range?", a: "SRB = (515,000/490,000) \u00d7 100 \u2248 105.1. Yes, this is within the normal range of about 104\u2013106."},
          {q: "A country records 610,000 male births and 550,000 female births. Calculate the SRB. Is it within the normal biological range?", a: "SRB = (610,000/550,000) \u00d7 100 \u2248 110.9. No, this is above the normal 104\u2013106 range, which can signal sex-selective practices."},
          {q: "Population Y has 8.4 million aged 0\u201314, 15.6 million aged 15\u201364, and 2.6 million aged 65+. Calculate the youth, old-age, and total dependency ratios.", a: "Youth DR = (8.4/15.6)\u00d7100 = 53.8. Old-Age DR = (2.6/15.6)\u00d7100 = 16.7. Total DR = 53.8+16.7 = 70.5."},
          {q: "Based on the previous question, is Population Y's burden youth-driven or elderly-driven? What stage of the transition does that suggest?", a: "Youth-driven (53.8 vs 16.7). This suggests an early or mid transition country, still young and growing."},
          {q: "Thailand 2025: 14.4% aged 0\u201314, 69.6% aged 15\u201364, 16.0% aged 65+. Calculate the total dependency ratio.", a: "Youth DR = (14.4/69.6)\u00d7100 \u2248 20.7. Old-Age DR = (16.0/69.6)\u00d7100 \u2248 23.0. Total DR \u2248 43.7."},
          {q: "A country has 18.0% of its population aged 0\u201314 and 12.0% aged 65+. Calculate the Aging Index. Are there more children or elderly?", a: "Aging Index = (12.0/18.0) \u00d7 100 \u2248 66.7. Since this is below 100, there are still more children than elderly."},
          {q: "A country has 12.0% aged 0\u201314 and 18.0% aged 65+. Calculate the Aging Index. What does the result mean?", a: "Aging Index = (18.0/12.0) \u00d7 100 = 150. Since this is above 100, elderly people outnumber children by a wide margin."},
          {q: "What's the key difference between the first and second demographic dividend?", a: "The first dividend comes from a rising working-age share as fertility falls, and it's temporary since those cohorts eventually age past 65. The second dividend comes from longer lifespans pushing people to save more and build skills, and it can persist longer if financial and education systems are strong enough."},
          {q: "A country's working-age share rises from 60% to 70% over 30 years. Calculate the annualized growth contribution from the first dividend.", a: "0.70/0.60 = 1.1667. Annual growth = 1.1667^(1/30) \u2212 1 \u2248 0.0051, or about 0.51% per year."},
          {q: "A country's working-age share rises from 55% to 65% over 25 years. Calculate the annualized growth contribution.", a: "0.65/0.55 = 1.1818. Annual growth = 1.1818^(1/25) \u2212 1 \u2248 0.0067, or about 0.67% per year."},
          {q: "True or False: a falling dependency ratio automatically produces faster economic growth.", a: "False. It's only a window of opportunity. Whether it turns into real growth depends on having enough jobs, education, and healthcare in place for the larger working-age population."},
          {q: "Why is the demographic dividend described as temporary in its first form?", a: "Because the same large working-age cohorts that boosted the ratio eventually age into the 65+ group themselves, which shrinks the working-age share again."},
          {q: "What must be true of a country's financial and education systems for the second dividend to actually materialize?", a: "They need to be strong enough to channel the extra savings and skill-building from a longer-living population into productive investment, rather than the savings going to waste."},
          {q: "A population pyramid has a wide base and a narrow top. What does this shape suggest about the population?", a: "A young, fast-growing population, typical of an early demographic transition country."},
          {q: "Two countries have the same Total Dependency Ratio, but one is youth-driven and the other is elderly-driven. Why does this distinction matter for policy?", a: "The same headline number implies very different policy needs: a youth-driven burden calls for investment in schools and child health, while an elderly-driven burden calls for investment in pensions and elder healthcare."},
          {q: "A country has 20,000,000 aged 15\u201364 and 3,000,000 aged 65+. Calculate the Old-Age Dependency Ratio.", a: "Old-Age DR = (3,000,000/20,000,000) \u00d7 100 = 15."},
          {q: "A country has 25,000,000 aged 0\u201314 and 40,000,000 aged 15\u201364. Calculate the Youth Dependency Ratio.", a: "Youth DR = (25,000,000/40,000,000) \u00d7 100 = 62.5."},
          {q: "Why is the Aging Index a useful complement to the dependency ratios rather than a replacement for them?", a: "The dependency ratios compare each dependent group to the working-age population, but the Aging Index directly compares elderly to children, immediately showing which dependent group is now larger, information the dependency ratios alone don't make as explicit."}
        ]
      },
      {
        id: "f4", title: "Session 4 \u2014 Mortality, Morbidity and Health",
        lecture: "Session 4 \u2014 Mortality, Morbidity and Health", filePath: "materials/fundamental/Session 4_Mortality Morbidity and Health_2026.pdf", textbookRef: "",
        summary: [
          "This session is about measuring death properly, which turns out to be trickier than it sounds, and then about a bigger idea called health measurement, which tries to capture not just whether people die but how much illness and disability happens along the way.",
          "The Crude Death Rate is the simplest way to measure mortality, just total deaths divided by the population. But here's the catch: a country full of retirees will always show a higher CDR than a country full of young people, even if both countries are equally healthy at every single age, simply because old people die more often no matter where they live. The CDR mixes together actual health risk with age structure, and that mixing is exactly what makes it misleading for comparing countries.",
          "The fix is standardization, and there are two ways to do it. Imagine comparing two runners' race times, except one ran on flat ground and one ran uphill, you'd want to adjust for the hill before declaring a winner. Direct standardization applies the same 'flat ground' (a shared standard age structure) to both populations' own death rates, producing a fair, apples-to-apples number. Indirect standardization works the other way around: when a population is too small for its own age-specific rates to be reliable, you borrow a trusted reference population's rates instead, and see how many deaths would be 'expected' if your population behaved that way, then compare to what actually happened. That ratio is called the SMR, and anything above 100 means more deaths happened than expected.",
          "A great real example from this session: Thailand's raw crude death rate looks nearly triple Japan's. But once you standardize for the fact that Thailand simply has an older population than the WHO's reference standard, the real risk gap shrinks to roughly double, still a real, meaningful health difference, just not as extreme as the raw numbers first suggested.",
          "Beyond just counting deaths, demographers also want to capture the burden of living with illness, not just dying from it. DALYs do this by adding together years lost to premature death (YLL) and years lived in less than full health (YLD, weighted by how severe the condition is). A DALY is basically a single number representing 'healthy years lost' to any cause, whether that's dying young or living for decades with a disabling condition, which is why it's become the standard tool for comparing the true burden of very different health problems on the same scale."
        ],
        notes: [
          "The <strong>Crude Death Rate (CDR)</strong> is the simplest mortality measure, but it mixes actual mortality risk with age structure. An older population shows a higher CDR than a younger one even when age-specific risks are identical, which is why CDR is easy to compute but easy to misread.",
          "The <strong>Age-Specific Mortality Rate (ASMR)</strong> fixes this by computing mortality separately for each age band, removing the age-mixing problem within each group. The full set of ASMRs is also the building block for life tables (Session 5).",
          "<strong>Direct standardization</strong> applies a shared standard population's age weights to each population's own age-specific rates, producing an Age-Standardized Death Rate (ASDR) in the same units as a crude rate. <strong>Worked example (real data):</strong> Thailand's crude death rate is 9.03 per 1,000, but once standardized to the WHO World Standard Population, it drops to 5.27. Japan's standardized rate on the same standard is 2.62. Thailand's real risk gap versus Japan is roughly double, once age structure is held constant, not the nearly 3.5x gap the raw crude rates would suggest.",
          "<strong>Indirect standardization</strong> is used when a study population's own age-specific rates are unreliable or based on small numbers. Instead, you apply a standard population's known rates to your study population's age structure, producing 'expected deaths', then compare to actually observed deaths as a Standardized Mortality Ratio (SMR). <strong>Worked example (real data):</strong> if Thailand experienced Japan's age-specific mortality, it would be 'expected' to have about 351,896 deaths in 2024. Thailand's actual observed deaths were 647,349. SMR = (647,349 / 351,896) \u00d7 100 \u2248 184, meaning Thailand experienced roughly 84% more deaths than it would under Japan's mortality risk, a genuine health gap, not an artifact of Thailand's different age structure.",
          "Three common misconceptions worth avoiding: (1) A standardized rate is NOT the population's 'real' observed rate, it's a constructed, hypothetical number for fair comparison. (2) Two standardized rates are only comparable if they used the SAME standard population. (3) An SMR of 100 doesn't mean 'average health' in any absolute sense, it means average relative to whichever standard population was chosen as the reference.",
          "<span class='f'>Cause-specific mortality rate</span> = (Deaths from cause C / Mid-year population) \u00d7 100,000, usually per 100,000 to keep numbers readable for less-common causes. <span class='f'>Proportional mortality</span> = (Deaths from cause C / Total deaths) \u00d7 100, useful for describing the mix of causes but sensitive to the size of the denominator, so it should never substitute for a real population-based rate.",
          "<strong>DALYs (Disability-Adjusted Life Years)</strong> = YLL (Years of Life Lost to premature death) + YLD (Years Lived with Disability). YLD requires a disability weight from 0 (full health) to 1 (equivalent to death) for each health state. <strong>Worked example:</strong> a death causing 50 years of life lost (YLL=50), plus 100 people living with moderate hearing loss (disability weight 0.02) for 1 year each (YLD = 100 \u00d7 1 \u00d7 0.02 = 2). DALYs = 50 + 2 = 52. A second example: YLL = 24, and 40 people living 8 years with a condition weighted 0.15 (YLD = 40 \u00d7 8 \u00d7 0.15 = 48). DALYs = 24 + 48 = 72.",
          "Thailand's 2024\u20132026 mortality snapshot (real data): crude death rate 9.0\u20139.1 per 1,000, life expectancy at birth 77.1 years, with a large female/male gap (81.4 vs 72.9 years). Thailand's 65+ share is already about 15.4% of the population, which mechanically pushes CDR upward even where age-specific survival is actually improving, exactly the distortion standardization is built to correct for.",
          "Three Asian countries sit at three different points on the epidemiological transition: <strong>Japan</strong> (85.2 years life expectancy) is late/post-transition, aged and chronic-disease-dominant. <strong>Thailand</strong> (77.1 years) is late transition, rapidly aging and NCD-dominant but still catching up to Japan. <strong>Philippines</strong> (70.2 years) is mid-transition, younger with more residual communicable-disease burden. A single 'Asia' mortality profile would badly misrepresent all three."
        ],
        formulas: [
          {name: "Crude Death Rate (CDR)", expr: "CDR = (Total deaths / Mid-year population) \u00d7 1,000", def: "The simplest mortality indicator. Distorted by age structure, so use with caution when comparing populations."},
          {name: "Age-Specific Mortality Rate (ASMR)", expr: "ASMR(x) = (Deaths to persons aged x / Mid-year population aged x) \u00d7 1,000", def: "Computed separately per age band. Removes the age-mixing problem within that band."},
          {name: "Standardized Mortality Ratio (SMR)", expr: "SMR = (Observed deaths / Expected deaths) \u00d7 100", def: "Expected deaths = \u03a3(Standard ASMR at age x \u00d7 Study population at age x). SMR above 100 means excess mortality relative to the standard used."},
          {name: "Cause-Specific Mortality Rate", expr: "Cause-specific mortality rate = (Deaths from cause C / Mid-year population) \u00d7 100,000", def: "Usually per 100,000 to keep less-common causes readable."},
          {name: "Proportional Mortality", expr: "Proportional mortality = (Deaths from cause C / Total deaths) \u00d7 100", def: "Describes the mix of causes. Sensitive to the size of total deaths, so it is not a substitute for a population-based rate."},
          {name: "Disability-Adjusted Life Years (DALYs)", expr: "DALYs = YLL + YLD", def: "YLL = Years of Life Lost to premature death. YLD = Years Lived with Disability (duration \u00d7 disability weight, 0 to 1)."}
        ],
        exercises: [
          {q: "Calculate the CDR: 550,000 total deaths, mid-year population 61,000,000.", a: "CDR = (550,000 / 61,000,000) \u00d7 1,000 \u2248 9.0 deaths per 1,000 people."},
          {q: "Why can two populations with identical age-specific mortality risk still show different CDRs?", a: "Because CDR mixes actual mortality risk with age structure. The population with an older age distribution will show a higher CDR even if age-specific risk is identical."},
          {q: "Calculate the ASMR for ages 65+: 300,000 deaths, population aged 65+ is 10,000,000.", a: "ASMR = (300,000 / 10,000,000) \u00d7 1,000 = 30.0 deaths per 1,000 people aged 65+."},
          {q: "What's the key data difference between direct and indirect standardization?", a: "Direct standardization needs reliable age-specific rates for the population being studied. Indirect standardization is used when those rates are unreliable or based on small numbers, instead borrowing a standard population's rates and applying them to the study population's own age structure."},
          {q: "When would you prefer indirect standardization over direct?", a: "When your study population is small (e.g. an occupational cohort or small district) and its own age-specific rates would be statistically unstable, but you know its age structure and total observed deaths."},
          {q: "A study population has 133.9 expected deaths and 160 observed deaths. Calculate and interpret the SMR.", a: "SMR = (160 / 133.9) \u00d7 100 \u2248 119.5. This means the population experienced about 19.5% more deaths than expected under the standard population's age-specific mortality."},
          {q: "Interpret an SMR of 184 in one sentence.", a: "The population experienced about 84% more deaths than it would have if every age group carried the standard population's age-specific mortality risk."},
          {q: "True or False: an SMR of 100 always means 'average health' in an absolute sense.", a: "False. It means average relative to whichever standard population's rates were used as the reference. A different standard would shift what SMR = 100 represents."},
          {q: "True or False: a standardized rate is the population's real, observed death rate.", a: "False. It's a hypothetical, constructed number showing what the rate would be under a specific standard age structure. The crude rate is the real observed rate."},
          {q: "Calculate the cause-specific mortality rate: 45,000 deaths from heart disease, mid-year population 60,000,000.", a: "(45,000 / 60,000,000) \u00d7 100,000 = 75 deaths per 100,000 people."},
          {q: "Calculate proportional mortality: 80,000 cancer deaths out of 550,000 total deaths.", a: "(80,000 / 550,000) \u00d7 100 \u2248 14.5% of all deaths."},
          {q: "What's a key limitation of proportional mortality as a measure?", a: "It's sensitive to the size of the denominator (total deaths), so it describes the mix of causes but should never substitute for a real population-based rate."},
          {q: "Calculate DALYs: a condition causes 30 years of life lost (YLL), plus 50 people living 2 years each with a disability weight of 0.1.", a: "YLD = 50 \u00d7 2 \u00d7 0.1 = 10. DALYs = 30 + 10 = 40."},
          {q: "What does DALY stand for, and what two components make it up?", a: "Disability-Adjusted Life Year. It equals Years of Life Lost (YLL) to premature death plus Years Lived with Disability (YLD)."},
          {q: "What do disability weights of 0 and 1 represent?", a: "0 means full health (no disability burden). 1 means a health state equivalent to death."},
          {q: "Real data: whose life expectancy at birth is higher, Thailand or Japan, and by roughly how much?", a: "Japan's is higher, about 85.2 years versus Thailand's 77.1 years, a gap of about 8 years."},
          {q: "Of Japan, Thailand, and the Philippines, which is furthest along the epidemiological transition, and which is least?", a: "Japan is furthest along (late/post-transition, aged, chronic-disease-dominant). The Philippines is least far along (mid-transition, younger, more communicable-disease burden)."},
          {q: "Why might Thailand's CDR be rising over time even if age-specific mortality is actually improving?", a: "Because Thailand's population is aging. An older age structure mechanically pushes the crude rate upward, independent of whether survival at each specific age is getting better."},
          {q: "What WHO classification system is used to code cause of death internationally?", a: "ICD-11, the International Classification of Diseases."},
          {q: "A news report says 'Country X has a lower death rate than Country Y, so it must have better healthcare.' What question should you ask before accepting this claim?", a: "Whether the comparison accounts for age structure. A lower crude death rate can simply reflect a younger population rather than genuinely better health outcomes, so you'd want to see age-specific or standardized rates before concluding anything about healthcare quality."}
        ]

      {
        id: "f5", title: "Session 5 \u2014 Life Tables",
        lecture: "Session 5 \u2014 Life Tables Applied Lab", filePath: "materials/fundamental/Session_5_Life_Tables_Applied_Lab_2026_v2_1.pdf", textbookRef: "",
        summary: [
          "A life table can feel intimidating with all its subscripts and Greek-letter-adjacent notation, but the underlying idea is simple: imagine 100,000 imaginary babies born on the same day, and you follow this pretend group through life, applying real mortality rates at each age to see how many are still alive at every stage. It's like a simulation, not real people, but built from real death rates, used to summarize an entire population's mortality pattern into one clean, connected table.",
          "The whole table is really just six linked steps, each one feeding the next, like a chain of dominoes. You start with the observed death rate at each age (nMx). That gets converted into a true probability of dying within that age interval (nqx). From there you can calculate how many of your original 100,000 are still alive at each age (lx), how many died in each interval (ndx), how many person-years the group lived through in that interval (nLx), and finally how many years are left to live on average at each age (ex), which is life expectancy.",
          "<div style='background:#fff;border:1px solid var(--line);padding:18px;margin:6px 0;'><svg viewBox='0 0 600 130' style='width:100%;height:auto;'><g font-family='-apple-system,sans-serif' font-size='12' text-anchor='middle'><rect x='5' y='40' width='85' height='50' fill='#EEF2F8' stroke='#3A5A8C'/><text x='47' y='62' fill='#2A2823' font-weight='700'>nMx</text><text x='47' y='76' fill='#8A8578' font-size='9'>death rate</text><path d='M95,65 L118,65' stroke='#3A5A8C' stroke-width='1.5' marker-end='url(#ah)'/><rect x='120' y='40' width='85' height='50' fill='#EEF2F8' stroke='#3A5A8C'/><text x='162' y='62' fill='#2A2823' font-weight='700'>nqx</text><text x='162' y='76' fill='#8A8578' font-size='9'>probability</text><path d='M210,65 L233,65' stroke='#3A5A8C' stroke-width='1.5' marker-end='url(#ah)'/><rect x='235' y='40' width='75' height='50' fill='#EEF2F8' stroke='#3A5A8C'/><text x='272' y='62' fill='#2A2823' font-weight='700'>lx</text><text x='272' y='76' fill='#8A8578' font-size='9'>survivors</text><path d='M310,65 L333,65' stroke='#3A5A8C' stroke-width='1.5' marker-end='url(#ah)'/><rect x='335' y='40' width='75' height='50' fill='#EEF2F8' stroke='#3A5A8C'/><text x='372' y='62' fill='#2A2823' font-weight='700'>ndx</text><text x='372' y='76' fill='#8A8578' font-size='9'>deaths</text><path d='M410,65 L433,65' stroke='#3A5A8C' stroke-width='1.5' marker-end='url(#ah)'/><rect x='435' y='40' width='75' height='50' fill='#EEF2F8' stroke='#3A5A8C'/><text x='472' y='55' fill='#2A2823' font-weight='700'>nLx, Tx</text><text x='472' y='76' fill='#8A8578' font-size='9'>person-yrs</text><path d='M510,65 L533,65' stroke='#3A5A8C' stroke-width='1.5' marker-end='url(#ah)'/><rect x='535' y='40' width='60' height='50' fill='#3A5A8C'/><text x='565' y='62' fill='#fff' font-weight='700'>ex</text><text x='565' y='76' fill='#dfe6f2' font-size='9'>life exp.</text></g><defs><marker id='ah' viewBox='0 0 10 10' refX='8' refY='5' markerWidth='5' markerHeight='5' orient='auto'><path d='M0 0L10 5L0 10z' fill='#3A5A8C'/></marker></defs></svg><p style='font-family:-apple-system,sans-serif;font-size:12.5px;color:#8A8578;margin:8px 0 0;text-align:center;'>The life table pipeline: each step feeds directly into the next, ending in life expectancy.</p></div>",
          "The single most quoted number to come out of this whole process is e0, life expectancy at birth. Interestingly, e0 is often slightly lower than e1 (life expectancy at exactly age 1) whenever infant mortality is meaningfully high, because surviving that risky first year already removes the most dangerous period from the picture, boosting the expected years remaining for everyone who made it past their first birthday.",
          "There are two special exceptions built into the formulas worth remembering: age 0 gets its own slightly different formula because infant deaths cluster unevenly within that first year, and the very last open-ended age group (like '85 and older') also needs a different formula since there's no defined upper boundary to work with.",
          "You can also flip the whole table around and think of it as a snapshot of a real, unchanging 'stationary population', imagine a place where the same number of babies are born every single year, exactly matching the life table's survival pattern, and the total population size never changes. Under that lens, the person-years numbers become an actual population count at each age, and life expectancy at birth becomes simply the average age at which people in that imaginary, permanently stable place die."
        ],
        notes: [
          "A life table follows a hypothetical 'synthetic cohort' of people (conventionally starting at 100,000, called the <strong>radix</strong>, l0) through life, applying a fixed set of age-specific mortality rates to see how many survive to each age. It's the single most important tool for summarizing a population's mortality pattern into one connected pipeline.",
          "Notation: <strong>x, n</strong> means the interval starts at exact age x and spans n years. Standard tables use n=1 for age 0, n=4 for ages 1\u20134, then n=5 for every 5-year band after that, ending in an open interval like 85+.",
          "The pipeline has six linked steps, each one feeding the next: <strong>nMx</strong> (observed death rate) \u2192 <strong>nqx</strong> (probability of dying in the interval) \u2192 <strong>lx</strong> (survivors to that age) \u2192 <strong>ndx</strong> (deaths in the interval) \u2192 <strong>nLx</strong> (person-years lived in the interval) \u2192 <strong>Tx</strong> (person-years remaining) \u2192 <strong>ex</strong> (life expectancy).",
          "<span class='f'>nMx = nDx / nNx</span>, the observed deaths in an age band divided by the mid-period population in that band.",
          "<span class='f'>nqx = (n \u00b7 nMx) / (1 + (n \u2212 nax) \u00b7 nMx)</span> converts the observed rate into a true probability of dying before reaching the next age. nqx must always lie between 0 and 1, and the very last open interval always has \u221eqx = 1 by definition (everyone eventually dies).",
          "<strong>nax</strong> is the average number of years lived in the interval by those who die in it. For most intervals a rough n/2 works, but ages 1\u20134 is a well-known exception: deaths concentrate toward the younger end of that band, so a(1\u20134) \u2248 1.5, not the naive 2.0.",
          "<span class='f'>lx+n = lx \u00d7 (1 \u2212 nqx)</span> builds survivors forward from the radix. <span class='f'>ndx = lx \u2212 lx+n = lx \u00d7 nqx</span> gives deaths within the interval.",
          "<span class='f'>nLx = n \u00d7 lx+n + nax \u00d7 ndx</span> is the general formula for person-years lived in an interval, but it has two special cases: at age 0, <strong>L0 = l1 + a0 \u00d7 d0</strong>. At the final open interval, there's no upper bound, so instead <strong>L\u03c9 = l\u03c9 / M\u03c9</strong>.",
          "<span class='f'>Tx = \u03a3 nLy for all y \u2265 x</span> is computed as a reverse cumulative sum, starting at the oldest open interval and working back down to age 0. <span class='f'>ex = Tx / lx</span> is life expectancy at age x, with e0 (life expectancy at birth) being the single most widely reported mortality summary statistic in the world.",
          "<strong>Full worked example</strong> (radix l0 = 100,000): starting from nMx values of 0.0200 (age 0\u20131), 0.0015 (1\u20134), 0.0008 (5\u20139), 0.0007 (10\u201314), and 0.0012 (15\u201319), the pipeline produces: l1 = 98,028, l5 = 97,442, l10 = 97,053, l15 = 96,714, l20 = 96,135. Deaths in each interval (ndx): 1,972 / 586 / 389 / 339 / 579. Person-years (nLx): 98,619 / 390,646 / 486,236 / 484,416 / 482,121, with the open interval L\u03c9 = 96,135 / 0.0200 = 4,806,750 person-years. The final result: <strong>e0 = 67.49 years</strong>.",
          "Notice e1 (67.8) is actually slightly higher than e0 (67.49) in this example. That's a classic life-table pattern whenever infant mortality is meaningfully elevated: once you survive the risky first year, your expected remaining years of life goes up, since you've already cleared the highest-risk period. After that, ex declines fairly steadily with age: e5=64.2, e10=59.5, e15=54.7, e20=50.0.",
          "A life table can also be read as a <strong>stationary population</strong>: imagine a real population with constant annual births exactly matching the cohort's lx at every age, and zero growth. Under that lens, nLx becomes a real population count at each age, Tx becomes the total stationary population aged x and above, and e0 becomes the mean age at death in that stationary population.",
          "Three different 'typical' ages from the same table: the <strong>median</strong> age at death is where lx = l0/2 (half the cohort has died). The <strong>modal</strong> age is wherever ndx is largest (the single age band with the most deaths). The <strong>mean</strong> age at death is simply e0."
        ],
        formulas: [
          {name: "Age-Specific Death Rate, Life Table (nMx)", expr: "nMx = nDx / nNx", def: "Observed death rate: deaths in the age band divided by mid-period population in that band."},
          {name: "Probability of Dying in the Interval (nqx)", expr: "nqx = (n \u00b7 nMx) / (1 + (n \u2212 nax) \u00b7 nMx)", def: "Probability of dying before reaching age x+n. Must lie between 0 and 1."},
          {name: "Survivors to Next Age (lx+n)", expr: "lx+n = lx \u00d7 (1 \u2212 nqx)", def: "Survivors to the next age, built forward from the radix l0 = 100,000."},
          {name: "Deaths in the Interval (ndx)", expr: "ndx = lx \u2212 lx+n = lx \u00d7 nqx", def: "Deaths occurring within the interval."},
          {name: "Person-Years Lived in the Interval (nLx)", expr: "nLx = n \u00d7 lx+n + nax \u00d7 ndx", def: "Person-years lived in the interval. Special cases: L0 = l1 + a0\u00d7d0 at age 0, L\u03c9 = l\u03c9/M\u03c9 at the open interval."},
          {name: "Total Person-Years Remaining (Tx)", expr: "Tx = \u03a3 nLy for all y \u2265 x", def: "Total person-years remaining, summed from the oldest interval down to age x."},
          {name: "Life Expectancy at Age x (ex)", expr: "ex = Tx / lx", def: "Life expectancy at age x. e0 = life expectancy at birth, the most widely reported mortality measure."}
        ],
        exercises: [
          {q: "In your own words, what does lx represent?", a: "The number of people from the original synthetic cohort who survive to exact age x."},
          {q: "What is the radix, and what value is it conventionally set to?", a: "The radix is l0, the starting size of the synthetic cohort. It's conventionally set to 100,000."},
          {q: "Given l10 = 97,053 and l15 = 96,714, calculate ndx for the 10\u201314 interval.", a: "ndx = l10 \u2212 l15 = 97,053 \u2212 96,714 = 339."},
          {q: "Calculate nqx for ages 1\u20134 given nMx = 0.0015, n = 4, nax = 2.5.", a: "nqx = (4 \u00d7 0.0015) / (1 + (4\u22122.5)\u00d70.0015) = 0.006 / 1.00225 \u2248 0.0060."},
          {q: "Given l1 = 98,028 and nqx = 0.0060 for the next interval, calculate lx+n.", a: "lx+n = 98,028 \u00d7 (1 \u2212 0.0060) \u2248 97,440."},
          {q: "Given l15 = 96,714, l20 = 96,135, nax = 2.5, n = 5, calculate nLx for the 15\u201319 interval.", a: "ndx = 96,714 \u2212 96,135 = 579. nLx = 5 \u00d7 96,135 + 2.5 \u00d7 579 = 480,675 + 1,447.5 \u2248 482,123."},
          {q: "Given l\u03c9 = 96,135 and M\u03c9 = 0.0200, calculate the open-interval L\u03c9.", a: "L\u03c9 = 96,135 / 0.0200 = 4,806,750 person-years."},
          {q: "If T0 \u2248 6,749,000 and l0 = 100,000, calculate e0.", a: "e0 = T0 / l0 = 6,749,000 / 100,000 \u2248 67.49 years."},
          {q: "Why is e1 typically higher than e0 in a population with meaningful infant mortality?", a: "Because surviving the risky first year removes the highest-mortality period from consideration, raising the expected remaining years for everyone who made it past age 1."},
          {q: "What does 'radix' mean in the context of a life table?", a: "The starting size of the synthetic cohort at age 0, conventionally 100,000."},
          {q: "True or False: nqx can exceed 1 for some age groups.", a: "False. nqx must always lie between 0 and 1, since it's a probability. The final open interval always has \u221eqx = 1 exactly, since everyone eventually dies."},
          {q: "What does nax represent, in words?", a: "The average number of years lived within the interval by those who die during that interval."},
          {q: "Why is a(1\u20134) typically about 1.5 instead of the naive n/2 = 2.0?", a: "Because deaths in the 1-to-4 age band are concentrated toward the younger end of the interval, closer to age 1 than age 4, so the true average is lower than the simple midpoint."},
          {q: "What special formula is used for L0, and why does it differ from the general nLx formula?", a: "L0 = l1 + a0 \u00d7 d0. It's special because infant mortality is often much higher and more concentrated near birth than the general formula assumes."},
          {q: "What special formula is used for the open-ended final age interval, and why?", a: "L\u03c9 = l\u03c9 / M\u03c9. It's special because there's no upper bound n to the interval, so the n \u00d7 lx+n term used elsewhere doesn't apply."},
          {q: "Under the stationary population interpretation, what does Tx represent?", a: "The total stationary population aged x and above, assuming constant annual births exactly matching the cohort's lx at every age and zero population growth."},
          {q: "Under the stationary population interpretation, what does e0 represent?", a: "The mean age at death in that stationary population."},
          {q: "How are the median, modal, and mean age at death each defined using life table quantities?", a: "Median: the age where lx = l0/2. Modal: the age band with the largest ndx (most deaths). Mean: e0, life expectancy at birth."},
          {q: "Calculate nMx given 1,200 deaths and 600,000 person-years in an age band.", a: "nMx = 1,200 / 600,000 = 0.0020."},
          {q: "A life table shows e0 = 67.5, e1 = 67.8, e5 = 64.2. Describe the pattern and why it happens.", a: "Life expectancy rises slightly from birth to age 1 (surviving the risky first year), then declines steadily after that, as expected: each year survived uses up one year of remaining expected life on average, once the early elevated-risk period is past."}
        ]
      },
      {
        id: "f6", title: "Session 6 \u2014 Fertility, Contraception and Reproductive Health",
        lecture: "Session 6 \u2014 Fertility, Contraception and Reproductive Health", filePath: "materials/fundamental/Session 6_Fertility Contraception and Reproductive Health_2026_v2.pdf", textbookRef: "",
        summary: [
          "Fertility measurement follows the exact same pattern of getting more precise step by step that you saw with mortality in Session 4. The crude birth rate divides births by the WHOLE population, including men, children, and the elderly, none of whom can give birth, which makes it a pretty blunt instrument. The General Fertility Rate sharpens this by dividing only by women of reproductive age. The Age-Specific Fertility Rate sharpens it further still, looking at just one narrow age band of women at a time. And the Total Fertility Rate adds all of those age-specific rates together into the single number everyone actually quotes: the average number of children a woman would have across her whole reproductive life, if current rates held steady.",
          "Real 2026 numbers tell a dramatic story. South Korea's TFR sits at just 0.75, one of the lowest fertility rates ever recorded anywhere, driven by extreme housing costs, expensive private education, and long working hours that make raising children feel financially out of reach for many couples. Compare that to a high-fertility country where TFR sits near 5, a nearly seven-fold difference in average family size between two real countries alive on earth right now.",
          "Here's a genuinely clever idea called the Bongaarts model, which asks: why don't women actually have anywhere near the biological maximum number of children they theoretically could (around 15, called total fecundity)? The model says four separate 'brakes' hold fertility down, each measured on a scale from 0 (fully slamming the brakes) to 1 (no braking at all). Marriage patterns matter, since fewer women marrying young means fewer years of exposure to childbearing. Contraceptive use matters, obviously. Induced abortion matters, since it removes pregnancies that would otherwise become births. And breastfeeding duration matters more than people expect, since intensive breastfeeding naturally suppresses ovulation for months after a birth, acting as a completely non-technological form of birth spacing that mattered enormously before modern contraception existed.",
          "Different regions and eras lean on different brakes. In today's East Asia, delayed marriage is now the dominant brake holding fertility down, a very different story from the classic 'rising contraceptive use' narrative most people assume drives every fertility decline. In pre-transition sub-Saharan Africa, long breastfeeding durations were historically the single biggest natural brake on fertility, long before modern contraception was widely available there at all.",
          "Thailand's own family planning story is genuinely remarkable: contraceptive use jumped from under 15% of women in 1970 to nearly 80% by the early 2010s, one of the fastest transitions anywhere in Asia. But the headline number only tells part of the story, a country can report a high contraceptive prevalence rate built mostly on unreliable traditional methods (with failure rates of 13 to 20% per year) or built on highly effective modern methods (often under 1% failure), and those two scenarios deliver very different real protection against unintended pregnancy, even if the top-line percentage looks the same on paper."
        ],
        notes: [
          "The <strong>Child-Woman Ratio (CWR)</strong> is a rough, indirect fertility measure used when birth registration is poor, since it only needs census age data (no vital registration needed): children aged 0\u20134 compared to women aged 15\u201349.",
          "CBR (from Session 1) mixes fertility with total population structure, including men, children, and the elderly, none of whom can give birth. The <strong>General Fertility Rate (GFR)</strong> fixes this by dividing births only by women of reproductive age. <strong>Worked example:</strong> population 1,000,000, women aged 15\u201349 = 260,000, births = 14,000/year. CBR = 14.0 per 1,000 total population, but GFR = (14,000/260,000) \u00d7 1,000 = 53.8 per 1,000 women 15\u201349, a much more precise fertility signal.",
          "The <strong>Age-Specific Fertility Rate (ASFR, written nFx)</strong> narrows this further to one 5-year age band of women at a time. <strong>Worked example:</strong> age 20\u201324, births = 5,175, women = 115,000. ASFR = (5,175/115,000) \u00d7 1,000 = 45.0 births per 1,000 women aged 20\u201324.",
          "<strong>Total Fertility Rate (TFR)</strong> sums every ASFR across all reproductive ages and scales by the interval width, producing the single most quoted fertility statistic: the average number of children a woman would have if she experienced the current ASFRs at every age of her reproductive life. <strong>Worked example (low-fertility Southeast Asian setting):</strong> summing all ASFRs gives 228.5. TFR = 5 \u00d7 228.5/1,000 = 1.14 children per woman. <strong>Second worked example (Philippines-style schedule):</strong> summed ASFRs = 390. TFR = 5 \u00d7 390/1,000 = 1.95 \u2248 1.9 children per woman.",
          "<strong>Mean Age at Childbearing (MAC)</strong> is a weighted average of age, using each age band's ASFR as the weight, showing the typical age at which childbearing happens in that population, not just how much of it happens.",
          "Real 2026 TFR comparisons: <strong>South Korea</strong>, TFR = 0.75 (2024, a small uptick after a record-low 0.72 in 2023), driven by extreme housing and private-education costs plus long working hours. <strong>Philippines</strong>, TFR = 1.9 (2022), down from 2.7 in 2017, a rapid decline but still just below replacement, the highest of the countries compared in this dataset.",
          "The <strong>Bongaarts model</strong> explains WHY a population's actual TFR is lower than its biological maximum (total fecundity, TF \u2248 15.3), by multiplying four 'proximate determinant' indexes, each ranging from 0 (maximum inhibition of fertility) to 1 (no inhibiting effect): <strong>Cm</strong> falls when fewer women are married or in union during reproductive ages (the dominant lever in contemporary East and Southeast Asia, where marriage is being delayed or foregone). <strong>Cc</strong> falls as contraceptive prevalence and effectiveness rise (the dominant lever mid-transition). <strong>Ca</strong> falls as induced abortion rates rise (East Asia relied heavily on this in the 1960s\u20131980s, alongside rising contraception). <strong>Ci</strong> falls as postpartum infecundability lengthens, mainly through longer breastfeeding, historically the single biggest natural brake on fertility in pre-transition, low-contraception settings like sub-Saharan Africa before modern contraception spread.",
          "<strong>Contraceptive Prevalence Rate (CPR)</strong> is the percentage of women 15\u201349 currently using any contraceptive method. <strong>Modern CPR</strong> restricts this to clinically effective modern methods. <strong>Unmet need</strong> is the gap: fecund, sexually active women who want to stop or delay childbearing but aren't using any method. <strong>Demand satisfied</strong> is the share of total demand (current modern users + unmet need) actually met with modern methods, a core SDG 3.7 indicator.",
          "Method mix matters as much as the headline CPR number: modern methods (pill, IUD, implant, injectable, sterilization, condom) have use-failure rates from under 1% (sterilization, IUD, implant) up to about 7\u201313% (pill, condom). Traditional methods (rhythm, withdrawal) run 13\u201320%+ per year, meaning the same CPR number built on traditional methods buys far less real protection.",
          "Thailand's real family-planning history is a standout case: CPR rose from just 14.8% in 1970 to roughly 79% by the early 2010s, one of Asia's fastest transitions, driven initially by a strong national program and sustained by universal health coverage since 2002. Unmet need fell from 11.7% (1987) to about 6.2% (2016), real progress but not zero, particularly among adolescents and some rural populations. Thailand's method mix is overwhelmingly modern (sterilization and the pill historically dominant), which is a key reason its Cc index fell so far, so fast."
        ],
        formulas: [
          {name: "Child-Woman Ratio (CWR)", expr: "CWR = (Children aged 0\u20134 / Women aged 15\u201349) \u00d7 1,000", def: "Rough, indirect fertility measure usable even without vital registration data."},
          {name: "General Fertility Rate (GFR)", expr: "GFR = (Total live births / Mid-year women aged 15\u201349) \u00d7 1,000", def: "More precise than CBR since the denominator is only women of reproductive age."},
          {name: "Age-Specific Fertility Rate (ASFR)", expr: "nFx (ASFR) = (Births to women aged x to x+n / Mid-year women aged x to x+n) \u00d7 1,000", def: "Fertility rate for one specific 5-year age band of women."},
          {name: "Total Fertility Rate (TFR)", expr: "TFR = n \u00d7 \u03a3(nFx) / 1,000", def: "Sum every ASFR, multiply by the age-interval width (typically n=5). Average children per woman under current age-specific rates."},
          {name: "Mean Age at Childbearing (MAC)", expr: "MAC = \u03a3(x_mid \u00d7 nFx) / \u03a3(nFx)", def: "Weighted average age at childbearing, using each age band's midpoint weighted by its ASFR."},
          {name: "Bongaarts Proximate Determinants Model", expr: "TFR = Cm \u00d7 Cc \u00d7 Ca \u00d7 Ci \u00d7 TF", def: "Bongaarts model. Each index ranges 0 to 1. TF = total fecundity \u2248 15.3."}
        ],
        exercises: [
          {q: "Calculate the GFR: 14,000 births, 260,000 women aged 15\u201349.", a: "GFR = (14,000/260,000) \u00d7 1,000 = 53.8 births per 1,000 women aged 15\u201349."},
          {q: "Calculate the CWR: 180,000 children aged 0\u20134, 300,000 women aged 15\u201349.", a: "CWR = (180,000/300,000) \u00d7 1,000 = 600 children per 1,000 women."},
          {q: "Why is GFR a more precise fertility measure than CBR?", a: "CBR divides by the total population, including men, children, and the elderly, none of whom can give birth. GFR divides only by women of reproductive age, isolating the fertility signal."},
          {q: "Calculate the ASFR for ages 20\u201324: 5,175 births, 115,000 women in that age band.", a: "ASFR = (5,175/115,000) \u00d7 1,000 = 45.0 births per 1,000 women aged 20\u201324."},
          {q: "A population's summed ASFRs across all age bands equal 228.5 (per 1,000). Calculate the TFR.", a: "TFR = 5 \u00d7 228.5/1,000 = 1.14 children per woman."},
          {q: "What does a TFR of 1.9 mean in plain language?", a: "On average, a woman experiencing this population's current age-specific fertility rates throughout her reproductive life would have 1.9 children."},
          {q: "True or False: a TFR below 2.1 always means a population is currently shrinking.", a: "False. A population can keep growing for decades even below replacement-level TFR, due to population momentum from a young existing age structure (Session 3)."},
          {q: "South Korea's 2024 TFR is approximately what, and what factors are commonly cited?", a: "About 0.75. Extreme housing and private-education costs and long working hours are commonly cited drivers."},
          {q: "In the Bongaarts model, what does Cm represent, and when is it typically the dominant lever?", a: "The index of marriage: it falls when fewer women are married or in union during reproductive ages. It's typically dominant in contemporary East and Southeast Asia, where marriage is being delayed or foregone."},
          {q: "In the Bongaarts model, what does Cc represent?", a: "The index of contraception: it falls as contraceptive prevalence and effectiveness rise."},
          {q: "In the Bongaarts model, what does Ca represent, and what's a historical real-world driver?", a: "The index of induced abortion: it falls as abortion rates rise. East Asia in the 1960s\u20131980s relied heavily on induced abortion alongside rising contraceptive use."},
          {q: "In the Bongaarts model, what does Ci represent, and what traditionally drives it in pre-transition societies?", a: "The index of postpartum infecundability: it falls as breastfeeding duration lengthens. In pre-transition, high-fertility settings, long breastfeeding was often the single biggest natural brake on fertility, even before modern contraception."},
          {q: "Write out the full Bongaarts equation.", a: "TFR = Cm \u00d7 Cc \u00d7 Ca \u00d7 Ci \u00d7 TF"},
          {q: "If Cm=0.65, Cc=0.55, Ca=0.98, Ci=0.85, and total fecundity TF=15.3, calculate the implied TFR.", a: "TFR = 0.65 \u00d7 0.55 \u00d7 0.98 \u00d7 0.85 \u00d7 15.3 \u2248 4.56 children per woman."},
          {q: "Define Contraceptive Prevalence Rate (CPR).", a: "The percentage of women of reproductive age (often 15\u201349, married or in-union) currently using any method of contraception, modern or traditional."},
          {q: "Define unmet need for family planning.", a: "Fecund, sexually active women who want to stop or delay childbearing but are not using any method of contraception, the gap between reproductive intentions and contraceptive behavior."},
          {q: "Thailand's CPR rose from roughly what percent in 1970 to what percent by the early 2010s?", a: "From about 14.8% in 1970 to roughly 79% by the early 2010s."},
          {q: "Why can two countries with similar CPR numbers have very different actual fertility-inhibiting effect?", a: "Because the method mix matters, not just the headline prevalence. Modern methods have failure rates under 1% to about 13%, while traditional methods run 13\u201320%+ per year, so the same CPR built on different methods delivers very different real protection."},
          {q: "Using Thailand's CPR of roughly 73% and unmet need of 5%, calculate the approximate percentage of total demand for family planning that is satisfied.", a: "Total demand = current use + unmet need = 73 + 5 = 78. Demand satisfied = (73/78) \u00d7 100 \u2248 93.6%."},
          {q: "What's a key limitation of relying on the headline CPR number alone to judge a country's family-planning success?", a: "CPR alone doesn't reveal the effectiveness of the methods being used. A country could report a high CPR built mostly on traditional methods with high failure rates, overstating its actual protection against unintended pregnancy compared to a country with the same CPR built on modern methods."}
        ]
      }
    ]
  },

  econ: {
    label: "Public Economics and Policy",
    textbook: "Ihori, T. (2017). Principles of public finance. Springer Singapore. Stiglitz, J. E., & Rosengard, J. K. (2015). Economics of the public sector (4th international student ed.). WW Norton & Company.",
    sections: [
      {
        id: "ec1", title: "Lecture 1 — Role and Structure of the Public Sector",
        lecture: "Lecture 1 — Role and Structure of the Public Sector", filePath: "materials/econ/Lecture 1_Role and structure of public sector_2026 handout_6a717e5d3d168.pdf", textbookRef: "",
        summary: [
          "This lecture asks a basic question first. Why do we need a government at all? Picture a country with no public schools, no public highways, no allowances for poor or elderly people. Would private businesses step in and provide all of that on their own? Mostly not, because some of these things are not profitable to sell to individuals one at a time, even though society as a whole benefits from having them.",
          "Governments exist to do three jobs that markets alone tend to do badly. The first is resource allocation. A perfectly competitive market, with many buyers, many sellers, no barriers to entry, and full information, actually allocates resources efficiently on its own. The problem is that real markets are rarely perfect. When a market failure shows up, in the form of an externality or a public good, the government has a reason to step in.",
          "An externality is a side effect of an activity that lands on people who were not part of the deal. Pollution is a negative externality, it hurts people who never chose to buy or sell anything related to the factory that caused it. A rural public school is closer to a positive externality, since educating children benefits the wider community, not just the family paying for it. A public good goes a step further. It has two properties: non excludability (you cannot stop anyone from using it, like a street light) and non rivalness (one person using it does not reduce how much is left for anyone else, like national defense). Because nobody can be charged for using these, private firms have little reason to supply them, and anyone who benefits without paying becomes a free rider.",
          "The second job is income redistribution. Thailand's own data makes the case starkly: the richest 20 percent of the population (the top quintile) holds 91 percent of the country's wealth, and the richest 1 percent alone holds 67 percent. Left alone, this kind of inequality tends to pass from parents to children, a pattern researchers call the Great Gatsby Curve, where countries with more inequality also show less economic mobility between generations. Governments respond with progressive taxes (like inheritance tax and progressive income tax) on one side, and spending like universal health coverage, free basic education, and old age allowances on the other. The catch is that every one of these programs has to be paid for, so there is a constant balancing act between fiscal burden and fiscal sustainability.",
          "The third job is stabilizing the economy. During a recession, Keynesian economics says the government should raise spending and cut taxes to boost demand, for example through direct stimulus payments. The political catch is that cutting spending during a boom is much harder than raising it during a recession, so government debt tends to only go in one direction over time: up.",
          "Public finance itself has three pieces. Revenue comes mostly from taxes, with a smaller share from public enterprises, fines, and fees. Expenditure covers consumption (day to day running costs, like wages for government staff), investment (roads, schools, reservoirs), and public transfers (allowances paid directly to people). Public debt is what results when a government spends more than it collects and has to borrow the difference."
        ],
        notes: [
          "Public policy is a set of actions a government takes to address issues affecting a broad population, not individual cases, developed with input from politicians, civil servants, and other groups.",
          "Government function 1, Resource allocation. In a perfectly competitive market with full information and no barriers to entry, private agents maximizing their own interest already produce an efficient outcome, so the government does not need to intervene. It steps in only when a market failure appears.",
          "Externality: a side effect of an economic activity that hits people who were not part of the transaction. Positive externality examples: public safety, rural education. Negative externality example: air pollution.",
          "Public good properties: non excludability (nobody can be stopped from using it) and non rivalness (one person's use does not reduce another's). Because these benefits spill over to everyone, private markets under supply them, and the free rider problem results.",
          "Government function 2, Income redistribution. In Thailand, the top 20% (Quintile 5) holds 91% of wealth, and the top 1% holds 67%. Without intervention, inequality tends to persist across generations, a pattern known as the Great Gatsby Curve (Corak, 2013).",
          "Redistribution tools: taxes aimed at inequality (inheritance tax, progressive income tax, land and building tax) and public expenditure (Universal Health Coverage, 15 years of free basic education, old age allowance, disability allowance, welfare card scheme). All of these must be weighed against fiscal sustainability.",
          "Government function 3, Stabilization of the economy. Keynesian view: during a recession, the government should raise spending and cut taxes to lift aggregate demand (for example, direct stimulus payments). Political economy problem: expansionary policy in a recession is easy to pass, restrictive policy in a boom is politically difficult, so public debt tends to accumulate over time.",
          "Public finance has three parts. Revenue: mainly taxes, plus public enterprises, fines, and fees. Expenditure: consumption, investment, and public transfers. Public debt: the gap left when expenditure exceeds revenue."
        ],
        exercises: [
          {q: "Why would a private company be unlikely to build and maintain public street lighting on its own?", a: "Street lighting is non excludable (you cannot stop people from benefiting from it) and non rival (one person seeing by it does not reduce light for anyone else). Because the firm cannot charge everyone who benefits, it cannot recover its costs, so the private sector under supplies it."},
          {q: "A factory's smoke gives nearby residents breathing problems, even though those residents never bought anything from the factory. What is this called, and is it positive or negative?", a: "A negative externality. The cost of the factory's activity falls on people outside the transaction, and it is not reflected in the price of what the factory sells."},
          {q: "What is the free rider problem, and why does it relate to public goods?", a: "Because public goods cannot exclude non payers, a person can consume the benefit without contributing to its cost. If enough people do this, the good ends up under provided, since nobody has a strong individual incentive to pay for something everyone else can use for free."},
          {q: "According to the lecture's Thailand figures, what share of wealth does the richest 1% hold?", a: "67% of Thailand's wealth."},
          {q: "What is the Great Gatsby Curve describing?", a: "The empirical pattern where countries with higher income inequality also tend to have lower intergenerational mobility, meaning a family's economic position is more likely to be passed down to their children rather than changing."},
          {q: "Name two direct redistribution tools and two spending programs a government can use to reduce inequality.", a: "Tools: inheritance tax and progressive income tax (land and building tax also counts). Spending: Universal Health Coverage and free basic education (old age allowance or disability allowance also count)."},
          {q: "Why is it politically easier for a government to increase spending during a recession than to cut spending during a boom?", a: "Voters and businesses welcome support during hard times, so expansionary policy faces little resistance. Cutting programs or raising taxes during good times is unpopular even though it would help long-run fiscal sustainability, so governments tend to avoid it, and public debt accumulates as a result."},
