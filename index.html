        exercises: [
          {q: "In the 2-sector model, what two things are missing compared to a real economy?", a: "A financial sector for saving and borrowing (no saving, no financial intermediary), a government, and a foreign sector. All household income is spent directly on firms' output and vice versa."},
          {q: "What role does a financial intermediary play once a 3rd sector is added?", a: "It channels the part of household income not spent (saving) to firms, who can borrow it to fund investment (expanding production)."},
          {q: "Write the AD equation for a closed economy with a government sector.", a: "AD = C + I + G."},
          {q: "Write the AD equation for an open economy, and define NX.", a: "AD = C + I + G + NX, where NX (net exports) equals exports minus imports."},
          {q: "If the government cuts spending on a highway project, what happens to AD, and what is this policy called?", a: "AD falls, since one component (G) of AD directly decreases. This is contractionary fiscal policy."},
          {q: "Exam-style: In Country AAA, C = 200 + 0.5(Y − T) and the tax rate is 5% of income. In Country BBB, C = 300 + 0.75(Y − T) and the tax rate is 20% of income. Calculate the fiscal multiplier for both countries.", a: "Country AAA: c = 0.5, t = 0.05. Multiplier = 1/(1−0.5(1−0.05)) = 1/(1−0.475) = 1/0.525 ≈ 1.90. Country BBB: c = 0.75, t = 0.20. Multiplier = 1/(1−0.75(1−0.20)) = 1/(1−0.6) = 1/0.4 = 2.50. Country BBB has the larger multiplier: even though its tax rate is higher, its much higher MPC (0.75 vs 0.5) dominates, since MPC has a bigger effect on how much each round of spending gets re-circulated."},
          {q: "Exam-style, continued: Country BBB's government spending rises by 1 billion dollars. By how much should Country AAA increase its government spending to produce the same rise in national income?", a: "BBB's impact: ΔY = 2.50 × 1 billion = 2.5 billion. To match this with AAA's multiplier of 1.90: ΔG(AAA) = 2.5 billion / 1.90 ≈ 1.32 billion dollars. AAA needs a bigger spending increase than BBB because its multiplier is smaller."},
          {q: "What are private goods and public goods, and what is the key difference between them? Give an example of each. (Long answer expected.)", a: "A private good is excludable and rival: the seller can stop non-payers from using it, and one person's consumption reduces what is left for others (e.g. a sandwich). A public good is non-excludable and non-rival: nobody can be stopped from using it, and one person's use does not reduce what is available to others (e.g. national defense, a public street light). Because a public good's benefits cannot be restricted to paying customers, private firms have little incentive to supply it, and it tends to be underprovided without government involvement, which is exactly the free-rider problem covered in Lecture 1."},
          {q: "\"Government spending plays an important role in the change in national income through a fiscal multiplier effect.\" Do you agree or disagree? Explain. (Long answer expected.)", a: "Agree, with a caveat. The fiscal multiplier shows that a given change in government spending produces a larger change in national income, since the initial spending gets re-spent repeatedly as it circulates through households and firms. The size of this effect is not fixed, though: it depends on the marginal propensity to consume, the tax rate, whether the economy is open or closed (imports leak spending abroad), and even on demographic factors like the population's age structure, since younger, credit-constrained households spend a larger share of extra income than older ones. So while the general mechanism is real and well established, its actual strength varies a great deal from one economy, and one point in time, to another."},
          {q: "An open economy has c = 0.7, m = 0.05. Calculate the open-economy fiscal multiplier.", a: "Multiplier = 1/(1−0.7+0.05) = 1/0.35 ≈ 2.86."},
          {q: "Using the previous question's multiplier, if government spending rises by 20 units, by how much does national income rise?", a: "ΔY = 2.86 × 20 ≈ 57.2 units."},
          {q: "True or False: the balanced-budget multiplier is always exactly 1, in both closed and open economies.", a: "False. It equals exactly 1 only in a closed economy. In an open economy, part of the extra income from a balanced-budget expansion leaks abroad as imports, so the balanced-budget multiplier is less than 1."},
          {q: "Why does a higher income tax rate act as an 'automatic stabilizer' for the economy?", a: "A higher tax rate shrinks the fiscal multiplier, which means that any shock to spending or investment, whether positive or negative, produces a smaller swing in national income than it would under a lower tax rate. This naturally dampens economic ups and downs without requiring any new policy action."},
          {q: "According to research using U.S. state-level data, how does population aging affect the size of the fiscal multiplier, and why?", a: "Population aging lowers the fiscal multiplier. Younger households tend to be more credit-constrained and have hump-shaped lifetime income, so they spend a larger share of any extra income (a higher MPC) than older, wealthier households who can smooth consumption more easily. As the population ages, this effect fades and the multiplier shrinks; the cited research estimates U.S. national multipliers are now about 36% lower than in 1980 partly for this reason."},
          {q: "Explain the paradox of thrift in your own words.", a: "If everyone tries to save more at the same time, total consumer spending falls. Firms respond to weaker demand by cutting production, so overall economic output ends up falling rather than rising, even though saving more sounds like it should help the economy."}

      {
        id: "ec3", title: "Lecture 3 — The IS-LM Model and Crowding Out",
        lecture: "Lecture 3 — Theory and Application of Public Finance II (The IS-LM Model)", filePath: "materials/econ/Lecture 3_Theory and application of public finance (IS-LM model)_2026_handout _6a83c6ce38465 (1).pdf", textbookRef: "",
        summary: [
          "The previous lecture's Keynesian model only looked at the goods market, meaning it assumed the interest rate stays fixed while government spending changes. In reality, an economy also has a money market, and the two interact. The IS-LM model puts both markets together: the IS side represents equilibrium in the goods market (like before), and the LM side represents equilibrium in the money market. Together they pin down both output and the interest rate at the same time.",
          "This matters because it introduces the crowding-out effect. When the government raises spending, it needs to borrow more, which pushes up the interest rate. A higher interest rate makes borrowing more expensive for private firms and households, so private investment falls. Some of the boost to GDP from extra government spending is therefore crowded out by less private investment, which is why the fiscal multiplier in the IS-LM model ends up smaller than in the simple Keynesian model that ignores interest rates entirely.",
          "The opposite can also happen: crowding in. If a public investment project makes private firms more productive, they may invest more, not less. The lecture's example is Thailand's Eastern Economic Corridor (EEC). Public infrastructure spending there attracts private firms who believe the zone offers strong growth prospects, which then pulls in demand from related industries too, like construction material manufacturers, logistics companies, and business services. When the crowding-in effect is strong enough, it can offset or even reverse the crowding-out effect.",
          "Opening the economy to trade adds a new layer: the exchange rate system. Under a fixed exchange rate (like Saudi Arabia's, pegged to another currency or to gold), the central bank actively intervenes to hold the exchange rate steady, which limits its ability to run independent monetary policy but keeps trade and investment more predictable. Under a flexible exchange rate (like Thailand's managed float), the currency's value is set mostly by market supply and demand, giving the central bank more monetary policy freedom but more exchange rate volatility.",
          "The system in place changes how effective fiscal policy is. With perfect capital mobility, fiscal policy is effective under a fixed exchange rate, but largely ineffective under a flexible exchange rate, where monetary policy becomes the more powerful tool instead. In practice, most countries sit somewhere between fully fixed and fully flexible, so the real-world effect of fiscal policy is a mix of both extremes depending on how mobile capital actually is."
        ],
        notes: [
          "The Keynesian model (Lecture 2) only considers equilibrium in the goods market, treating the interest rate as fixed. The IS-LM model adds equilibrium in the money market alongside it, so output and the interest rate are determined together.",
          "Crowding-out effect: higher government spending raises the interest rate (through increased borrowing), which reduces private investment. This shrinks the fiscal multiplier compared to the simple Keynesian model.",
          "Crowding-in effect: if public investment raises the productivity of private firms, it can increase private investment and consumption instead of reducing it, offsetting or reversing crowding out.",
          "Example of crowding in: Thailand's Eastern Economic Corridor (EEC). Public infrastructure attracts private investment, which raises demand across related industries, manufacturing (steel, cement, machinery), transport and logistics, and services (engineering, finance, insurance).",
          "Open economy equilibrium conditions: goods market <span class='f'>Y = C(Y) + I(r) + G + NX(e, Y)</span>; money market <span class='f'>M = L(Y, r)</span>With perfect capital mobility, the domestic interest rate equals the world interest rate, <span class='f'>r = r*</span>.",
          "Fixed exchange rate: currency pegged to another currency, a basket, or a commodity, with the central bank intervening to hold it steady. Advantage: reduces uncertainty, promotes trade. Disadvantage: limits monetary policy independence.",
          "Flexible exchange rate: currency value set by market supply and demand, with little or no central bank intervention. Advantage: preserves monetary policy independence, adjusts to shocks. Disadvantage: more volatility.",
          "Under perfect capital mobility: fiscal policy is effective under a fixed exchange rate, but ineffective under a flexible exchange rate, where monetary policy becomes the effective tool instead."
        ],
        exercises: [
          {q: "What is the key difference between the simple Keynesian model and the IS-LM model?", a: "The Keynesian model only considers equilibrium in the goods market and holds the interest rate fixed. The IS-LM model adds equilibrium in the money market, so both output and the interest rate are determined jointly."},
          {q: "Explain the crowding-out effect in your own words.", a: "When government spending rises, the government borrows more, pushing up the interest rate. The higher interest rate discourages private investment, so part of the boost to GDP from government spending is offset by a fall in private investment."},
          {q: "Why is the fiscal multiplier in the IS-LM model generally smaller than in the simple Keynesian model?", a: "Because the IS-LM model accounts for the crowding-out effect: rising interest rates from higher government borrowing reduce private investment, partially offsetting the initial boost to output that the Keynesian model alone would predict."},
          {q: "What is the crowding-in effect, and how does the EEC example illustrate it?", a: "Crowding-in happens when public investment makes private firms more productive or more confident, so private investment rises instead of falling. In the EEC, public infrastructure spending attracts private firms who expect strong growth in the zone, which then raises demand in related industries like construction materials, logistics, and business services."},
          {q: "Under a fixed exchange rate with perfect capital mobility, is fiscal policy effective or ineffective?", a: "Effective."},
          {q: "Under a flexible exchange rate with perfect capital mobility, is fiscal policy effective or ineffective, and what policy tool becomes effective instead?", a: "Fiscal policy is ineffective. Monetary policy becomes the effective tool instead."},
          {q: "Name one advantage and one disadvantage of a fixed exchange rate system.", a: "Advantage: reduces uncertainty and volatility, promoting trade and investment (or: helps maintain price stability). Disadvantage: limits monetary policy autonomy (or: can create fiscal and external imbalances, or exposes the economy to speculative attacks)."},
          {q: "Give an example of a country with a fixed exchange rate and one with a managed floating exchange rate, per the lecture.", a: "Saudi Arabia (fixed) and Thailand (managed floating)."},
          {q: "Assigned question: why would you expect a fiscal stimulus to have a smaller impact on national income in the IS-LM model compared to the simple Keynesian model?", a: "In the simple Keynesian model, the interest rate is held fixed, so the full multiplier effect plays out. In the IS-LM model, the same spending increase raises the interest rate, which crowds out some private investment. This crowding-out effect reduces the net rise in output, so the effective multiplier is smaller than in the pure Keynesian case."}
        ]

      {
        id: "ec4", title: "Lecture 4 — Gender Inequality and Gender Equality Policy in Korea",
        lecture: "Lecture 4 — Gender Inequality and Gender Equality Policy in Korea (guest lecture by Prof. Ki-Soo Eun, Seoul National University)", filePath: "materials/econ/Lecture 4_Gender Inequality and Gender Equality Policy in Korea_20260825_6a8cb997c5245.pdf", textbookRef: "",
        summary: [
          "This guest lecture connects gender inequality directly to one of the most alarming demographic trends in East Asia: the lowest-low fertility rate. Replacement level fertility, the rate needed to keep a population stable over time, is a Total Fertility Rate (TFR) of 2.0. Researchers define lowest-low fertility as a TFR of 1.3 or below, a threshold Korea has fallen well beneath, especially since the 1997 Asian economic crisis accelerated the decline.",
          "The core argument is that gender inequality is a major driver of this fertility collapse, not just a side issue. Korean women who have children face a much higher chance of employment discontinuity (having to stop working) than women without children. Data from KOSIS (Korea's statistics agency) shows a persistent gender pay gap and a very unequal division of unpaid work at home, meaning household and childcare labor still falls heavily on women even when both partners work.",
          "The lecture frames this through a broader theory of cultural change. Two forces are said to shape a society's values: cultural resilience (traditional religious and ethnic heritage persists strongly over time) and socioeconomic development (economic security, education, and social complexity push societies toward more individual choice). Crucially, the lecture argues that real value change requires experiential security, meaning people must feel genuinely safe growing up, not just receive more education. When rapid modernization outpaces this sense of security, it can trigger a backlash, where people who feel left behind seek comfort in strict traditional or political movements instead of adapting.",
          "Facing this fertility crisis, Korea has built a stack of gender equality laws over decades. The Gender Equal Employment Act (1987) first banned discrimination in hiring, wages, and retirement. The Gender Equal Employment and Work-Family Balance Assistance Act (2007) added protections like mandatory sexual harassment prevention training, affirmative action requirements for large companies, and support for maternity and childcare leave. The Framework Act on Gender Equality (2015, evolved from a 1995 law) is Korea's foundational gender equality legislation, requiring the government to fund and legally support gender equal treatment across society.",
          "Korea's current (2023 to 2027) national gender equality plan sets out five main tasks: building fairer workplaces, expanding childcare safety nets, supporting victims of gender based violence, promoting a shared culture of gender equality, and strengthening the institutions that carry out gender policy. The lecture's blunt conclusion is that despite all this legislation, Korea remains a male centered society, and achieving real gender equality is described as an unfinished revolution, one that is closely tied to whether the country's fertility rate can recover at all."
        ],
        notes: [
          "Replacement Fertility Rate: TFR of 2.0. Lowest-low fertility: TFR of 1.3 or below (Kohler, Billari & Ortega, 2002).",
          "Korea's TFR fell sharply after the Asian Economic Crisis of late 1997, well below the lowest-low threshold.",
          "Employment discontinuity: women with children in Korea show a much higher probability of stopping work than women without children (KDI Focus, 2024), linked to fear of career interruption discouraging fertility.",
          "Gender pay gap and unequal division of unpaid work (KOSIS 2019 data) both persist in Korea, with women carrying a disproportionate share of household and childcare labor.",
          "Theory of value change (Inglehart and Welzel): cultural resilience (traditional heritage is durable) versus socioeconomic development (existential security, cognitive mobilization, and social complexity push change). Real change in values requires experiential security (feeling safe growing up), not education alone. Rapid change without that security can trigger backlash toward strict traditional or political movements.",
          "Korea's gender equality legal timeline: Constitution Article 11(1) guarantees equality regardless of sex. Gender Equal Employment Act (1987) banned hiring, wage, and retirement discrimination. Gender Equal Employment and Work-Family Balance Assistance Act (2007) added harassment prevention, affirmative action, and family leave support. Framework Act on Gender Equality (2015, evolved from the 1995 Framework Act on Women's Development) is Korea's foundational gender equality law.",
          "Third Basic Plan for Gender Equality (2023 to 2027), five tasks: 1) fair and gender equal workplaces, 2) childcare safety net for all, 3) support for violence victims and gender-aware health rights, 4) shared gender equality culture, 5) stronger institutions for gender policy.",
          "Lecture's conclusion: Korea remains a male-centered society; gender inequality is described as a legacy of cultural tradition and one of the roots of Korea's ultra lowest-low fertility."
        ],
        exercises: [
          {q: "What TFR defines replacement fertility, and what TFR defines lowest-low fertility?", a: "Replacement fertility is a TFR of 2.0. Lowest-low fertility is a TFR of 1.3 or below."},
          {q: "What historical event is linked to the acceleration of Korea's fertility decline?", a: "The Asian Economic Crisis of late 1997."},
          {q: "What is employment discontinuity, and how does it relate to fertility decisions?", a: "Employment discontinuity is when a woman has to stop working, often after having children. Fear of this career interruption discourages women from having children in the first place, contributing to lower fertility."},
          {q: "Name two areas of gender inequality in Korea discussed in the lecture, besides employment discontinuity.", a: "The gender pay gap and the unequal division of unpaid household and childcare work (women doing significantly more than men)."},
          {q: "According to the lecture's cultural change theory, what is required to actually change people's values, beyond education?", a: "Experiential security, meaning people must feel genuinely safe and secure while growing up. Education alone is not described as sufficient."},
          {q: "What is the 'backlash against modern life' described in the lecture?", a: "When cultural change happens quickly, groups who feel left behind, especially those without jobs or with less education, may feel frightened by the change and turn toward strict religious rules or radical political movements for a sense of safety."},
          {q: "Put Korea's three main gender equality laws in chronological order and name what each one added.", a: "1987: Gender Equal Employment Act, banned discrimination in hiring, wages, and retirement. 2007: Gender Equal Employment and Work-Family Balance Assistance Act, added harassment prevention, affirmative action, and family leave support. 2015: Framework Act on Gender Equality, Korea's foundational gender equality legislation requiring government funding and legal support."},
          {q: "Name two of the five tasks in Korea's Third Basic Plan for Gender Equality (2023 to 2027).", a: "Any two of: fostering a fair, gender equal working environment; building a childcare safety net for all; supporting violence victims and gender-aware health rights; spreading a shared gender equality culture; strengthening the institutions behind gender equality policy."},
          {q: "What is the lecture's overall conclusion about the connection between gender inequality and fertility in Korea?", a: "Gender inequality, described as a legacy of Korea's cultural traditions, is presented as one of the root causes of the country's ultra lowest-low fertility rate, and achieving real gender equality is described as an unfinished revolution."}

      {
        id: "ec5", title: "Lecture 5 — The Two-Period Model, Present Value, and Fiscal Policy",
        lecture: "Lecture 5 — Theory and Application of Public Finance III (A Two-Period Neoclassical Model)", filePath: "materials/econ/Lecture 5___Theory and application of public finance_2026 handout _6a96475b1a578 (1).pdf", textbookRef: "",
        extraFiles: [
          {label: "Lecture 5 exercise sheet (the \"Three Packages\" scenario, matches ajarn's exam style)", filePath: "materials/econ/Lecture 5___Exercise questions for Lecture 5 _6a9b8e70983a4.pdf", tag: "EXERCISES"}
        ],
        summary: [
          "This lecture asks a simple question with a surprisingly deep answer: would you rather have 100 baht today or 100 baht a year from now? Most people choose today, partly because of inflation (money loses purchasing power over time) and partly because money in hand can earn interest. Present value (PV) puts a number on this intuition: it tells you what a future sum of money is worth in today's terms, given some interest rate.",
          "The two-period neoclassical model imagines an economy with just two moments in time: now and the future. Households are forward-looking. They do not just spend whatever is in their pocket this year (as the simple Keynesian model effectively assumes); instead, they plan consumption around their entire lifetime resources, because they know that every baht the government spends eventually has to be paid back through future taxes. This single change in assumption has a big consequence: it makes the fiscal multiplier much smaller than in the Keynesian model, and in some cases even negative.",
          "The model introduces the idea of a permanent level of a variable, the constant value that would give the same present value as the actual, changing values across both periods. Since the government's budget must balance in present value over the two periods, any rise in permanent government spending eventually means a rise in permanent taxes, which lowers permanent disposable income, which lowers consumption. This differs completely from the Keynesian model, where consumption depends only on current income.",
          "This forward-looking behavior is called consumption smoothing, or the permanent income hypothesis: rather than spending a lot in good months and cutting back sharply in bad ones, people try to keep their standard of living steady over time by saving during high-income periods and drawing on those savings during low-income periods. A freelancer who earns 5,000 dollars in January but only 1,000 in February will save some of January's income rather than spending it all, so February does not feel like a crisis. The same logic explains why people save for retirement while still working.",
          "Applying this to fiscal policy produces three distinct cases. A temporary increase in government spending (with the permanent level unchanged) still boosts output somewhat, since consumption barely changes, giving a multiplier between 0 and 1. A permanent increase in government spending that leaves current spending unchanged actually produces a negative multiplier, between -1 and 0, because households immediately cut consumption in anticipation of future taxes, even before those taxes are collected. And when both current and permanent spending rise together, the effects cancel out almost completely, giving a multiplier of essentially zero. The consistent theme is that what matters most is not how much the government spends today, but whether people believe the spending is temporary or permanent."
        ],
        notes: [
          "Present value (PV) is the current worth of a future sum of money, given an interest rate. <span class='f'>PV = Y / (1 + r)</span> for a payment one year away, and <span class='f'>PV = Y / (1 + r)^t</span> for a payment t years away.",
          "Worked example: with r = 10%, receiving 50 in both the current and future period has the same present value as receiving 10 now and 94 in the future, or 80 now and 17 in the future. All three streams have a present value of about 95.5, since <span class='f'>50 × (1 + 1/(1+r)) = 95.5</span>.",
          "Permanent income hypothesis (consumption smoothing): households consume based on their permanent (lifetime average) disposable income, not their current income, keeping consumption stable over time by saving in high-income periods and drawing down savings in low-income periods.",
          "The government's budget must balance in present value across both periods, so the permanent level of government spending must equal the permanent level of tax revenue, regardless of how much debt is issued in the meantime. A rise in permanent government spending therefore implies a rise in permanent taxes, and a fall in permanent disposable income and consumption.",
          "Key contrast with the Keynesian model: in the Keynesian model consumption depends on current income (people spend what's in their pocket this year). In the neoclassical two-period model, consumption depends on permanent (lifetime) disposable income, because households anticipate future taxes.",
          "Case 1, Temporary expansion (current G up, permanent G unchanged): consumption barely changes, output rises somewhat via the same crowding-out logic as the Keynesian/IS-LM model. Multiplier: 0 < ΔY/ΔG < 1.",
          "Case 2, Permanent expansion (current G unchanged, permanent G up): permanent taxes rise, permanent disposable income falls, so current consumption and current output fall even before spending changes today. Multiplier: -1 < ΔY/ΔG(permanent) < 0, a negative multiplier.",
          "Case 3, Both current and permanent G rise together: the fall in consumption almost completely offsets the rise in government spending. Multiplier: ΔY/ΔG(permanent) ≈ 0.",
          "Overall conclusion: the size of the fiscal multiplier in the neoclassical model is smaller than in the Keynesian model, because forward-looking households discount future tax liabilities into their spending decisions today."
        ],
        formulas: [
          {name: "Present Value (one period ahead)", expr: "PV = Y / (1 + r)", def: "Y = the future sum of money. r = the interest rate (as a decimal)."},
          {name: "Present Value (t periods ahead)", expr: "PV = Y / (1 + r)^t", def: "Y = the future sum of money. r = the interest rate. t = number of years until the payment."},
          {name: "Fiscal Multiplier, Temporary Expansion", expr: "0 < ΔY / ΔG < 1", def: "Current government spending rises, permanent spending unchanged. Smaller than the Keynesian multiplier but still positive."},
          {name: "Fiscal Multiplier, Permanent Expansion", expr: "-1 < ΔY / ΔG(permanent) < 0", def: "Permanent government spending rises. Households cut consumption today anticipating future taxes, producing a negative multiplier."}
        ],
        exercises: [
          {q: "Given r = 10%, find the present value of receiving 220 baht one year from now.", a: "PV = 220 / (1 + 0.10) = 220 / 1.1 = 200 baht."},
          {q: "Given r = 5%, find the present value of receiving 441 baht two years from now.", a: "PV = 441 / (1.05)^2 = 441 / 1.1025 = 400 baht."},
          {q: "Given r = 10%, an income stream pays 50 in the current period and 50 in the future period. Calculate the present value of the two-period income stream.", a: "PV = 50 × (1 + 1/(1+r)) = 50 × (1 + 1/1.1) = 50 × 1.909 ≈ 95.5."},
          {q: "Given r = 10%, an alternative income stream pays 10 now and 94 in the future. Show that its present value is (approximately) the same as the 50/50 stream above.", a: "PV = 10 + 94/(1+0.10) = 10 + 94/1.1 = 10 + 85.5 = 95.5. Same present value as the 50/50 stream, confirming both give the same lifetime resources even though the timing differs."},
          {q: "What is the permanent income hypothesis, in plain terms?", a: "Households base their spending on their average, lifetime (permanent) income rather than on how much they happen to earn this particular period, which keeps consumption relatively steady over time (consumption smoothing)."},
          {q: "A freelancer earns 5,000 dollars in January and only 1,000 dollars in February. According to consumption smoothing, what should they do, and why?", a: "Save part of January's income so they can maintain similar spending in February, rather than spending heavily in January and struggling in February. This keeps their standard of living stable across both months."},
          {q: "Why does a permanent increase in government spending reduce consumption today, even before any new tax has actually been collected?", a: "Because the government's budget must balance in present value, households understand that a permanent rise in spending implies a permanent rise in future taxes. This lowers their permanent disposable income, so they reduce consumption immediately in anticipation, even though no extra tax has been paid yet."},
          {q: "Which of the three fiscal expansion cases produces the largest (most positive) multiplier: temporary expansion, permanent expansion alone, or both current and permanent expansion together?", a: "Temporary expansion (current G up, permanent G unchanged), with a multiplier between 0 and 1. The permanent expansion case gives a negative multiplier, and the combined case gives roughly zero."},
          {q: "Compare the fiscal multiplier in this neoclassical two-period model to the Keynesian multiplier from Lecture 2. Which is generally bigger, and why?", a: "The Keynesian multiplier is generally bigger, because it assumes households simply spend based on current income. The neoclassical model's multiplier is smaller (and can even be negative) because forward-looking households cut consumption in anticipation of the future taxes needed to pay for today's or tomorrow's government spending."},
          {q: "Exam-style scenario, \"Three packages on the Finance Minister's desk\": A middle-income economy is near full employment, households have good access to credit, and the government is fully credible (its announcements are believed). Three budget packages are on the table. Package A, \"Repair now, restrain later\": a one-year program of school repairs, flood defenses, and road maintenance. Spending rises sharply this year, and the government simultaneously commits to an equal-present-value reduction in future spending, so the lifetime cost of government is unchanged. Package B, \"The next-decade rail plan\": this year's budget is untouched, but a large permanent rail expansion is legislated now, beginning construction in five years and continuing indefinitely, financed by a VAT increase legislated now that takes effect only when construction begins. Package C, \"Universal coverage, starting now\": a permanent public health insurance program launches this year and continues indefinitely. Packages B and C raise the present value of government spending by the same amount; Package A does not raise it at all. Part (a): Classify each package in terms of ΔG (current spending) and ΔGp (permanent spending). For Package A, state precisely what must happen to future spending for this classification to hold, and explain why that is a real constraint rather than a convenient assumption.", a: "Package A: ΔG rises this year (temporary), but ΔGp = 0, because the announced future spending cut has a present value exactly equal to this year's increase, leaving the permanent level of spending unchanged. This is a genuine constraint, not a convenience: the future cut must be precisely equal in present value and credible enough that households actually believe it will happen. If the promised restraint is smaller than the initial increase, or is not believed, ΔGp would not actually stay at zero, and the package would behave partly like a permanent expansion instead. Package B: ΔG = 0 this year (nothing is spent yet), but ΔGp rises, since a large, permanent program has been legislated today, even though physical spending starts in five years, a forward-looking household already treats permanent government spending as higher from today onward. Package C: both ΔG and ΔGp rise together, since new permanent spending begins immediately."},
          {q: "Three Packages, Part (b): For each package, state what happens to household consumption this year, explaining your answer through permanent disposable income (Yp − Tp), not current income.", a: "Package A: consumption is unchanged. Since ΔGp = 0, permanent disposable income (Yp − Tp) does not move, so forward-looking households have no reason to revise their lifetime consumption plan, even though current government spending rose. Package B: consumption falls this year, even though not one baht has been spent or collected yet. Because the government's budget must balance in present value, a permanent rise in Gp implies a permanent rise in Tp (future taxes), lowering Yp − Tp today, and households cut consumption immediately in anticipation. Package C: consumption also falls this year, for the same permanent-income reason as Package B, and this fall is what ends up largely offsetting the simultaneous rise in ΔG."},
          {q: "Three Packages, Part (c): For each package, state what happens this year to the interest rate, private investment, and current output. Identify whether crowding out or crowding in occurs, and through which channel.", a: "Package A: current output rises this year (temporary ΔG directly boosts demand), which raises the interest rate as government borrowing increases; private investment falls, a crowding-out effect operating through the interest-rate channel (the same channel as the IS-LM model). Package B: current output falls slightly this year, since consumption falls while government spending is still unchanged; the interest rate falls as private demand for funds softens, so private investment rises, a crowding-in effect, but operating through the permanent-income/consumption channel rather than a government-borrowing channel. Package C: the rise in G and the fall in C largely offset each other, so current output, the interest rate, and investment all move only modestly, with little net crowding out or crowding in."},
          {q: "Three Packages, Part (d): Describe the aggregate demand and supply diagram for Package A and for Package B, labeling E₀, E₁, and E₂ on each, and explain what the horizontal distance between E₂ and E₁ represents.", a: "For Package A: E₀ is the initial equilibrium. E₁ is the actual new equilibrium after the temporary spending rise, reflecting the real, crowded-out increase in output. E₂ is a hypothetical equilibrium showing how much output would have risen if the interest rate had not increased at all (the naive, no-crowding-out multiplier effect). The horizontal distance between E₂ and E₁ represents the size of the crowding-out effect, the amount of stimulus lost to higher interest rates squeezing out private investment. For Package B: E₀ is the initial equilibrium. E₁ is the actual (lower) equilibrium this year, since consumption falls. E₂ is a hypothetical equilibrium showing where output would have stayed if households had ignored the future tax implications and consumption had not fallen at all. The horizontal distance between E₂ and E₁ represents how much current output is lost purely because forward-looking households cut consumption today in anticipation of future taxes."},
          {q: "Three Packages, Part (e): State the range of the fiscal multiplier for each package, and rank the three by their effect on output this year.", a: "Package A (temporary expansion, ΔGp = 0): 0 < ΔY/ΔG < 1, a positive but muted multiplier. Package B (permanent expansion, current G unchanged): -1 < ΔY/ΔGp < 0, a negative multiplier, meaning output actually falls this year. Package C (both current and permanent G rise together): ΔY/ΔGp ≈ 0, roughly no net effect. Ranked by effect on output this year, most positive to most negative: Package A (raises output) > Package C (roughly unchanged) > Package B (lowers output)."},
          {q: "Three Packages, Part (f): The Minister argues, \"Package B is clearly the best of the three. It supports the economy in the future and it costs the taxpayer nothing this year.\" Evaluate this statement using the model.", a: "The model contradicts both halves of this claim. It is not free this year: because households are forward-looking, the legislated permanent future spending (financed by a future VAT rise) lowers permanent disposable income immediately, causing consumption, and therefore current output, to fall this year, even though nothing has actually been spent or taxed yet. It also does not simply \"support the economy\": the near-term effect on output is contractionary (a negative multiplier), the opposite of economic support, precisely because the model's whole point is that a credible, anticipated future policy has real effects today, not just once it physically takes effect."}
        ]

      {
        id: "ec6", title: "Lecture 6 — Economic Analysis of Taxation",
        lecture: "Lecture 6 — Economic Analysis of Taxation (Part I)", filePath: "materials/econ/Lecture 6___Taxation_part I_2026 handout_6a9f59cf0b27f.pdf", textbookRef: "",
        summary: [
          "Governments cannot sell products or earn profits the way a business does, so taxation is essentially the only way to fund public services. Taxes are mandatory recurring fees paid to central or local government, and they work in two steps: first, they reduce how much private individuals and firms can spend on their own, and second, the government uses that revenue to fund public goods, services, and income support.",
          "It matters a lot whether someone is legally reducing their tax bill or breaking the law to do it. Tax avoidance uses legal loopholes and is only morally questionable, like claiming legitimate deductions. Tax evasion is illegal and fraudulent, like underreporting sales revenue or hiding money in a tax haven, a place with low or no tax and strong secrecy protections, such as the Cayman Islands or the British Virgin Islands. Tax havens cause real harm: they cost governments revenue (Apple was ordered to repay 13 billion euros in unpaid taxes to Ireland in 2016) and worsen inequality, since mainly wealthy individuals and large corporations have the resources to exploit them, as the 2016 Panama Papers leak exposed.",
          "Taxes split into two broad types. Direct taxes (like personal income tax or inheritance tax) are paid straight to the government by the person who legally owes them, and cannot be shifted onto someone else, so they scale with income and are considered equitable, since people with a greater ability to pay contribute more. Indirect taxes (like VAT or excise duty) are collected through an intermediary, such as a retailer, and everyone pays the same rate regardless of income, which makes them regressive, since a poorer person and a richer person pay identical VAT on the identical purchase.",
          "Indirect taxes on specific goods come in two forms. An ad valorem tax is a percentage of the price, like a 10 percent excise tax on sugary drinks. A price of 12 baht becomes 13.2 baht after tax, 15 becomes 16.5, and 20 becomes 22, so more expensive items get taxed by more baht, making it relatively progressive. A specific tax is a fixed amount per unit regardless of price, like a 5 baht per liter diesel excise tax. Under this system, a 12 baht item becomes 17, a 15 baht item becomes 20, and a 20 baht item becomes 25, meaning cheaper and pricier versions of the same good all get taxed the exact same number of baht.",
          "Who actually ends up bearing the burden of a tax, the buyer or the seller, does not depend on who legally has to pay it. It depends on the elasticity of demand and supply. If a government taxes a good with inelastic demand (like basic food, where people barely change how much they buy even if the price rises), the tax distortion is small, but the burden tends to fall harder on the buyer, since they cannot easily walk away from the purchase. Taxing an elastic good (like a luxury item) creates a bigger distortion, because buyers respond by simply purchasing much less, and this lost trade is what shows up as deadweight loss, value that vanishes entirely rather than moving from one party to another. If a 20 baht tax on a coffee pushes the price above what a customer is willing to pay, the sale simply never happens: the buyer loses the enjoyment they'd have gotten, the seller loses the sale, and the government collects nothing on that transaction. That lost value is the deadweight loss.",
          "This creates a real tension in tax policy. Ramsey's basic insight says that to minimize deadweight loss while raising a given amount of revenue, governments should tax goods with inelastic demand (like food) at higher rates and goods with elastic demand (like luxuries) at lower rates, since taxing inelastic goods causes less distortion in behavior. This is efficient, but it directly conflicts with fairness, since taxing food heavily burdens poor households the most, who spend a bigger share of their income on necessities. Later research tries to soften this conflict, suggesting governments could tax income-elastic and price-elastic goods that only wealthier people buy, like cosmetics, at higher rates than necessities like food, blending efficiency with equity concerns."
        ],
        notes: [
          "Tax: a mandatory recurring fee paid to government, the main source of government revenue since government does not sell products or earn profit.",
          "Tax avoidance (legal, uses loopholes, morally questionable) versus tax evasion (illegal, fraudulent, e.g. underreporting income, hiding money offshore).",
          "Tax havens offer low or no tax and strong financial secrecy (e.g. Cayman Islands, British Virgin Islands). They cause government revenue loss (Apple owed €13 billion in back taxes to Ireland, 2016) and worsen inequality (2016 Panama Papers leak).",
          "Direct tax: paid straight to government by the liable person, cannot be shifted to someone else (e.g. personal/corporate income tax, inheritance tax, land and building tax). Scales with income and profit, considered equitable (ability to pay principle).",
          "Indirect tax: charged on goods and services, collected via an intermediary like a retailer (e.g. VAT/GST, excise duty, customs duty). Same rate for everyone, making it regressive since it burdens lower income earners proportionally more.",
          "Tax base: the total amount of income, property, consumption, or other activity subject to tax. Three broad categories: income, consumption, wealth. Thailand example: out of roughly 70 million people, 9.55 million filed as taxpayers, with 3.3 million earning at least the 25,000 baht/month filing threshold.",
          "<span class='f'>Ad valorem tax: after-tax price = P + (t × P)</span>, a percentage of price (e.g. 10% excise on sugary drinks). More expensive items pay more tax in baht terms, considered relatively progressive.",
          "<span class='f'>Specific tax: after-tax price = P + T</span>, a fixed baht amount per unit regardless of price (e.g. 5 baht/liter diesel excise). All price tiers pay the identical baht amount of tax.",
          "Tax incidence: who actually bears the tax burden (buyer versus seller) depends on the elasticity of demand and supply, not on who is legally required to pay it. It makes no difference to the outcome whether a tax is legally imposed on sellers or buyers.",
          "Deadweight loss: value that disappears entirely because a mutually beneficial trade no longer happens due to the tax, rather than money simply moving from one party (taxpayer) to another (government).",
          "Elasticity and distortion: taxing an inelastic good (necessity, like food) causes a small distortion since quantity demanded barely changes. Taxing an elastic good (luxury) causes a bigger distortion since quantity demanded falls a lot.",
          "Ramsey's basic insight: goods with low elasticity of demand should face higher tax rates (smaller efficiency loss per baht of revenue raised), and goods with high elasticity should face lower tax rates, to minimize total deadweight loss. This is efficient but can conflict with equity, since it means taxing necessities like food more heavily, which burdens the poor disproportionately. Later research suggests taxing income and price elastic luxury goods (e.g. cosmetics) at higher rates than necessities to balance efficiency with equity."
        ],
        formulas: [
          {name: "Ad Valorem Tax (percentage of price)", expr: "After-tax price = P + (t × P)", def: "P = pre-tax price. t = tax rate as a decimal (e.g. 10% excise tax means t = 0.10)."},
          {name: "Specific Tax (fixed amount per unit)", expr: "After-tax price = P + T", def: "P = pre-tax price. T = a fixed baht amount charged per unit, regardless of the item's price."}

        exercises: [
          {q: "What is the fundamental reason governments must rely on taxation for revenue?", a: "Governments do not sell products or earn profits like a business, so taxing income, purchases, and property is essentially their only way to fund public services and transfers."},
          {q: "Distinguish tax avoidance from tax evasion, with an example of each.", a: "Tax avoidance is legal, using loopholes in the law, such as claiming legitimate tax deductions. Tax evasion is illegal and fraudulent, such as underreporting sales revenue or hiding income in an offshore account."},
          {q: "Why do tax havens worsen income inequality, according to the lecture?", a: "Wealthy individuals and large corporations have the resources to research and exploit tax haven loopholes, while ordinary citizens typically cannot access the same offshore structures, so the benefit of reduced taxation concentrates among the already wealthy."},
          {q: "Classify each as a direct or indirect tax: personal income tax, VAT, inheritance tax, excise duty on alcohol.", a: "Direct: personal income tax, inheritance tax. Indirect: VAT, excise duty on alcohol."},
          {q: "Why are indirect taxes considered regressive?", a: "Because everyone pays the same rate regardless of income, a low-income and a high-income buyer pay the identical amount of tax on the identical purchase, so the tax takes a bigger share of income from the poorer buyer."},
          {q: "A government imposes a 10% ad valorem excise tax on a sugary drink. Calculate the after-tax price for pre-tax prices of 12, 15, and 20 baht.", a: "12: 12 + (0.10×12) = 13.2 baht. 15: 15 + (0.10×15) = 16.5 baht. 20: 20 + (0.10×20) = 22 baht."},
          {q: "A government instead imposes a specific tax of 5 baht per liter on diesel. Calculate the after-tax price for pre-tax prices of 12, 15, and 20 baht per liter.", a: "12: 12 + 5 = 17 baht. 15: 15 + 5 = 20 baht. 20: 20 + 5 = 25 baht."},
          {q: "Comparing the two previous exercises, which tax type increases the price of cheaper and pricier goods by the same baht amount: ad valorem or specific?", a: "Specific tax. It adds a fixed baht amount regardless of the item's original price, whereas ad valorem tax adds a bigger baht amount to more expensive items."},
          {q: "Does it matter, for the final market outcome, whether a tax is legally imposed on the buyer or the seller?", a: "No. The economic incidence of the tax, how the burden splits between buyer and seller, is the same either way. What determines the split is the elasticity of demand and supply, not who is legally required to remit the tax."},
          {q: "In your own words, explain what a deadweight loss is, using the coffee example from the lecture.", a: "A deadweight loss is value that disappears entirely rather than moving from one party to another. In the lecture's example, a tax pushes a coffee's price above what a customer is willing to pay, so the sale never happens: the customer loses the enjoyment they would have had, the cafe loses the sale, and the government collects no tax on it. That lost value, which nobody receives, is the deadweight loss."},
          {q: "Would taxing food (inelastic demand) or taxing wine (more elastic demand) create a bigger distortion in behavior?", a: "Taxing wine (elastic demand) creates a bigger distortion, because consumers respond to the price increase by cutting back purchases significantly. Taxing food (inelastic demand) causes a smaller change in quantity demanded, so less distortion."},
          {q: "State Ramsey's basic insight for efficient commodity taxation.", a: "Commodities with low elasticity of demand should face higher tax rates, and commodities with high elasticity of demand should face lower tax rates, since this combination minimizes the total deadweight loss for a given amount of revenue raised."},
          {q: "Why does following Ramsey's insight strictly create a conflict with the equity goal of taxation?", a: "Ramsey's rule calls for taxing inelastic necessities, like food, at high rates. But poorer households spend a larger share of their income on necessities, so a high tax on food falls disproportionately hard on them, undermining fairness even as it improves efficiency."}

      {
        id: "ec7", title: "Lecture 7 — Taxation and Negative Externalities",
        lecture: "Lecture 7 — Economic Analysis of Taxation (Part II)", filePath: "materials/econ/Lecture 7___Taxation_part II_2026 handout _6aa78fdddb3fa.pdf", textbookRef: "",
        summary: [
          "This lecture picks up two loose threads from taxation. First, why do people evade taxes at all, and what actually deters them? Second, can a tax be used not just to raise revenue, but to fix a problem in the economy itself, specifically the problem of one person's activity quietly harming someone else for free.",
          "Tax evasion is really a form of free riding. Everyone benefits from public goods and services, but an evader wants those benefits without paying their share, leaving everyone else to cover the gap. What keeps most people honest is not always guilt, since plenty of people who evade taxes feel no shame about it, plenty of the deterrent effect actually comes from the fear of getting caught, not from any moral discomfort. That is why the expected cost of evasion, the probability of getting caught multiplied by the penalty if you are, matters more in practice than the size of the penalty alone. Raising the penalty endlessly is not a real solution either, since a harsher penalty against a wrongly accused, innocent taxpayer becomes a bigger injustice too.",
          "The heart of this lecture is the idea of a negative externality, a cost that an activity creates for someone outside the transaction, a cost the market price never captures. A factory that pollutes a river is not charged for the harm to villagers downstream, so the factory's private cost of production is lower than the true cost to society as a whole. Because the good looks artificially cheap, the market ends up overproducing it.",
          "A Pigouvian tax is the classic fix. Set a tax exactly equal to the harm being created, the marginal external cost, and the firm's costs finally reflect the true, full social cost of what it is doing. Facing that higher cost, the firm produces less, and the externality shrinks along with it. Real world examples include a sin tax on tobacco, alcohol, or gambling, congestion pricing for driving into a crowded city center, and a carbon border tax like the EU's Carbon Border Adjustment Mechanism (CBAM), which affects Thai exports of plastics, steel, and aluminum by taxing imports from countries without their own carbon tax.",
          "The lecture also revisits tax incidence, but this time in a market without perfect competition, where a seller has enough market power that selling one more unit means lowering the price on every unit already sold, not just the new one. That makes marginal revenue (MR), the actual extra revenue from one more sale, smaller than the price itself. A profit-maximizing seller still picks the quantity where marginal revenue equals marginal cost (MR = MC), but because MR sits below the demand curve in this setting, the resulting price and quantity differ from what perfect competition would produce.",
          "The lecture's real takeaway is a simple accounting idea: marginal social cost equals marginal private cost plus marginal external cost (MSC = MPC + MEC). The market price only ever reflects the private half. An ordinary tax, layered on top of an already-efficient market, creates a deadweight loss. A Pigouvian tax does the opposite: by correcting a market that was already inefficient because of an uncounted externality, it actually removes a deadweight loss that was already there."
        ],
        notes: [
          "Tax evasion is a form of free riding, applying to any tax, especially income tax and VAT: an evader still gets the benefit of public goods and services without paying their share.",
          "People evade taxes for a few recurring reasons:<div class='point-list'><div class='point-row'><span class='point-arrow'>→</span>Absence of guilt or shame. Being caught is the real deterrent, not moral concern.</div><div class='point-row'><span class='point-arrow'>→</span>There are limits to how far penalties can rise, because of the danger of wrongly convicting an innocent taxpayer.</div><div class='point-row'><span class='point-arrow'>→</span>Tax amnesties (paying tax due plus reduced interest, penalty waived) bring evaders into the system but can upset taxpayers who were honest all along.</div></div>",
          "Common opportunities for evasion include self-employed income, services paid in kind (e.g. a dentist and lawyer trading services instead of paying each other, which blurs into avoidance), and smuggling across borders to avoid indirect taxes where prices differ.",
          "See the Formulas tab for how the expected cost of evasion is calculated.",
          "A <strong>negative externality</strong> is an activity that harms other people or the environment without that harm being reflected in the market price. Example: a factory polluting the air with CO2 without paying for the health or environmental damage it causes nearby.",
          "A <strong>Pigouvian tax</strong> corrects this market failure by making the source of the externality pay for the social cost of their action. Real examples:<div class='point-list'><div class='point-row'><span class='point-arrow'>→</span><strong>Sin tax</strong>, on goods considered harmful or addictive, like tobacco, alcohol, or gambling, discouraging excess consumption and helping cover the public health costs they create.</div><div class='point-row'><span class='point-arrow'>→</span><strong>Congestion pricing</strong>, a fee for driving into a crowded city center during peak hours, reducing traffic and pollution and encouraging public transport or cycling.</div><div class='point-row'><span class='point-arrow'>→</span><strong>Carbon Border Adjustment Mechanism (CBAM)</strong>, an EU import tax (effective October 2023) on goods from countries without their own carbon tax, affecting Thai exports of plastics, steel, and aluminum.</div></div>",
          "Assigned reading (Tax and Transfer Policy Institute, ANU, 2019, Tax Fact #4, \"Good Tax Policy: Taxing Negative Externalities\"): taxing a negative externality is one of the few taxes that reduces deadweight loss instead of creating it, since it pushes the market price back toward reflecting the true marginal social cost, not just the private cost. The reading also distinguishes a cost-side externality (like factory pollution, where marginal social cost exceeds marginal private cost) from a consumption externality (where marginal social benefit differs from marginal private benefit), using cycling to work as an example: the private benefits are things like a cheaper commute and better health, but the social benefits also include less traffic congestion and lower public health spending. When social benefit exceeds private benefit like this, the efficient policy runs the other way, a subsidy or incentive to encourage more of the activity, rather than a tax to discourage it.",
          "In markets without perfect competition (a monopolist or a few sellers, few substitutes), Marginal Revenue (MR) is less than price, since selling more requires lowering the price on all units sold, not just the extra one. See the Formulas tab for a worked example.",
          "<div style='background:var(--surface);border:1px solid var(--line);padding:18px;margin:6px 0;'><svg viewBox='0 0 500 300' style='width:100%;height:auto;max-width:460px;display:block;margin:0 auto;'><line x1='60' y1='250' x2='460' y2='250' style='stroke:var(--line);stroke-width:1'/><line x1='60' y1='250' x2='60' y2='20' style='stroke:var(--line);stroke-width:1'/><text x='55' y='15' font-size='12' text-anchor='end' style='fill:var(--charcoal)'>Price, MC</text><text x='450' y='268' font-size='12' text-anchor='end' style='fill:var(--charcoal)'>Quantity</text><line x1='178' y1='250' x2='178' y2='99' stroke-dasharray='4,3' style='stroke:var(--fdef-text);stroke-width:1'/><line x1='60' y1='99' x2='178' y2='99' stroke-dasharray='4,3' style='stroke:var(--fdef-text);stroke-width:1'/><text x='178' y='265' font-size='11' text-anchor='middle' style='fill:var(--charcoal)'>Q₀</text><text x='48' y='103' font-size='11' text-anchor='end' style='fill:var(--charcoal)'>P₀</text><path d='M60,220 C120,215 220,150 300,50' fill='none' style='stroke:var(--coral);stroke-width:2.5'/><text x='305' y='48' font-size='12' style='fill:var(--coral)'>Marginal cost</text><line x1='60' y1='40' x2='420' y2='220' style='stroke:var(--charcoal);stroke-width:2.5'/><text x='425' y='224' font-size='12' style='fill:var(--charcoal)'>Demand curve</text><line x1='60' y1='40' x2='280' y2='220' style='stroke:var(--teal);stroke-width:2.5'/><text x='230' y='234' font-size='12' style='fill:var(--teal)'>Marginal revenue</text><circle cx='178' cy='136.5' r='3.5' style='fill:var(--ink)'/></svg><p style='font-family:-apple-system,sans-serif;font-size:12.5px;color:var(--fdef-text);margin:8px 0 0;text-align:center;'>Profit-maximizing output under imperfect competition: MR = MC sets Q₀, then price P₀ is read off the demand curve above it, not off the MR curve.</p></div>",
          "Profit-maximizing firms, in any market structure, choose the quantity where <strong>MR = MC</strong> (marginal revenue equals marginal cost). The matching price is then read off the demand curve at that quantity.",
          "Conclusion: private cost is not the same as social cost. <strong>Marginal social cost = marginal private cost + marginal external cost (MSC = MPC + MEC)</strong>, but the market price only reflects the private half, so the market overproduces the good. An ordinary tax on an already-efficient market creates a deadweight loss. A Pigouvian tax, correcting a market that was already inefficient, removes one instead."

        formulas: [
          {name: "Expected Cost of Tax Evasion", expr: "Expected value of penalty = probability of detection × penalty level",
            symbols: [{sym: "probability of detection", def: "the chance that the tax authority catches the evasion"}, {sym: "penalty level", def: "the fine or punishment imposed if caught"}],
            def: "The expected cost, not the penalty alone, is what actually deters evasion in practice.",
            example: "<p>A tax authority catches evasion 20% of the time (probability = 0.20), and the penalty for being caught is 50,000 baht.</p><span class='f'>Expected value of penalty = 0.20 × 50,000 = 10,000 baht</span><p>A rational evader compares this expected cost, not the full 50,000 baht penalty, against how much tax they would save by evading.</p>"
          },
          {name: "Marginal Revenue, Imperfect Competition", expr: "MR = ΔTotal Revenue / ΔQuantity",
            symbols: [{sym: "ΔTotal Revenue", def: "the change in total revenue from selling more units"}, {sym: "ΔQuantity", def: "the change in the number of units sold"}],
            def: "In imperfect competition, MR is less than price, since selling more units requires lowering the price on every unit, not just the extra one.",
            example: "<p>A seller sells 1,000 units at 10 baht each (total revenue = 10,000 baht). To sell 2,000 units, the price must drop to 9 baht each (total revenue = 18,000 baht).</p><span class='f'>MR = (18,000 − 10,000) / (2,000 − 1,000) = 8,000 / 1,000 = 8 baht per additional unit</span><p>Even though the new price is 9 baht, the marginal revenue from that 1,000th extra unit is only 8 baht, since lowering the price also reduced revenue from the first 1,000 units.</p>"
          },
          {name: "Marginal Social Cost", expr: "MSC = MPC + MEC",
            symbols: [{sym: "MPC", def: "marginal private cost, the cost the producer actually pays"}, {sym: "MEC", def: "marginal external cost, the uncounted harm imposed on others"}],
            def: "The market price only reflects MPC, which is why an activity with a real externality gets overproduced.",
            example: "<p>A factory's marginal private cost of production is 40 baht per unit. Pollution from that unit causes 15 baht of uncounted harm to nearby residents.</p><span class='f'>MSC = 40 + 15 = 55 baht per unit</span><p>A Pigouvian tax of 15 baht per unit would make the factory face the full 55 baht social cost.</p>"
          }

        exercises: [
          {q: "Why is tax evasion described as a form of free riding?", a: "An evader still benefits from the public goods and services taxes fund, but avoids contributing their share, shifting the burden onto everyone who does pay."},
          {q: "According to the lecture, what actually deters most tax evasion: moral guilt, or something else?", a: "Something else, mainly the fear of being caught. Many evaders feel no guilt or shame about evading; the real deterrent is the risk of detection, not a moral concern."},
          {q: "A tax authority has a 15% chance of catching a given evasion, with a penalty of 80,000 baht if caught. Calculate the expected value of the penalty.", a: "Expected value = 0.15 × 80,000 = 12,000 baht."},
          {q: "Why can't governments simply keep raising the penalty for tax evasion to deter it completely?", a: "Because harsher penalties raise the cost of wrongly convicting an innocent taxpayer, so there are practical and fairness limits to how high penalties can go."},
          {q: "What is a tax amnesty, and what is its downside?", a: "A tax amnesty lets evaders pay their tax due (sometimes with reduced interest and the penalty waived) to come back into the system. Its downside is that it can upset honest taxpayers who paid in full and on time, who see evaders getting off comparatively easy."},
          {q: "Define a negative externality and give the lecture's example.", a: "A negative externality is an activity that harms other people or the environment without that harm being reflected in the market price. Example: a factory polluting the air with CO2 without paying for the resulting health or environmental damage."},
          {q: "What is a Pigouvian tax trying to achieve?", a: "It aims to correct the market failure caused by a negative externality by making the source of the harm pay for the social cost of their action, so the market price reflects the true cost."},
          {q: "Name three real-world examples of a Pigouvian tax from the lecture.", a: "Any three of: a sin tax on tobacco, alcohol, or gambling; congestion pricing for driving into a crowded city center; the EU's Carbon Border Adjustment Mechanism (CBAM)."},
          {q: "How does CBAM affect Thailand specifically, according to the lecture?", a: "It affects Thai exports of plastics, steel, and aluminum, since CBAM is an EU import tax on goods from countries that do not have their own carbon tax."},
          {q: "A seller sells 500 units at 20 baht each. To sell 800 units, the price must drop to 18 baht each. Calculate the marginal revenue.", a: "Total revenue at 500 units = 10,000 baht. Total revenue at 800 units = 14,400 baht. MR = (14,400 − 10,000) / (800 − 500) = 4,400 / 300 ≈ 14.67 baht per additional unit."},
          {q: "Why is MR less than price in a market without perfect competition?", a: "Because a seller with market power has to lower the price on all existing units sold, not just the new one, in order to sell more, so the extra revenue gained from the additional unit is reduced by the lost revenue on the earlier units."},
          {q: "What condition defines the profit-maximizing quantity for any firm, regardless of market structure?", a: "The quantity where marginal revenue equals marginal cost, MR = MC."},
          {q: "A factory's marginal private cost is 60 baht per unit, and it creates 25 baht of uncounted harm to nearby residents per unit. Calculate the marginal social cost.", a: "MSC = 60 + 25 = 85 baht per unit."},
          {q: "Using the previous question, what size Pigouvian tax would make the factory face the full social cost of its production?", a: "A tax of 25 baht per unit, equal to the marginal external cost, would raise the factory's effective cost from 60 to 85 baht per unit, matching the true marginal social cost."},
          {q: "Why does an ordinary tax create a deadweight loss, while a Pigouvian tax removes one?", a: "An ordinary tax is added on top of a market that was already efficient, so it distorts behavior and creates a new deadweight loss. A Pigouvian tax is applied to a market that was already inefficient because of an uncounted externality, so correcting that mispricing removes a deadweight loss that already existed rather than creating a new one."},
          {q: "What is a consumption externality, and how does it differ from the factory pollution example?", a: "Factory pollution is a cost-side externality: the marginal social cost exceeds the marginal private cost, since the factory does not pay for the harm it causes. A consumption externality is on the benefit side instead: the marginal social benefit of an activity differs from its marginal private benefit. Cycling to work is the example given, its private benefits (cheaper commute, better health) are smaller than its full social benefits (also less congestion and lower public health costs)."},
          {q: "If an activity has a positive consumption externality (social benefit exceeds private benefit), should the efficient policy be a tax or a subsidy? Why?", a: "A subsidy. Taxing the activity would push it even further below its socially efficient level. Since the market already under-provides an activity whose social benefit exceeds its private benefit, a subsidy or incentive encourages more of it, moving the market closer to the efficient outcome, the mirror image of how a Pigouvian tax discourages an activity with a negative externality."}
        ]
      },

    funFact: "A z-score of 2 or higher looks unremarkable written down, but it means a result sits in roughly the top 2 to 3 percent of a normal distribution, rare enough that most researchers would call it statistically significant.",

      {
        id: "dp1", title: "Ch.1 — Introduction to Statistics",
        lecture: "Stats 2026 lecture_1_2026.pdf", filePath: "materials/datapolicy/Stats 2026 lecture_1_2026.pdf", textbookRef: "Chapter 1",
        summary: [
          "This chapter sets up the vocabulary that every later chapter assumes you already know. A population is everyone you actually care about, the full group. A sample is a smaller group you actually measure, standing in for that population because measuring everyone is usually impossible or too expensive.",
          "That distinction carries through into two more pairs of words. A parameter describes a population, a statistic describes a sample, they're the same kind of number, just describing a different sized group. Descriptive statistics just summarizes what you found in front of you. Inferential statistics uses a sample to make an educated guess about the whole population you couldn't fully measure.",
          "One idea trips people up constantly: sampling error. If you take a sample and its average doesn't exactly match the true population average, that's not a mistake you made, it's a normal, expected gap that happens just because a sample is smaller than the whole population.",
          "Variables come in two flavors. A discrete variable has no meaningful values in between its steps, like number of siblings, you can't have 2.5 siblings. A continuous variable can take any value, including fractions, like height. Continuous scores also have real limits that stretch half a unit above and below the recorded number, since a height of 170cm actually represents anything from 169.5 to 170.5.",
          "Scales of measurement rank from weakest to strongest in how much information they carry. Nominal scales are just labels with no order, like eye color. Ordinal scales have a ranked order but no consistent gap between ranks, like first, second, third place. Interval scales have equal spacing between values but no true zero, like temperature in Celsius. Ratio scales have equal spacing and a true zero, like height or weight, meaning zero really means none.",
          "When a study looks at two variables together instead of one, there are two different ways to structure it, and telling them apart matters. The correlational method measures two things about the same group of people and looks for a pattern between them, but it can only ever show that a relationship exists, never that one thing causes the other. Comparing groups is different: here, one variable defines the groups themselves (like a treatment group and a control group), and a second variable is measured to compare across those groups.",
          "Only a true experiment, where a researcher deliberately manipulates one variable and controls everything else, can support a cause and effect claim. The variable the researcher manipulates is the independent variable, since nothing in the study influences its value. The variable that gets measured to see the effect is the dependent variable, since its value is thought to depend on the independent variable. Researchers rule out other explanations through control: randomly assigning people to groups, matching groups on key traits, or holding other conditions constant, and by comparing an experimental condition (which gets the real treatment) against a control condition (which gets no treatment or a neutral placebo) as a baseline.",
          "Not every two-group comparison is a true experiment though. In non-experimental designs, like comparing pre-existing groups the researcher didn't assign (non-equivalent groups) or measuring the same people before and after time has passed (pre-test/post-test), the researcher cannot fully control who ends up in which group or what else changed over time. These still compare groups, but the grouping variable is called quasi-independent rather than truly independent, since it wasn't under the researcher's control."
        ],
        notes: [
          "Population = everyone you care about. Sample = smaller group you measure to represent it. Parameter describes a population, statistic describes a sample.",
          "Descriptive stats just summarizes what you found. Inferential stats uses a sample to guess about the whole population.",

          "Discrete variable has no in-between values (siblings). Continuous variable can be any value including fractions (height). Real limits sit half a unit above and below a continuous score.",
          "Scales of measurement, weakest to strongest: Nominal (labels only), Ordinal (ranked order), Interval (equal spacing, no true zero), Ratio (equal spacing plus true zero).",
          "Two data structures for studying a relationship between variables:<div class='point-list'><div class='point-row'><span class='point-arrow'>→</span><strong>Correlational method</strong>, one group, two variables measured on each person, looking for a pattern. Can show a relationship exists, never that one causes the other.</div><div class='point-row'><span class='point-arrow'>→</span><strong>Comparing groups</strong>, one variable defines the groups, a second variable is measured and compared across them. Used by both experimental and non-experimental studies.</div></div>",

          {q: "A researcher measures both hours of sleep and exam scores for the same group of 50 students, looking for a pattern. Which data structure is this, and what can it show?", a: "The correlational method. It can show that a relationship exists between sleep and exam scores, but it cannot prove that more sleep causes better scores."},
          {q: "A researcher randomly assigns participants to a new medication group or a placebo group, then measures recovery time. What is the independent variable, and what is the dependent variable?", a: "Independent variable: which treatment the participant received (medication or placebo). Dependent variable: recovery time, since it is measured to see the effect of the treatment."},
          {q: "Why is random assignment considered a method of control in an experiment?", a: "Randomly assigning participants to groups helps ensure the groups are similar on average in every other way, so any difference in outcome can be attributed to the treatment rather than to pre-existing differences between the groups."},
          {q: "A study compares math scores between students who chose to take an online course and students who chose an in-person course. Why is this not a true experiment?", a: "The researcher did not control who ended up in which group; students self-selected. This is a non-equivalent groups design, so the grouping variable is quasi-independent, not truly independent, and any difference could be due to pre-existing differences between the two kinds of students, not the course format itself."},

        summary: [
          "A frequency distribution is just an organized count of how often each score shows up in a dataset, turning a messy pile of raw numbers into something you can actually read. Instead of staring at 200 individual scores, you see how many people got each score, or fall in each range of scores.",
          "Proportion and percentage are the two easiest ways to describe a frequency without needing the total sample size in your head. A proportion is just that frequency divided by the total number of people. Multiply the proportion by 100 and you get a percentage, the same information in a more familiar form.",
          "When scores span a wide range, you group them into class intervals rather than listing every single value. There are a few rules of thumb for doing this well: keep every interval the same width, start each interval at a multiple of that width, and aim for around 10 or fewer intervals total, using a clean width like 2, 5, 10, or 20 rather than an awkward number.",
          "One subtle but exam-relevant trap: the label on an interval (its apparent limits, like 20 to 29) is not quite the same as its real limits (19.5 to 29.5). Real limits are exactly 1 unit narrower on each side than the apparent limits, and they matter because they're what you actually use in later calculations like the median of grouped data.",
          "Two chart types look similar but mean different things. A histogram is for numeric, continuous data, and its bars touch each other, since the scale flows continuously with no real gaps. A bar graph is for nominal or ordinal, category based data, and its bars have gaps between them, since the categories are separate and unordered by nature.",
          "Skew describes an asymmetric distribution, and it is always named after the direction of the tail, not where most of the scores pile up. A tail stretching to the right means positive skew, even though most scores actually cluster on the left. A tail stretching to the left means negative skew."
