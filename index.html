<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PopStudies26 — Study Reference</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🌍</text></svg>">
<style>
  :root{
    --paper:#F5F1E6;
    --ink:#161F38;
    --charcoal:#2A2823;
    --teal:#1F5C57;
    --teal-tint:#DDEEEC;
    --amber:#8A5A1F;
    --amber-tint:#F5E9D6;
    --coral:#8A2E24;
    --coral-tint:#F5E2DE;
    --line:#C9BFA3;
    --sidebar-bg:#161F38;
    --sidebar-text:#C7CCDC;
    --sidebar-active:#2A3B66;
    --surface:#FFFFFF;
    --surface-alt:#EEF2F8;
    --formula-bg:#EAEBF2;
    --fdef-text:#4A4E63;
    --quiz-hover:#F0D6D0;
    --quiz-border:#E0BCB4;
    --shadow-color:220,210,190;
    --slides-accent:#5B6472;
    --slides-tint:#EDEFF2;
    --body-font-weight:400;
    --body-font:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  }
  [data-theme="dark"]{
    --paper:#1B1E26;
    --ink:#EDEFF7;
    --charcoal:#C9CBD6;
    --teal:#5FC9BC;
    --teal-tint:#1B3532;
    --amber:#E0B067;
    --amber-tint:#362A16;
    --coral:#E4948A;
    --coral-tint:#3A241F;
    --line:#3A3E4C;
    --sidebar-bg:#10131A;
    --sidebar-text:#B7BCD1;
    --sidebar-active:#242A3D;
    --surface:#242833;
    --surface-alt:#232A3A;
    --formula-bg:#242833;
    --fdef-text:#A9ADC2;
    --quiz-hover:#3D2A28;
    --quiz-border:#4A3630;
    --shadow-color:0,0,0;
    --slides-accent:#9AA3B2;
    --slides-tint:#242833;
    --body-font-weight:450;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--paper);
    color:var(--charcoal);
    font-family:var(--body-font);
    font-weight:var(--body-font-weight);
    display:flex;
    min-height:100vh;
    cursor:default;
    transition:background 0.15s ease, color 0.15s ease;
  }
  ::selection{background:var(--teal-tint);}

  html{
    scrollbar-width:thin;
    scrollbar-color:var(--line) transparent;
  }
  ::-webkit-scrollbar{width:10px; height:10px;}
  ::-webkit-scrollbar-track{background:transparent;}
  ::-webkit-scrollbar-thumb{
    background:var(--line);
    border-radius:6px;
    border:2px solid var(--paper);
    background-clip:padding-box;
  }
  ::-webkit-scrollbar-thumb:hover{background:var(--teal);}

  nav.toc::-webkit-scrollbar-thumb{
    background:#3A3E52;
    border:2px solid var(--sidebar-bg);
    background-clip:padding-box;
  }
  nav.toc::-webkit-scrollbar-thumb:hover{background:#6FCFC4;}

  nav.toc{
    width:250px;
    flex-shrink:0;
    background:var(--sidebar-bg);
    border-right:none;
    padding:24px 0 40px;
    overflow-y:auto;
    height:100vh;
    position:sticky;
    top:0;
    box-shadow:6px 0 24px rgba(0,0,0,0.18);
    z-index:5;
    scrollbar-width:thin;
    scrollbar-color:#3A3E52 transparent;
  }
  .toc-brand{
    font-size:19px;
    font-weight:700;
    color:#fff;
    padding:0 20px 3px;
    letter-spacing:0.2px;
  }
  .toc-sub{
    padding:0 20px 16px;
    font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
    font-size:12px;
    color:#8891AB;
    border-bottom:1px solid #2A3357;
    margin-bottom:6px;
  }
  .toc-semester{
    padding:10px 20px 8px;
    font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
    font-size:11px;
    font-weight:700;
    color:#8891AB;
    text-transform:uppercase;
    letter-spacing:1px;
    border-top:1px solid #2A3357;
    margin-top:4px;
    cursor:pointer;
    transition:color 0.16s ease;
  }
  .toc-semester:hover{color:#6FCFC4;}
  .toc-semester.active-semester{color:#6FCFC4;}
  .toc-brand{cursor:pointer;}
  .toc-subject{
    padding:14px 20px 10px;
    font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
    font-weight:700;
    color:#EDEFF7;
    cursor:pointer;
    text-transform:uppercase;
    letter-spacing:0.5px;
    font-size:12px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:8px;
    transition:color 0.16s ease;
  }
  .toc-subject:hover{color:#6FCFC4;}
  .toc-subject.active-subject{color:#6FCFC4;}
  .toc-subject-label{flex:1;}
  .toc-chevron{
    display:inline-block;
    font-size:15px;
    font-weight:400;
    color:#5E6890;
    transform:rotate(-90deg);
    transition:transform 0.22s ease, color 0.16s ease;
    flex-shrink:0;
  }
  .toc-chevron.expanded{transform:rotate(0deg);}
  .toc-subject:hover .toc-chevron{color:#6FCFC4;}
  .toc-collapse{
    display:grid;
    grid-template-rows:0fr;
    overflow:hidden;
    opacity:0;
    transition:grid-template-rows 0.26s ease, opacity 0.2s ease;
  }
  .toc-collapse > ul.toc-list{min-height:0; overflow:hidden;}
  .toc-collapse.expanded{
    grid-template-rows:1fr;
    opacity:1;
  }
  ul.toc-list{list-style:none;margin:0 0 4px;padding:0;}
  .toc-item{
    display:flex;
    align-items:baseline;
    gap:9px;
    padding:7px 20px 7px 28px;
    cursor:pointer;
    font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
    font-size:13.5px;
    color:var(--sidebar-text);
    border-left:3px solid transparent;
    transition:background 0.16s ease, border-left-color 0.16s ease, padding-left 0.16s ease;
  }
  .toc-item:hover{background:#1E2A4D; padding-left:32px;}
  .toc-item.active{
    border-left-color:#6FCFC4;
    background:var(--sidebar-active);
    color:#fff;
    font-weight:600;
  }
  .toc-num{
    font-family:'SF Mono','JetBrains Mono',monospace;
    font-size:11.5px;
    color:#5E6890;
    min-width:14px;
  }
  .toc-item.active .toc-num{color:#6FCFC4;}
  .toc-item.empty{color:#4B5478; font-style:italic; cursor:default;}

  #theme-toggle{
    margin:14px 20px 4px;
    padding:7px 12px;
    background:transparent;
    border:1px solid #3A3E52;
    color:var(--sidebar-text);
    font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
    font-size:12.5px;
    cursor:pointer;
    width:calc(100% - 40px);
    text-align:left;
  }
  #theme-toggle:hover{background:#1E2230; color:#fff;}

  main{
    flex:1;
    display:flex;
    justify-content:center;
  }
  #main-inner{
    width:100%;
    max-width:820px;
    padding:48px 56px 120px;
  }
  @keyframes fadeInUp{
    from{opacity:0; transform:translateY(10px);}
    to{opacity:1; transform:translateY(0);}
  }
  #main-inner.fade-in{animation:fadeInUp 0.34s ease;}
  #main-inner.fade-in ul.materials li,
  #main-inner.fade-in ul.notes li,
  #main-inner.fade-in ul.formulas li,
  #main-inner.fade-in .quiz-item,
  #main-inner.fade-in .overview-list li{
    animation:fadeInUp 0.4s ease backwards;
  }
  #main-inner.fade-in ul.materials li:nth-child(1),  #main-inner.fade-in ul.notes li:nth-child(1),  #main-inner.fade-in ul.formulas li:nth-child(1),  #main-inner.fade-in .quiz-item:nth-child(1),  #main-inner.fade-in .overview-list li:nth-child(1){animation-delay:0.02s;}
  #main-inner.fade-in ul.materials li:nth-child(2),  #main-inner.fade-in ul.notes li:nth-child(2),  #main-inner.fade-in ul.formulas li:nth-child(2),  #main-inner.fade-in .quiz-item:nth-child(2),  #main-inner.fade-in .overview-list li:nth-child(2){animation-delay:0.05s;}
  #main-inner.fade-in ul.materials li:nth-child(3),  #main-inner.fade-in ul.notes li:nth-child(3),  #main-inner.fade-in ul.formulas li:nth-child(3),  #main-inner.fade-in .quiz-item:nth-child(3),  #main-inner.fade-in .overview-list li:nth-child(3){animation-delay:0.08s;}
  #main-inner.fade-in ul.materials li:nth-child(4),  #main-inner.fade-in ul.notes li:nth-child(4),  #main-inner.fade-in ul.formulas li:nth-child(4),  #main-inner.fade-in .quiz-item:nth-child(4),  #main-inner.fade-in .overview-list li:nth-child(4){animation-delay:0.11s;}
  #main-inner.fade-in ul.materials li:nth-child(5),  #main-inner.fade-in ul.notes li:nth-child(5),  #main-inner.fade-in ul.formulas li:nth-child(5),  #main-inner.fade-in .quiz-item:nth-child(5),  #main-inner.fade-in .overview-list li:nth-child(5){animation-delay:0.14s;}
  #main-inner.fade-in ul.notes li:nth-child(6),  #main-inner.fade-in .quiz-item:nth-child(6){animation-delay:0.17s;}
  #main-inner.fade-in ul.notes li:nth-child(7),  #main-inner.fade-in .quiz-item:nth-child(7){animation-delay:0.20s;}
  #main-inner.fade-in .quiz-item:nth-child(8){animation-delay:0.23s;}
  #main-inner.fade-in .quiz-item:nth-child(n+9){animation-delay:0.26s;}
  .back-link{
    display:inline-flex;
    align-items:center;
    background:none;
    border:none;
    padding:0;
    margin-bottom:18px;
    font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
    font-size:13.5px;
    font-weight:600;
    color:var(--fdef-text);
    cursor:pointer;
    transition:color 0.16s ease;
  }
  .back-link:hover{color:var(--teal);}
  .eyebrow{
    font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
    font-size:13px;
    color:var(--teal);
    margin-bottom:5px;
  }
  h1.section-title{
    font-size:29px;
    color:var(--ink);
    margin:0 0 24px;
    line-height:1.25;
  }
  .tab-bar{
    display:flex;
    gap:4px;
    margin:0 0 30px;
    border-bottom:2px solid var(--line);
    overflow-x:auto;
  }
  .tab-btn{
    padding:11px 18px;
    background:none;
    border:none;
    font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
    font-weight:700;
    font-size:12.5px;
    text-transform:uppercase;
    letter-spacing:0.6px;
    color:var(--fdef-text);
    cursor:pointer;
    white-space:nowrap;
    border-bottom:3px solid transparent;
    margin-bottom:-2px;
    transition:color 0.18s ease, border-color 0.18s ease;
  }
  .tab-btn:hover{color:var(--teal);}
  .tab-btn.active{color:var(--teal); border-bottom-color:var(--teal);}
  .tab-panel{animation:fadeInUp 0.28s ease;}
  .subject-intro{
    font-size:16.5px;
    line-height:1.68;
    color:var(--charcoal);
    max-width:680px;
    margin:0 0 18px;
  }
  .fun-fact{
    background:var(--amber-tint);
    border-left:3px solid var(--amber);
    padding:14px 16px;
    font-size:14.5px;
    line-height:1.6;
    margin:0 0 8px;
  }
  .fun-fact-tag{
    display:block;
    font-family:'SF Mono','JetBrains Mono',monospace;
    font-size:11px;
    font-weight:700;
    text-transform:uppercase;
    letter-spacing:0.6px;
    color:var(--amber);
    margin-bottom:6px;
  }
  .semester-card{
    background:var(--surface-alt);
    border:1px solid var(--line);
    border-left:4px solid var(--teal);
    padding:20px 22px;
    margin-top:16px;
    max-width:420px;
    cursor:pointer;
    transition:transform 0.18s ease, box-shadow 0.18s ease;
  }
  .semester-card:hover{
    transform:translateY(-2px);
    box-shadow:0 8px 20px rgba(var(--shadow-color),0.16);
  }
  .semester-card-title{
    font-size:18px;
    font-weight:700;
    color:var(--ink);
    margin-bottom:4px;
  }
  .semester-card-sub{
    font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
    font-size:13px;
    color:var(--fdef-text);
  }
  .subject-grid{
    display:grid;
    grid-template-columns:repeat(auto-fill, minmax(260px, 1fr));
    gap:14px;
    margin-top:16px;
  }
  .subject-card{
    background:var(--surface-alt);
    border:1px solid var(--line);
    border-left:4px solid var(--teal);
    padding:18px 20px;
    cursor:pointer;
    transition:transform 0.18s ease, box-shadow 0.18s ease;
  }
  .subject-card:hover{
    transform:translateY(-2px);
    box-shadow:0 8px 20px rgba(var(--shadow-color),0.16);
  }
  .subject-card-title{
    font-size:15.5px;
    font-weight:700;
    color:var(--ink);
    margin-bottom:8px;
    line-height:1.35;
  }
  .subject-card-teaser{
    font-size:13.5px;
    line-height:1.55;
    color:var(--charcoal);
    margin-bottom:10px;
  }
  .subject-card-count{
    font-family:'SF Mono','JetBrains Mono',monospace;
    font-size:11.5px;
    color:var(--teal);
    text-transform:uppercase;
    letter-spacing:0.5px;
  }
  h2.block-title{
    font-size:13px;
    color:#fff;
    margin:34px 0 14px;
    font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
    font-weight:700;
    text-transform:uppercase;
    letter-spacing:0.8px;
    padding:7px 12px;
    display:inline-block;
  }
  h2.block-materials{background:var(--slides-accent);}
  h2.block-summary{background:#3A5A8C;}
  h2.block-notes{background:var(--teal);}
  h2.block-exercises{background:var(--coral);}
  h2.block-formulas{background:#33374A;}

  .summary-box{
    background:var(--surface-alt);
    border-left:3px solid #3A5A8C;
    padding:20px 22px;
    margin-bottom:10px;
  }
  .summary-box p{
    font-size:16px;
    line-height:1.68;
    margin:0 0 14px;
  }
  .summary-box p:last-child{margin-bottom:0;}
  .summary-box strong{color:var(--ink);}

  ul.formulas{margin:0; padding:0; list-style:none;}
  ul.formulas li{
    font-size:15.5px;
    line-height:1.6;
    padding:12px 14px;
    background:var(--formula-bg);
    border-left:3px solid var(--ink);
    margin-bottom:8px;
    transition:transform 0.18s ease, box-shadow 0.18s ease;
  }
  ul.formulas li:hover{
    transform:translateY(-2px);
    box-shadow:0 6px 16px rgba(var(--shadow-color),0.16);
  }
  ul.formulas li .fname{
    display:block;
    font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
    font-size:12px;
    font-weight:700;
    text-transform:uppercase;
    letter-spacing:0.4px;
    color:var(--ink);
    margin-bottom:6px;
  }
  ul.formulas li .fx{
    display:block;
    font-family:'SF Mono','JetBrains Mono',monospace;
    font-size:15px;
    color:var(--ink);
    font-weight:700;
    margin-bottom:5px;
  }
  ul.formulas li .fdef{
    font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
    font-size:13.5px;
    color:var(--fdef-text);
    line-height:1.55;
  }
  p.body-text{
    font-size:15.5px;
    line-height:1.6;
    max-width:660px;
    margin:0 0 12px;
  }
  .empty-note{
    font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
    font-size:14px;
    color:#8A8578;
    padding:8px 0 4px;
  }

  #gate{
    position:fixed; inset:0; background:var(--paper);
    display:flex; align-items:center; justify-content:center;
    z-index:1000;
  }
  #gate-box{
    background:var(--surface); border:1px solid var(--line);
    padding:40px 36px; max-width:340px; width:90%;
    text-align:center;
  }
  #gate-box h2{
    font-size:20px; color:var(--ink); margin:0 0 6px;
    font-family:var(--body-font);
  }
  #gate-box p{
    font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
    font-size:13.5px; color:#8A8578; margin:0 0 20px;
  }
  #gate-box input{
    width:100%; padding:10px 12px; font-size:15px;
    border:1px solid var(--line); margin-bottom:12px;
    font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
    box-sizing:border-box;
    background:var(--surface); color:var(--charcoal);
  }
  #gate-box button{
    width:100%; padding:10px; font-size:14.5px; font-weight:600;
    background:var(--teal); color:#fff; border:none; cursor:pointer;
    font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
  }
  #gate-box button:hover{background:#25534F;}
  #gate-error{
    color:#B34A3C; font-size:13px; margin-top:10px; height:16px;
    font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
  }
  #app{display:none; width:100%;}

  ul.materials{list-style:none;margin:0;padding:0;}
  ul.materials li{
    font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
    font-size:14.5px;
    padding:12px 14px;
    background:var(--slides-tint);
    border-left:3px solid var(--slides-accent);
    margin-bottom:8px;
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:12px;
    transition:transform 0.18s ease, box-shadow 0.18s ease;
  }
  ul.materials li{transform-style:preserve-3d; perspective:600px;}
  ul.materials li:hover{
    transform:translateY(-3px) rotateX(2deg);
    box-shadow:0 10px 22px rgba(var(--shadow-color),0.2);
  }
  ul.materials li button.view-btn{
    color:#fff;
    background:var(--slides-accent);
    border:none;
    text-decoration:none;
    font-weight:600;
    cursor:pointer;
    font-size:13px;
    padding:6px 14px;
    font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
    transition:background 0.18s ease, transform 0.18s ease;
  }
  ul.materials li button.view-btn:hover{background:var(--ink); transform:scale(1.05);}
  .mat-tag{
    font-family:'SF Mono',monospace;
    font-size:10.5px;
    color:var(--slides-accent);
    white-space:nowrap;
  }
  #pdf-panel{
    display:none;
    width:94vw;
    max-width:1500px;
    box-sizing:border-box;
    position:relative;
    left:50%;
    transform:translateX(-50%);
    margin:14px 0 26px;
    border:2px solid var(--slides-accent);
    box-shadow:0 10px 30px rgba(var(--shadow-color),0.22);
    animation:fadeInUp 0.3s ease;
  }
  #pdf-panel iframe{
    width:100%;
    height:88vh;
    border:none;
    display:block;
  }
  #pdf-panel:fullscreen iframe{
    height:100vh;
  }
  @media (max-width:800px){
    #pdf-panel{
      width:100vw;
      max-width:100vw;
    }
    #pdf-panel iframe{
      height:78vh;
    }
  }
  #pdf-panel-bar{
    display:flex;
  }
  .pdf-panel-btn{
    background:var(--slides-accent);
    color:#fff;
    border:none;
    border-left:1px solid rgba(255,255,255,0.3);
    padding:8px 14px;
    font-size:13px;
    font-weight:600;
    cursor:pointer;
    flex:1;
    text-align:center;
    text-decoration:none;
    font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
  }
  .pdf-panel-btn:first-child{
    border-left:none;
  }

  ul.notes{margin:0; padding:0; list-style:none;}
  ul.notes li{
    font-size:15.5px;
    line-height:1.6;
    padding:12px 14px 12px 16px;
    background:var(--teal-tint);
    border-left:3px solid var(--teal);
    margin-bottom:8px;
    transition:transform 0.18s ease, box-shadow 0.18s ease;
  }
  ul.notes li:hover{
    transform:translateY(-2px);
    box-shadow:0 6px 16px rgba(var(--shadow-color),0.16);
  }
  .f{
    display:block;
    font-family:'SF Mono','JetBrains Mono',monospace;
    font-size:15px;
    font-weight:700;
    color:var(--ink);
    background:var(--surface);
    padding:8px 10px;
    border-left:3px solid var(--teal);
    margin:10px 0 8px;
  }
  .point-list{
    display:flex;
    flex-direction:column;
    gap:9px;
    margin:12px 0 4px;
  }
  .point-row{
    display:flex;
    align-items:baseline;
    gap:10px;
  }
  .point-arrow{
    flex-shrink:0;
    color:var(--teal);
    font-weight:700;
  }
  .def-list{
    display:flex;
    flex-direction:column;
    gap:5px;
    background:var(--surface);
    border-left:3px solid var(--line);
    padding:10px 12px;
    margin:0 0 10px;
  }
  .def-row{
    font-family:'SF Mono','JetBrains Mono',monospace;

        summary: [
          "This session is about measuring death properly, which turns out to be trickier than it sounds, and then about a bigger idea called health measurement, which tries to capture not just whether people die but how much illness and disability happens along the way.",
          "The Crude Death Rate is the simplest way to measure mortality, just total deaths divided by the population. But here's the catch: a country full of retirees will always show a higher CDR than a country full of young people, even if both countries are equally healthy at every single age, simply because old people die more often no matter where they live. The CDR mixes together actual health risk with age structure, and that mixing is exactly what makes it misleading for comparing countries.",
          "The fix is standardization, and there are two ways to do it. Imagine comparing two runners' race times, except one ran on flat ground and one ran uphill, you'd want to adjust for the hill before declaring a winner. Direct standardization applies the same 'flat ground' (a shared standard age structure) to both populations' own death rates, producing a fair, apples-to-apples number. Indirect standardization works the other way around: when a population is too small for its own age-specific rates to be reliable, you borrow a trusted reference population's rates instead, and see how many deaths would be 'expected' if your population behaved that way, then compare to what actually happened. That ratio is called the SMR, and anything above 100 means more deaths happened than expected.",

          "<strong>Direct standardization</strong> applies a shared standard population's age weights to each population's own age-specific rates, producing an Age-Standardized Death Rate (ASDR) in the same units as a crude rate. See the Formulas tab for a real worked example comparing Thailand and Japan.",
          "<strong>Indirect standardization</strong> is used when a study population's own age-specific rates are unreliable or based on small numbers. Instead, you apply a standard population's known rates to your study population's age structure, producing 'expected deaths', then compare to actually observed deaths as a Standardized Mortality Ratio (SMR). See the Formulas tab for a real worked example.",
          "Three common misconceptions worth avoiding:<div class='point-list'><div class='point-row'><span class='point-arrow'>\u2192</span>A standardized rate is not the population's real observed rate, it is a constructed, hypothetical number built for fair comparison.</div><div class='point-row'><span class='point-arrow'>\u2192</span>Two standardized rates are only comparable if they used the same standard population.</div><div class='point-row'><span class='point-arrow'>\u2192</span>An SMR of 100 does not mean average health in any absolute sense, it means average relative to whichever standard population was chosen as the reference.</div></div>",
          "Cause-specific mortality rate and proportional mortality both describe deaths from one specific cause, but answer different questions: one is a real rate against the population, the other just describes the mix of causes among deaths that already happened. See the Formulas tab for both calculations.",
          "<strong>Years of Potential Life Lost (YPLL)</strong> weights each death by how many years of life it cut short against a chosen reference age, so premature deaths in younger age bands count far more than deaths near or past the reference age. See the Formulas tab for a real worked example using Thailand's 2024 data.",
          "<strong>DALYs (Disability-Adjusted Life Years)</strong> combine years lost to early death with years lived in less than full health. See the Formulas tab for the full breakdown and two worked examples.",
          "Thailand's mortality snapshot (2024\u20132026 data):<div class='point-list'><div class='point-row'><span class='point-arrow'>\u2192</span>Crude death rate: 9.0 to 9.1 per 1,000.</div><div class='point-row'><span class='point-arrow'>\u2192</span>Life expectancy at birth: 77.1 years.</div><div class='point-row'><span class='point-arrow'>\u2192</span>Female life expectancy: 81.4 years. Male life expectancy: 72.9 years.</div><div class='point-row'><span class='point-arrow'>\u2192</span>Share of population aged 65+: about 15.4%.</div></div>A larger elderly share mechanically pushes CDR upward even where age-specific survival is actually improving, exactly the distortion standardization is built to correct for.",
          "Three Asian countries sit at three different points on the epidemiological transition (life expectancy figures, 2024\u20132026 data):<div class='point-list'><div class='point-row'><span class='point-arrow'>\u2192</span><strong>Japan</strong>, 85.2 years, late or post-transition, aged and chronic-disease-dominant.</div><div class='point-row'><span class='point-arrow'>\u2192</span><strong>Thailand</strong>, 77.1 years, late transition, rapidly aging and NCD-dominant but still catching up to Japan.</div><div class='point-row'><span class='point-arrow'>\u2192</span><strong>Philippines</strong>, 70.2 years, mid-transition, younger with more residual communicable-disease burden.</div></div>A single 'Asia' mortality profile would badly misrepresent all three."
        ],
        formulas: [
          {name: "Crude Death Rate (CDR)", expr: "CDR = (Total deaths / Mid-year population) \u00d7 1,000",
            symbols: [{sym: "Total deaths", def: "all deaths recorded in a year"}, {sym: "Mid-year population", def: "the population count around the middle of that year"}],
            def: "The simplest mortality indicator. Distorted by age structure, so use with caution when comparing populations.",
            example: "<p>A country records 550,000 total deaths with a mid-year population of 61,000,000.</p><span class='f'>CDR = (550,000 / 61,000,000) \u00d7 1,000 \u2248 9.0 deaths per 1,000 people</span>"
          },
          {name: "Age-Specific Mortality Rate (ASMR)", expr: "ASMR(x) = (Deaths to persons aged x / Mid-year population aged x) \u00d7 1,000",
            symbols: [{sym: "Deaths to persons aged x", def: "deaths within one specific age band"}, {sym: "Mid-year population aged x", def: "the mid-year population within that same age band"}],
            def: "Computed separately per age band. Removes the age-mixing problem within that band.",
            example: "<p>Among people aged 65 and over, there are 300,000 deaths against a population of 10,000,000.</p><span class='f'>ASMR(65+) = (300,000 / 10,000,000) \u00d7 1,000 = 30.0 deaths per 1,000 people aged 65+</span>"
          },
          {name: "Standardized Mortality Ratio (SMR)", expr: "SMR = (Observed deaths / Expected deaths) \u00d7 100",
            symbols: [
              {sym: "Observed deaths", def: "the actual number of deaths in the study population"},
              {sym: "Expected deaths", def: "the sum, across age groups, of the standard population's age-specific rate multiplied by the study population's count in that age group"}
            ],
            def: "SMR above 100 means excess mortality relative to the standard used.",
            example: "<p>Real data: if Thailand experienced Japan's age-specific mortality, it would be expected to have about 351,896 deaths in 2024. Thailand's actual observed deaths were 647,349.</p><span class='f'>SMR = (647,349 / 351,896) \u00d7 100 \u2248 184</span><p>Thailand experienced roughly 84% more deaths than it would under Japan's mortality risk, a genuine health gap, not an artifact of Thailand's different age structure.</p>"
          },
          {name: "Direct Standardization (worked example)", expr: "ASDR = \u03a3(Standard population weight at age x \u00d7 study population's own rate at age x)",
            symbols: [{sym: "Standard population weight at age x", def: "the age structure share taken from a shared reference population, e.g. the WHO World Standard Population"}, {sym: "study population's own rate at age x", def: "the age-specific mortality rate actually observed in the population being studied"}],
            example: "<p>Real data: Thailand's crude death rate is 9.03 per 1,000. Standardized to the WHO World Standard Population, it drops to 5.27. Japan's standardized rate on the same standard is 2.62.</p><span class='f'>Thailand : Japan \u2248 5.27 : 2.62 \u2248 2 times higher</span><p>Once age structure is held constant, Thailand's real risk gap versus Japan is roughly double, not the nearly 3.5 times gap the raw crude rates alone would suggest.</p>"
          },
          {name: "Cause-Specific Mortality Rate", expr: "Cause-specific mortality rate = (Deaths from cause C / Mid-year population) \u00d7 100,000",
            symbols: [{sym: "Deaths from cause C", def: "deaths attributed to one specific cause"}, {sym: "Mid-year population", def: "the total mid-year population, not just people with that condition"}],
            def: "Usually per 100,000 to keep less-common causes readable.",
            example: "<p>A country records 45,000 deaths from heart disease with a mid-year population of 60,000,000.</p><span class='f'>Cause-specific rate = (45,000 / 60,000,000) \u00d7 100,000 = 75 deaths per 100,000 people</span>"
          },
          {name: "Proportional Mortality", expr: "Proportional mortality = (Deaths from cause C / Total deaths) \u00d7 100",
            symbols: [{sym: "Deaths from cause C", def: "deaths attributed to one specific cause"}, {sym: "Total deaths", def: "all deaths from any cause"}],
            def: "Describes the mix of causes. Sensitive to the size of total deaths, so it is not a substitute for a population-based rate.",
            example: "<p>A country records 80,000 cancer deaths out of 550,000 total deaths.</p><span class='f'>Proportional mortality = (80,000 / 550,000) \u00d7 100 \u2248 14.5% of all deaths</span>"
          },
          {name: "Years of Potential Life Lost (YPLL)", expr: "YPLL = Σ[(Reference age − Age at death) × Deaths at that age], for ages below the reference age",
            symbols: [
              {sym: "Reference age", def: "a cutoff age chosen to represent a premature death threshold, commonly 65 or 75"},
              {sym: "Age at death", def: "the midpoint age of each age band being summed"},
              {sym: "Deaths at that age", def: "the number of deaths recorded in that age band"}
            ],
            def: "Weights deaths by how many years of life they cut short, so a death at 20 counts far more than a death at 74. Age bands at or above the reference age contribute 0.",
            example: "<p>Real data: using Thailand's 2024 estimated deaths by age band and a reference age of 75, every age band below 75 contributes (75 − midpoint age) × deaths in that band. Summing all 15 contributing bands (ages 0–74) gives a total.</p><span class='f'>Total YPLL (reference age 75) = 6,686,098 years</span><p>This single number captures how much of Thailand's mortality burden falls on younger ages, information a crude death rate or even an age-standardized rate alone does not show.</p>"
          },
          {name: "Disability-Adjusted Life Years (DALYs)", expr: "DALYs = YLL + YLD",
            symbols: [
              {sym: "YLL", def: "Years of Life Lost to premature death"},
              {sym: "YLD", def: "Years Lived with Disability, equal to duration times a disability weight from 0 (full health) to 1 (equivalent to death)"}
            ],
            example: "<p>A death causes 50 years of life lost (YLL = 50). 100 people live with moderate hearing loss (disability weight 0.02) for 1 year each.</p><span class='f'>YLD = 100 \u00d7 1 \u00d7 0.02 = 2</span><span class='f'>DALYs = 50 + 2 = 52</span><p><strong>Second example:</strong> YLL = 24. 40 people live 8 years with a condition weighted 0.15.</p><span class='f'>YLD = 40 \u00d7 8 \u00d7 0.15 = 48</span><span class='f'>DALYs = 24 + 48 = 72</span>"
          }
        ],
        exercises: [
          {q: "Calculate the CDR: 550,000 total deaths, mid-year population 61,000,000.", a: "CDR = (550,000 / 61,000,000) \u00d7 1,000 \u2248 9.0 deaths per 1,000 people."},
          {q: "Why can two populations with identical age-specific mortality risk still show different CDRs?", a: "Because CDR mixes actual mortality risk with age structure. The population with an older age distribution will show a higher CDR even if age-specific risk is identical."},
          {q: "Calculate the ASMR for ages 65+: 300,000 deaths, population aged 65+ is 10,000,000.", a: "ASMR = (300,000 / 10,000,000) \u00d7 1,000 = 30.0 deaths per 1,000 people aged 65+."},
          {q: "What's the key data difference between direct and indirect standardization?", a: "Direct standardization needs reliable age-specific rates for the population being studied. Indirect standardization is used when those rates are unreliable or based on small numbers, instead borrowing a standard population's rates and applying them to the study population's own age structure."},
          {q: "When would you prefer indirect standardization over direct?", a: "When your study population is small (e.g. an occupational cohort or small district) and its own age-specific rates would be statistically unstable, but you know its age structure and total observed deaths."},
          {q: "A study population has 133.9 expected deaths and 160 observed deaths. Calculate and interpret the SMR.", a: "SMR = (160 / 133.9) \u00d7 100 \u2248 119.5. This means the population experienced about 19.5% more deaths than expected under the standard population's age-specific mortality."},
          {q: "Interpret an SMR of 184 in one sentence.", a: "The population experienced about 84% more deaths than it would have if every age group carried the standard population's age-specific mortality risk."},
          {q: "True or False: an SMR of 100 always means 'average health' in an absolute sense.", a: "False. It means average relative to whichever standard population's rates were used as the reference. A different standard would shift what SMR = 100 represents."},
          {q: "True or False: a standardized rate is the population's real, observed death rate.", a: "False. It's a hypothetical, constructed number showing what the rate would be under a specific standard age structure. The crude rate is the real observed rate."},
          {q: "Calculate the cause-specific mortality rate: 45,000 deaths from heart disease, mid-year population 60,000,000.", a: "(45,000 / 60,000,000) \u00d7 100,000 = 75 deaths per 100,000 people."},
          {q: "Calculate proportional mortality: 80,000 cancer deaths out of 550,000 total deaths.", a: "(80,000 / 550,000) \u00d7 100 \u2248 14.5% of all deaths."},
          {q: "What's a key limitation of proportional mortality as a measure?", a: "It's sensitive to the size of the denominator (total deaths), so it describes the mix of causes but should never substitute for a real population-based rate."},
          {q: "Calculate DALYs: a condition causes 30 years of life lost (YLL), plus 50 people living 2 years each with a disability weight of 0.1.", a: "YLD = 50 \u00d7 2 \u00d7 0.1 = 10. DALYs = 30 + 10 = 40."},
          {q: "What does DALY stand for, and what two components make it up?", a: "Disability-Adjusted Life Year. It equals Years of Life Lost (YLL) to premature death plus Years Lived with Disability (YLD)."},
          {q: "What do disability weights of 0 and 1 represent?", a: "0 means full health (no disability burden). 1 means a health state equivalent to death."},
          {q: "Real data: whose life expectancy at birth is higher, Thailand or Japan, and by roughly how much?", a: "Japan's is higher, about 85.2 years versus Thailand's 77.1 years, a gap of about 8 years."},
          {q: "Of Japan, Thailand, and the Philippines, which is furthest along the epidemiological transition, and which is least?", a: "Japan is furthest along (late/post-transition, aged, chronic-disease-dominant). The Philippines is least far along (mid-transition, younger, more communicable-disease burden)."},
          {q: "Why might Thailand's CDR be rising over time even if age-specific mortality is actually improving?", a: "Because Thailand's population is aging. An older age structure mechanically pushes the crude rate upward, independent of whether survival at each specific age is getting better."},
          {q: "What WHO classification system is used to code cause of death internationally?", a: "ICD-11, the International Classification of Diseases."},
          {q: "A news report says 'Country X has a lower death rate than Country Y, so it must have better healthcare.' What question should you ask before accepting this claim?", a: "Whether the comparison accounts for age structure. A lower crude death rate can simply reflect a younger population rather than genuinely better health outcomes, so you'd want to see age-specific or standardized rates before concluding anything about healthcare quality."},
          {q: "Real data: Thailand recorded 5,820 estimated deaths in the 0–4 age band (midpoint age 2) in 2024. Using a reference age of 75, calculate that band's YPLL contribution.", a: "YPLL contribution = (75 − 2) × 5,820 = 73 × 5,820 = 424,860 years."},
          {q: "Why does a death at age 20 contribute far more to total YPLL than a death at age 74, even though both are just one death?", a: "YPLL weights each death by the gap between the reference age and the age at death. A death at 20 (against a reference age of 75) contributes 55 years, while a death at 74 contributes only 1 year, so YPLL deliberately gives more weight to premature deaths than a simple death count does."},
          {q: "Real data: Thailand's total YPLL for 2024 (reference age 75) is about 6,686,098 years. Why is this number more useful than the crude death rate for setting public health priorities?", a: "The crude death rate treats every death equally regardless of age, so it can't distinguish a country losing mostly elderly people from one losing many young or middle-aged people. YPLL highlights where premature death is concentrated, which is exactly the information needed to target prevention programs where they save the most years of life."}

            {type: "interpretation", prompt: "Thailand's crude death rate is roughly 3.5 times a typical rate for Japan, but your SMR and standardized-rate calculations above show a real risk gap closer to 2 times. In 2 to 3 sentences, explain why these two comparisons give such different answers, and which one you would trust for a fair health comparison between the two countries.", answer: "Thailand's raw crude death rate is inflated by the fact that Thailand already has an older population than Japan's, since roughly 15.4% of Thais are aged 65 and over. Age alone raises mortality risk regardless of how healthy a country's health system is, so the crude rate mixes real health risk together with this age structure effect. Once age structure is held constant, through standardization (SMR of about 184, standardized rates roughly 2 times higher), the real, fair comparison shows Thailand still has a genuine, meaningful mortality disadvantage against Japan, just not as extreme as the raw crude rates alone would suggest. The standardized comparison is the one to trust."}

      {
        id: "f5", title: "Session 5 \u2014 Life Tables",
        lecture: "Session 5 \u2014 Life Tables Applied Lab", filePath: "materials/fundamental/Session_5_Life_Tables_Applied_Lab_2026_v2_1.pdf", textbookRef: "",
        summary: [
          "A life table can feel intimidating with all its subscripts and Greek-letter-adjacent notation, but the underlying idea is simple: imagine 100,000 imaginary babies born on the same day, and you follow this pretend group through life, applying real mortality rates at each age to see how many are still alive at every stage. It's like a simulation, not real people, but built from real death rates, used to summarize an entire population's mortality pattern into one clean, connected table.",
          "The whole table is really just six linked steps, each one feeding the next, like a chain of dominoes. You start with the observed death rate at each age (nMx). That gets converted into a true probability of dying within that age interval (nqx). From there you can calculate how many of your original 100,000 are still alive at each age (lx), how many died in each interval (ndx), how many person-years the group lived through in that interval (nLx), and finally how many years are left to live on average at each age (ex), which is life expectancy.",
          "<div style='background:var(--surface);border:1px solid var(--line);padding:18px;margin:6px 0;'><svg viewBox='0 0 600 130' style='width:100%;height:auto;'><g font-family='-apple-system,sans-serif' font-size='12' text-anchor='middle'><rect x='5' y='40' width='85' height='50' style='fill:var(--surface-alt);stroke:#3A5A8C'/><text x='47' y='62' style='fill:var(--charcoal)' font-weight='700'>nMx</text><text x='47' y='76' style='fill:var(--fdef-text)' font-size='9'>death rate</text><path d='M95,65 L118,65' stroke='#3A5A8C' stroke-width='1.5' marker-end='url(#ah)'/><rect x='120' y='40' width='85' height='50' style='fill:var(--surface-alt);stroke:#3A5A8C'/><text x='162' y='62' style='fill:var(--charcoal)' font-weight='700'>nqx</text><text x='162' y='76' style='fill:var(--fdef-text)' font-size='9'>probability</text><path d='M210,65 L233,65' stroke='#3A5A8C' stroke-width='1.5' marker-end='url(#ah)'/><rect x='235' y='40' width='75' height='50' style='fill:var(--surface-alt);stroke:#3A5A8C'/><text x='272' y='62' style='fill:var(--charcoal)' font-weight='700'>lx</text><text x='272' y='76' style='fill:var(--fdef-text)' font-size='9'>survivors</text><path d='M310,65 L333,65' stroke='#3A5A8C' stroke-width='1.5' marker-end='url(#ah)'/><rect x='335' y='40' width='75' height='50' style='fill:var(--surface-alt);stroke:#3A5A8C'/><text x='372' y='62' style='fill:var(--charcoal)' font-weight='700'>ndx</text><text x='372' y='76' style='fill:var(--fdef-text)' font-size='9'>deaths</text><path d='M410,65 L433,65' stroke='#3A5A8C' stroke-width='1.5' marker-end='url(#ah)'/><rect x='435' y='40' width='75' height='50' style='fill:var(--surface-alt);stroke:#3A5A8C'/><text x='472' y='55' style='fill:var(--charcoal)' font-weight='700'>nLx, Tx</text><text x='472' y='76' style='fill:var(--fdef-text)' font-size='9'>person-yrs</text><path d='M510,65 L533,65' stroke='#3A5A8C' stroke-width='1.5' marker-end='url(#ah)'/><rect x='535' y='40' width='60' height='50' fill='#3A5A8C'/><text x='565' y='62' fill='#fff' font-weight='700'>ex</text><text x='565' y='76' fill='#dfe6f2' font-size='9'>life exp.</text></g><defs><marker id='ah' viewBox='0 0 10 10' refX='8' refY='5' markerWidth='5' markerHeight='5' orient='auto'><path d='M0 0L10 5L0 10z' fill='#3A5A8C'/></marker></defs></svg><p style='font-family:-apple-system,sans-serif;font-size:12.5px;color:var(--fdef-text);margin:8px 0 0;text-align:center;'>The life table pipeline: each step feeds directly into the next, ending in life expectancy.</p></div>",
          "The single most quoted number to come out of this whole process is e0, life expectancy at birth. Interestingly, e0 is often slightly lower than e1 (life expectancy at exactly age 1) whenever infant mortality is meaningfully high, because surviving that risky first year already removes the most dangerous period from the picture, boosting the expected years remaining for everyone who made it past their first birthday.",
          "There are two special exceptions built into the formulas worth remembering: age 0 gets its own slightly different formula because infant deaths cluster unevenly within that first year, and the very last open-ended age group (like '85 and older') also needs a different formula since there's no defined upper boundary to work with.",
          "You can also flip the whole table around and think of it as a snapshot of a real, unchanging 'stationary population', imagine a place where the same number of babies are born every single year, exactly matching the life table's survival pattern, and the total population size never changes. Under that lens, the person-years numbers become an actual population count at each age, and life expectancy at birth becomes simply the average age at which people in that imaginary, permanently stable place die."
        ],
        notes: [
          "A life table follows a hypothetical 'synthetic cohort' of people (conventionally starting at 100,000, called the <strong>radix</strong>, l0) through life, applying a fixed set of age-specific mortality rates to see how many survive to each age. It's the single most important tool for summarizing a population's mortality pattern into one connected pipeline.",
          "Notation: <strong>x, n</strong> means the interval starts at exact age x and spans n years. Standard tables use n=1 for age 0, n=4 for ages 1\u20134, then n=5 for every 5-year band after that, ending in an open interval like 85+.",
          "The pipeline has six linked steps, each one feeding the next:<div class='point-list'><div class='point-row'><span class='point-arrow'>\u2192</span><strong>nMx</strong>, the observed death rate.</div><div class='point-row'><span class='point-arrow'>\u2192</span><strong>nqx</strong>, the probability of dying in the interval.</div><div class='point-row'><span class='point-arrow'>\u2192</span><strong>lx</strong>, survivors to that age.</div><div class='point-row'><span class='point-arrow'>\u2192</span><strong>ndx</strong>, deaths in the interval.</div><div class='point-row'><span class='point-arrow'>\u2192</span><strong>nLx</strong>, person-years lived in the interval.</div><div class='point-row'><span class='point-arrow'>\u2192</span><strong>Tx</strong>, person-years remaining.</div><div class='point-row'><span class='point-arrow'>\u2192</span><strong>ex</strong>, life expectancy.</div></div>",
          "nMx is the observed death rate in an age band. See the Formulas tab for the calculation.",
          "nqx converts the observed rate into a true probability of dying before reaching the next age. It must always lie between 0 and 1, and the very last open interval always has \u221eqx = 1 by definition, since everyone eventually dies. See the Formulas tab for the calculation.",
          "<strong>nax</strong> is the average number of years lived in the interval by those who die in it. For most intervals a rough n/2 works, but ages 1\u20134 is a well-known exception: deaths concentrate toward the younger end of that band, so a(1\u20134) \u2248 1.5, not the naive 2.0.",
          "lx+n (survivors to the next age) and ndx (deaths in the interval) build forward from the radix, one age band at a time. See the Formulas tab for both calculations.",
          "nLx (person-years lived in the interval) has two special cases: a different formula at age 0, and a different formula at the final open interval, since there is no upper bound to work with there. See the Formulas tab for all three.",
          "Tx (person-years remaining) is a reverse cumulative sum, starting at the oldest open interval and working back down to age 0. ex (life expectancy at age x) then divides Tx by lx. e0, life expectancy at birth, is the single most widely reported mortality summary statistic in the world. See the Formulas tab for both calculations.",
          "A life table can also be read as a <strong>stationary population</strong>: imagine a real population with constant annual births exactly matching the cohort's lx at every age, and zero growth. Under that lens, nLx becomes a real population count at each age, Tx becomes the total stationary population aged x and above, and e0 becomes the mean age at death in that stationary population.",
          "Three different 'typical' ages come out of the same table:<div class='point-list'><div class='point-row'><span class='point-arrow'>\u2192</span>The <strong>median</strong> age at death is where lx = l0/2, half the cohort has died.</div><div class='point-row'><span class='point-arrow'>\u2192</span>The <strong>modal</strong> age is wherever ndx is largest, the single age band with the most deaths.</div><div class='point-row'><span class='point-arrow'>\u2192</span>The <strong>mean</strong> age at death is simply e0.</div></div>"
        ],
        formulas: [
          {name: "Age-Specific Death Rate, Life Table (nMx)", expr: "nMx = nDx / nNx",
            symbols: [{sym: "nDx", def: "the observed deaths in the age band"}, {sym: "nNx", def: "the mid-period population in that same age band"}],
            example: "<p>An age band records 1,200 deaths and 600,000 person-years.</p><span class='f'>nMx = 1,200 / 600,000 = 0.0020</span>"
          },
          {name: "Probability of Dying in the Interval (nqx)", expr: "nqx = (n \u00b7 nMx) / (1 + (n \u2212 nax) \u00b7 nMx)",
            symbols: [
              {sym: "n", def: "the width of the age interval, in years"},
              {sym: "nMx", def: "the observed death rate for that interval"},
              {sym: "nax", def: "the average years lived in the interval by those who die in it"}

        summary: [
          "This session separates two ideas people usually treat as the same thing: the household, a co-residence unit defined by who shares a dwelling and a budget, and the family, a kinship unit defined by blood, marriage, or legal partnership. A live-in domestic worker counts in a household's headcount but not in its family. A migrant parent working abroad stays part of the family but drops out of the household. Once you see the two as separate statistical concepts, a lot of confusing census categories suddenly make sense.",

      {
        id: "f8", title: "Session 8 — Migration and Urbanization in a Connected World",
        lecture: "Session 8 — Migration and Urbanization in a Connected World", filePath: "materials/fundamental/Session 8_Migration and Urbanization_2026.pptx", textbookRef: "",
        summary: [
          "Migration is a change of usual residence across a defined boundary, a district, a region, or a national border, typically for a minimum duration such as one year. The same single move is emigration from the perspective of the country someone left, and immigration from the perspective of the country they arrived in. In principle world emigration and immigration totals should match exactly, since every move is both events at once, but in practice they rarely do, because countries use different minimum-duration thresholds and different data lags.",
          "Gross migration adds immigrants and emigrants together, capturing the total volume of movement regardless of direction. Net migration subtracts emigrants from immigrants, showing the direction and size of the net change. The two tell very different stories: a country can have a net migration rate near zero while enormous two-way gross flows are happening underneath, migration streams and their smaller offsetting counterstreams that a single net number completely hides. From there, migration rates standardize each of these counts against the mid-year population, the same logic used for birth and death rates throughout this course.",
          "Migration is also never a random sample of the sending population. It is selective, concentrated among particular ages, education levels, and skill sets. When highly educated people leave a country in disproportionate numbers, that selective loss is called brain drain, a real fiscal and human-capital cost to the origin country, which paid to educate people who now contribute their skills elsewhere. The destination country experiences the mirror image, brain gain, and some migrants eventually return with new skills, capital, and networks, a partial offset called brain circulation.",
          "Traditional migration data, administrative registers, census residence questions, and targeted surveys, remain the backbone of migration statistics, but each has a real blind spot: registers miss anyone unregistered or undocumented, censuses are only periodic and retrospective, and surveys are costly and sample-based. Because censuses run once a decade and even annual surveys take months to process, none of these sources can keep pace with a fast-moving crisis. Digital trace data, mobile-phone call detail records, satellite nighttime-lights imagery, and geotagged social media activity, now fill part of that gap, estimating population movement in near-real time, though each source carries its own coverage bias, favoring people who own phones, live near satellite-visible infrastructure, or use social platforms.",
          "Urbanization has its own vocabulary. Degree of urbanization classifies every location worldwide as a city, town, or rural area using population size and density, not just national administrative boundaries. Urbanization level is the percentage of a population living in urban areas at a point in time, while urbanization rate is the pace of that share's change over time, a distinction people often blur. Three engines drive urban growth: rural-to-urban migration, natural increase within cities themselves, and reclassification, where growing settlements or shifting definitions redraw who counts as urban. In 2025 the world crossed 45% urban, more than double the 1950 share, and real 2022 to 2024 data shows Thailand's urban share rising from about 52.9% to 54.3%, a slow, incremental pace consistent with its advanced demographic transition, compared with Nigeria's faster rise from about 59.8% to 63.0% over a similar span, reflecting Sub-Saharan Africa's higher natural increase and continuing rural-to-urban migration."
        ],
        notes: [
          "Core definitions:<div class='point-list'><div class='point-row'><span class='point-arrow'>→</span><strong>Migration</strong>, a change of usual residence across a defined boundary, typically for a minimum duration such as one year.</div><div class='point-row'><span class='point-arrow'>→</span><strong>Emigration</strong>, departure from one's country of usual residence, recorded by the sending country.</div><div class='point-row'><span class='point-arrow'>→</span><strong>Immigration</strong>, arrival to take up usual residence, recorded by the receiving country.</div></div>The same move is simultaneously one country's emigration and another's immigration, though global totals rarely match exactly due to differing definitions and data lags.",
          "A migration <strong>stream</strong> is the larger, dominant flow from area A to area B in a period, and a <strong>counterstream</strong> is the smaller offsetting flow from B back to A in the same period. <strong>Gross interchange</strong> is stream plus counterstream, the true volume of movement, which net migration alone can hide. Real illustrative example from the lecture: a stream of 12,000 from Province A to B plus a counterstream of 4,500 from B to A gives a gross interchange of 16,500, far larger than the net migration of just 7,500.",
          "Six things migration statistics are not, per the lecture: 'migrant' is not defined the same way across countries (3 months, 1 year, or 5 years thresholds all in use); net does not equal gross, since a near-zero net rate can hide huge two-way flows; migrants are not a random sample of the origin population, since they are selected on age, education, and skill; migration statistics blend voluntary and forced movement; administrative registers miss undocumented migration entirely; and world emigration and immigration totals rarely match exactly despite describing the same underlying moves.",
          "<strong>Gross migration</strong> and <strong>net migration</strong>, along with the emigration, immigration, and net migration rates, are the core formulas of this session. See the Formulas tab for real worked examples using Thailand and Japan data.",
          "<strong>Migration selectivity</strong> means migrants are rarely a random sample of the sending population, they are selected on age, education, skill, and ambition. When highly educated people leave disproportionately, this is <strong>brain drain</strong>, a real fiscal and human-capital cost to the origin country. The destination gains <strong>brain gain</strong>, and some migrants return with skills, capital, and networks, called <strong>brain circulation</strong>.",
          "Real Thailand data, 2024: Thailand hosts at least 5.3 million non-Thai nationals, an 8% rise on the prior report, including about 3.1 million regular migrant workers, mostly from Cambodia, Lao PDR, and Myanmar. Since Myanmar's 2021 coup, more than 2.3 million Myanmar nationals have entered, a mix of labor migration and displacement. Only 5.6% of registered migrant workers are classified as skilled, the mirror image of brain drain upstream in the countries these workers left.",
          "Traditional data sources and their blind spots:<div class='point-list'><div class='point-row'><span class='point-arrow'>→</span><strong>Administrative records</strong> (registers, visas, permits), continuous and authoritative, but excludes unregistered or irregular migrants entirely.</div><div class='point-row'><span class='point-arrow'>→</span><strong>Census residence questions</strong> ('where did you live 5 years ago?'), full population coverage, but only periodic and retrospective.</div><div class='point-row'><span class='point-arrow'>→</span><strong>Targeted surveys</strong>, rich detail on motives and selectivity, but costly, sample-based, and cannot observe emigrants who already left.</div></div><strong>Digital trace data</strong>, mobile-phone call detail records, satellite nighttime-lights imagery, and geotagged social media activity, can estimate mobility within days rather than years, but is biased toward people who own phones, live near visible infrastructure, or use social platforms, and raises real privacy and consent questions.",
          "Urbanization vocabulary:<div class='point-list'><div class='point-row'><span class='point-arrow'>→</span><strong>Degree of urbanization</strong>, the UN's 2020s method classifying every location as city, town, or rural using population size and density grids, not just administrative boundaries.</div><div class='point-row'><span class='point-arrow'>→</span><strong>Urbanization level</strong>, the percentage of a population living in urban areas at a point in time.</div><div class='point-row'><span class='point-arrow'>→</span><strong>Urbanization rate</strong>, the pace of change in that share over time, easily confused with the level itself.</div></div>Three engines drive urban growth: rural-to-urban migration, natural increase within existing urban populations, and reclassification, where settlements or definitions change (the UN's 2025 city-population threshold dropped from 300,000 to 50,000, which alone can raise a country's measured urbanization with no real population movement).",
          "Real 2022 to 2024 urbanization data: the world crossed 45% urban in 2025, more than double the 20% share in 1950. Thailand's urban share rose from about 52.9% (2022) to 54.3% (2024), an annualized pace of about 1.3% per year, while Nigeria's rose faster, from about 59.8% (2020) to 63.0% (2024), reflecting Sub-Saharan Africa's higher natural increase and continued rural-to-urban migration against Thailand's more advanced, slower-growing demographic transition."

          {q: "Define migration, emigration, and immigration, and explain why the same event can be described by all three terms.", a: "Migration is a change of usual residence across a defined boundary. Emigration is that same move viewed from the country of origin, as a departure. Immigration is the same move viewed from the destination country, as an arrival. Because every move has both an origin and a destination, it is simultaneously a migration, an emigration, and an immigration, just described from different vantage points."},
          {q: "Distinguish gross migration from net migration. Under what circumstances could net migration equal zero while gross migration is very large?", a: "Gross migration adds immigrants and emigrants together, capturing total movement volume. Net migration subtracts emigrants from immigrants, capturing only the direction and size of the net change. Net migration can be zero, or close to it, if a large stream in one direction is matched by an almost equally large counterstream in the other, meaning enormous two-way movement produces little net change."},
          {q: "A stream from Province A to B is 12,000 people, and a counterstream from B to A is 4,500 people in the same year. Calculate the gross interchange and the net migration between A and B.", a: "Gross interchange = 12,000 + 4,500 = 16,500. Net migration (A to B) = 12,000 − 4,500 = 7,500, showing the net figure is far smaller than the true volume of movement."},
          {q: "Real data: Thailand's non-Thai national stock (2024) is 5,300,000 and Thai workers deployed abroad in FY2024 numbered 67,208. Calculate the illustrative gross and net migration figures, and explain why they are called illustrative rather than official.", a: "Gross migration = 5,300,000 + 67,208 = 5,367,208. Net migration = 5,300,000 − 67,208 = 5,232,792. These are illustrative because they mix a migrant STOCK (people residing in Thailand at one point in time) with an annual FLOW (workers deployed in one fiscal year), which is not how an official register-based migration rate is constructed."},
          {q: "Real data: Thailand's Thai workers deployed abroad, FY2024, numbered 67,208 against a population of 71,668,011. Calculate the emigration rate.", a: "Emigration rate = (67,208 / 71,668,011) × 1,000 ≈ 0.94 per 1,000."},
          {q: "Real data: 2,300,000 Myanmar nationals arrived in Thailand since the 2021 coup, over about 3 years. Annualize this inflow and calculate the immigration rate against Thailand's 2024 population of 71,668,011.", a: "Annualized inflow = 2,300,000 / 3 ≈ 766,667 per year. Immigration rate = (766,667 / 71,668,011) × 1,000 ≈ 10.70 per 1,000."},
          {q: "Using your answers to the previous two questions, calculate Thailand's illustrative net migration rate.", a: "Net migration rate = Immigration rate − Emigration rate ≈ 10.70 − 0.94 ≈ 9.76 per 1,000."},
          {q: "Real data: Japan recorded net migration of about +153,357 in 2024 against a population of about 123.9 million. Calculate Japan's net migration rate and compare it to Thailand's illustrative rate above.", a: "Japan's net migration rate = (153,357 / 123,900,000) × 1,000 ≈ +1.2 per 1,000, much smaller than Thailand's illustrative 9.76, though the two are not directly comparable since Japan's is a clean official rate and Thailand's mixes stock and flow data."},
          {q: "Define migration selectivity, and explain brain drain using the same migration event from both the origin and destination country's perspectives.", a: "Migration selectivity means migrants are not a random sample of the sending population, they are selected on age, education, and skill. From the origin's perspective, losing highly educated people disproportionately is brain drain, a fiscal and human-capital cost. From the destination's perspective, the same inflow of skilled workers is brain gain, filling labor shortages."},
          {q: "Real data: only 5.6% of registered migrant workers in Thailand are classified as skilled. Why does this matter for both Thailand and the migrants' home countries?", a: "For Thailand, it means the inflow is overwhelmingly low-skilled labor filling specific sectors, not a skilled-worker brain gain. For the migrants' home countries, it means they are not losing their most educated citizens through this particular corridor, the opposite pattern from classic brain drain."},
          {q: "List three traditional data sources for measuring migration and one limitation of each.", a: "Administrative records: miss unregistered or irregular migrants entirely. Census residence questions: only periodic (every 5 to 10 years) and retrospective. Targeted surveys: costly, sample-based, and cannot observe emigrants who have already left the origin country."},
          {q: "Explain how mobile-phone call detail records (CDRs) estimate a population's home location, and what a sustained shift in that location signals.", a: "A user's home location is estimated as their most frequent nighttime cell-tower location over a baseline period. A sustained shift away from that modeled home location signals migration or displacement, often detectable within days."},
          {q: "Real data: Thailand's urban share was 52.89% in 2022 and 54.32% in 2024, against total populations of 71,735,329 and 71,668,011. Calculate the urban population count in each year and the total percent change.", a: "2022 urban population = 71,735,329 × 0.5289 ≈ 37,940,816. 2024 urban population = 71,668,011 × 0.5432 ≈ 38,930,064. % change = (38,930,064 − 37,940,816)/37,940,816 ≈ 2.61%."},
          {q: "Define degree of urbanization as used in the UN's 2020s methodology, and explain how it differs from simply counting people inside official city boundaries.", a: "Degree of urbanization classifies every location worldwide as a city, town, or rural area using population size and density grids, applied consistently regardless of how any individual country draws its administrative city limits. This differs from counting people only within official city boundaries, which can undercount or overcount urban population depending on how generously or narrowly a country's own boundaries are drawn."},
          {q: "The UN's 2025 report lowered its minimum city population threshold from 300,000 to 50,000. Explain how this alone could raise a country's measured urbanization level with no real population movement.", a: "Lowering the threshold means many settlements that previously did not qualify as cities, because they had between 50,000 and 300,000 people, now count as urban. Their populations move from the rural to the urban column purely due to the definitional change, raising the measured urbanization level even though nobody actually moved anywhere."},
          {q: "Name the three engines of urban population growth, and explain which one most plausibly dominates in a large megacity that has stopped receiving large numbers of rural migrants.", a: "The three engines are rural-to-urban migration, natural increase, and reclassification. In a megacity no longer receiving large migrant inflows, natural increase, births minus deaths within the existing urban population, most plausibly dominates continued growth."},
          {q: "Real data: Thailand's urban share rose from about 52.9% (2022) to 54.3% (2024), while Nigeria's rose from about 59.8% (2020) to 63.0% (2024). Compare their urbanization trajectories and suggest one reason for the difference.", a: "Nigeria's urban share grew faster and from a higher base than Thailand's, consistent with Sub-Saharan Africa's typically higher natural increase and continuing rural-to-urban migration. Thailand's slower, more incremental growth is consistent with its more advanced demographic transition, lower birth rate, and an already-aging population, a different mix of the three engines of urban growth than Nigeria's."}

    intro: "Population policy is not free. Every idea in this course, universal health coverage, old age allowances, gender equality laws, ultimately has to be paid for, argued over, and weighed against what else the money could have done. This subject covers why governments intervene at all, how a baht of government spending ripples through the whole economy, and how taxation decisions quietly trade off efficiency against fairness.",

      {
        id: "ec1", title: "Lecture 1 — Role and Structure of the Public Sector",
        lecture: "Lecture 1 — Role and Structure of the Public Sector", filePath: "materials/econ/Lecture 1_Role and structure of public sector_2026 handout_6a717e5d3d168.pdf", textbookRef: "",
        summary: [
          "This lecture asks a basic question first. Why do we need a government at all? Picture a country with no public schools, no public highways, no allowances for poor or elderly people. Would private businesses step in and provide all of that on their own? Mostly not, because some of these things are not profitable to sell to individuals one at a time, even though society as a whole benefits from having them.",
          "Governments exist to do three jobs that markets alone tend to do badly. The first is resource allocation. A perfectly competitive market, with many buyers, many sellers, no barriers to entry, and full information, actually allocates resources efficiently on its own. The problem is that real markets are rarely perfect. When a market failure shows up, in the form of an externality or a public good, the government has a reason to step in.",
          "An externality is a side effect of an activity that lands on people who were not part of the deal. Pollution is a negative externality, it hurts people who never chose to buy or sell anything related to the factory that caused it. A rural public school is closer to a positive externality, since educating children benefits the wider community, not just the family paying for it. A public good goes a step further. It has two properties: non excludability (you cannot stop anyone from using it, like a street light) and non rivalness (one person using it does not reduce how much is left for anyone else, like national defense). Because nobody can be charged for using these, private firms have little reason to supply them, and anyone who benefits without paying becomes a free rider.",
          "The second job is income redistribution. Thailand's own data (cited in the August 2026 lecture) makes the case starkly: the richest 20 percent of the population (the top quintile) holds 91 percent of the country's wealth, and the richest 1 percent alone holds 67 percent. Left alone, this kind of inequality tends to pass from parents to children, a pattern researchers call the Great Gatsby Curve (Corak, 2013), where countries with more inequality also show less economic mobility between generations. Governments respond with progressive taxes (like inheritance tax and progressive income tax) on one side, and spending like universal health coverage, free basic education, and old age allowances on the other. The catch is that every one of these programs has to be paid for, so there is a constant balancing act between fiscal burden and fiscal sustainability.",
          "The third job is stabilizing the economy. During a recession, Keynesian economics says the government should raise spending and cut taxes to boost demand, for example through direct stimulus payments. The political catch is that cutting spending during a boom is much harder than raising it during a recession, so government debt tends to only go in one direction over time: up.",
          "Public finance itself has three pieces. Revenue comes mostly from taxes, with a smaller share from public enterprises, fines, and fees. Expenditure covers consumption (day to day running costs, like wages for government staff), investment (roads, schools, reservoirs), and public transfers (allowances paid directly to people). Public debt is what results when a government spends more than it collects and has to borrow the difference."
        ],
        notes: [
          "Public policy is a set of actions a government takes to address issues affecting a broad population, not individual cases, developed with input from politicians, civil servants, and other groups.",
          "Government function 1, Resource allocation. In a perfectly competitive market with full information and no barriers to entry, private agents maximizing their own interest already produce an efficient outcome, so the government does not need to intervene. It steps in only when a market failure appears.",
          "Externality: a side effect of an economic activity that hits people who were not part of the transaction. Positive externality examples: public safety, rural education. Negative externality example: air pollution.",
          "Public good properties: non excludability (nobody can be stopped from using it) and non rivalness (one person's use does not reduce another's). Because these benefits spill over to everyone, private markets under supply them, and the free rider problem results.",
          "Government function 2, Income redistribution. In Thailand, the top 20% (Quintile 5) holds 91% of wealth, and the top 1% holds 67%. Without intervention, inequality tends to persist across generations, a pattern known as the Great Gatsby Curve (Corak, 2013).",
          "Redistribution tools: taxes aimed at inequality (inheritance tax, progressive income tax, land and building tax) and public expenditure (Universal Health Coverage, 15 years of free basic education, old age allowance, disability allowance, welfare card scheme). All of these must be weighed against fiscal sustainability.",
          "Government function 3, Stabilization of the economy. Keynesian view: during a recession, the government should raise spending and cut taxes to lift aggregate demand (for example, direct stimulus payments). Political economy problem: expansionary policy in a recession is easy to pass, restrictive policy in a boom is politically difficult, so public debt tends to accumulate over time.",
          "Public finance has three parts. Revenue: mainly taxes, plus public enterprises, fines, and fees. Expenditure: consumption, investment, and public transfers. Public debt: the gap left when expenditure exceeds revenue."

          {q: "Why would a private company be unlikely to build and maintain public street lighting on its own?", a: "Street lighting is non excludable (you cannot stop people from benefiting from it) and non rival (one person seeing by it does not reduce light for anyone else). Because the firm cannot charge everyone who benefits, it cannot recover its costs, so the private sector under supplies it."},
          {q: "A factory's smoke gives nearby residents breathing problems, even though those residents never bought anything from the factory. What is this called, and is it positive or negative?", a: "A negative externality. The cost of the factory's activity falls on people outside the transaction, and it is not reflected in the price of what the factory sells."},

          {label: "Lecture 2 exercise sheet (real practice questions, matches ajarn's exam style)", filePath: "materials/econ/Lecture 2_Exercises_new 2026_6a813ae40ba76.pdf", tag: "EXERCISES"},
          {label: "Basso & Rachedi (2018), \"The Young, the Old, and the Government: Demographics and Fiscal Multipliers\", Banco de España Working Paper 1837 (reproduced with permission for educational use)", filePath: "materials/econ/Lecture 2_Paper 2018_Young--old--and govt & fiscal multiplier_6a813badd37ba.pdf", tag: "READING"}
        ],
        summary: [
          "This session builds up the circular flow of an economy piece by piece, then uses it to answer a very practical question: if the government spends more money, how much bigger does the whole economy actually get?",
          "Start with the simplest possible economy, just households and firms, with no saving, no government, no foreign trade. Money moves in a loop: households pay firms for goods, firms pay households wages, and it balances out exactly. Add a financial intermediary (banks) and now households can save part of their income instead of spending it all, and firms can borrow those savings to invest. Add a government and now there is a third player collecting taxes and spending on things like law and order and public goods. Add foreign trade and you get the full four sector model, with exports and imports flowing in and out too.",
          "Aggregate demand (AD) is just everything being spent in the economy added up. In a closed economy it is consumption plus investment plus government spending. Open up the economy to trade and you add net exports (exports minus imports) on top. If the government builds a new road, it buys sand, cement, and labor, all of which raises AD directly. Cut government spending and the same logic runs backward: AD falls.",
          "The fiscal multiplier answers exactly how much AD (and therefore GDP) changes for a given change in government spending. The key ingredient is the marginal propensity to consume, or MPC, the fraction of every extra baht of income that a household spends rather than saves. If MPC is high, each baht the government spends gets re-spent again and again as it circulates through the economy, so the final effect on GDP is bigger than the original spending. Add a tax rate into the mix and the multiplier shrinks a bit, because some of every extra baht of income leaks out to taxes before it can be spent again.",
          "A neat special case is the balanced-budget multiplier: what happens if the government raises spending by exactly the same amount it raises taxes? In a closed economy, intuition might suggest the net effect is zero, but it is not. The result is a multiplier of exactly 1, meaning GDP rises by exactly the amount of the new spending, because government spending is spent in full immediately, while a tax increase only reduces private spending by the MPC share of it. In an open economy, this clean result breaks: the balanced-budget multiplier is no longer exactly 1, since some of the extra income now leaks out of the country as imports too.",
          "The paradox of thrift flips the story around. If everyone in the economy decides to save more, you might expect GDP to rise since saving usually sounds prudent. Instead, less consumer spending means firms sell less, so they cut production, and the overall level of economic activity actually falls. One household saving more is smart, but everyone saving more at once can shrink the whole economy.",
          "There is also a genuinely surprising twist to the tax rate multiplier: it does not just shrink the multiplier, it also acts as an automatic stabilizer for the whole economy. A higher tax rate means any shock, whether a spending increase or a spending cut, gets diluted into a smaller swing in national income than it would in a low-tax economy. This is a real, deliberate side benefit of income tax: it makes the economy naturally less volatile.",
          "One more real-world wrinkle worth knowing: the fiscal multiplier itself is not a fixed number for a country, it depends partly on the population's age structure. Research using U.S. state-level data (Basso and Rachedi, 2018, Banco de España) found that local fiscal multipliers rise with the share of young people in the population, since younger households tend to be credit-constrained and spend a much larger share of any extra income than older, wealthier households do. Their model estimates that U.S. national fiscal multipliers are now about 36% lower than they were in 1980, largely because the population has aged. This is a direct, real link between the population trends studied elsewhere in this program and how much a government's spending actually moves the economy."

          "2-sector model (households, firms only): no saving, no government, no foreign trade, income just circulates between the two.",

in government spending shifts the AD line up, moving equilibrium from E₀ to E₁. The gap between Y₀ and Y₁ is bigger than the original ΔG, because of the multiplier effect.</p></div>",
          "Fiscal multiplier without tax: <span class='f'>ΔY / ΔG = 1 / (1 − c)</span> A higher MPC means a bigger multiplier, because more of each round of new income gets spent again.",
          "Fiscal multiplier with a tax rate t (where T = tY): <span class='f'>ΔY / ΔG = 1 / (1 − c(1 − t))</span> The multiplier is smaller than the no-tax case, since part of each round of income leaks out as tax before it can be re-spent. A higher tax rate acts as an automatic stabilizer: the same size shock (ΔG or ΔI) produces a smaller swing in ΔY than it would under a lower tax rate.",
          "Fiscal multiplier in an open economy: adding imports (M = mY, where m is the marginal propensity to import) adds another leakage, so the multiplier shrinks further. See the Formulas tab for the calculation.",
          "Balanced-budget multiplier: in a closed economy, if <span class='f'>ΔT = ΔG</span>, then <span class='f'>ΔY = ΔG</span> exactly, a multiplier of 1. In an open economy, the balanced-budget multiplier is no longer exactly 1, since imports leak part of the extra income out of the country. See the Formulas tab for both versions.",

            example: "<p>An economy has c = 0.7, I = 50, G = 30. Government spending rises by ΔG = 20.</p><span class='f'>Multiplier = 1 / (1 − 0.7) = 1 / 0.3 ≈ 3.33</span><span class='f'>ΔY = 3.33 × 20 ≈ 66.67</span>"
