        summary: [
          "Central tendency asks one simple question: what's a typical, representative score in this dataset? There are three different answers, and picking the right one matters more than people expect.",
          "The mean is the familiar arithmetic average, add up every score and divide by how many there are. Its biggest strength is that it uses every single score in the calculation, but that's also its weakness: one extreme outlier can drag the mean a long way from where most of the data actually sits. The mean can also be described two other ways: it's the amount everyone would get if the total were split equally, and it's the exact balance point of the distribution, the point where the distances of scores above and below it perfectly cancel out.",
          "Sometimes you need to combine two separate groups of scores into one overall mean, and it is a common mistake to just average the two means together. The weighted mean avoids this by combining the actual sums and counts first: add up all the scores from both groups, add up the total number of scores from both groups, then divide. A bigger group pulls the combined mean toward its own value more than a smaller group does.",
          "The median only cares about order, it's simply the middle score once everything is sorted. Because it ignores how far away extreme scores are, only their rank, the median resists outliers in a way the mean can't. This is exactly why income statistics are usually reported as medians, one billionaire in the data would drag a mean income figure wildly upward without the median budging much at all. For grouped, continuous data, finding the precise median takes an extra step, since the median could fall anywhere inside a class interval rather than landing exactly on a listed value.",
          "The mode is just the single most frequently occurring score, and it's the only one of the three that works for nominal, category based data, like the most common eye color in a room, where mean and median don't even make sense.",
          "Comparing the mean to the median tells you about skew without even drawing a graph. If the mean is bigger than the median, the distribution has positive skew, a few unusually high scores are pulling the mean upward. If the mean is smaller than the median, that's negative skew, a few unusually low scores are pulling it downward."

let active = { type: "home" };

const expandedSubjects = {};

function renderTOC(){
  const toc = document.getElementById('toc');
  const isDark = document.documentElement.getAttribute('data-theme') === 'dark';
  const themeLabel = isDark ? '\u2600 Light mode' : '\u263D Dark mode';
  let html = '<div class="toc-brand" data-home="1">PopStudies26</div><div class="toc-sub">Year 1 study reference, built as we go</div><button id="theme-toggle" onclick="toggleTheme()">' + themeLabel + '</button>';
  html += '<div class="toc-semester ' + (active.type==='semester'?'active-semester':'') + '" data-semester="1">Semester 1</div>';
  for(const key in DATA){
    const subj = DATA[key];
    const isActiveSubject = active.type==='overview' && active.id===key;
    const containsActiveSection = active.type==='section' && subj.sections.some(function(s){ return s.id===active.id; });
    if(!(key in expandedSubjects)){ expandedSubjects[key] = containsActiveSection; }
    const isExpanded = expandedSubjects[key];
    html += '<div class="toc-subject ' + (isActiveSubject?'active-subject':'') + '" data-overview="' + key + '"><span class="toc-subject-label">' + subj.label + '</span><span class="toc-chevron ' + (isExpanded?'expanded':'') + '">\u2039</span></div>';
    html += '<div class="toc-collapse ' + (isExpanded?'expanded':'') + '">';
    if(subj.sections.length === 0){
      html += '<ul class="toc-list"><li class="toc-item empty">No materials yet</li></ul>';
    } else {
      html += '<ul class="toc-list">';
      subj.sections.forEach(function(sec, i){
        const shortTitle = sec.title.replace(/^.*?\u2014\s*/,'');
        const activeClass = (active.type==='section' && sec.id===active.id) ? 'active' : '';
        html += '<li class="toc-item ' + activeClass + '" data-id="' + sec.id + '"><span class="toc-num">' + String(i+1).padStart(2,'0') + '</span>' + shortTitle + '</li>';
      });
      html += '</ul>';
    }
    html += '</div>';
  }
  toc.innerHTML = html;
  toc.querySelectorAll('.toc-item[data-id]').forEach(function(el){
    el.addEventListener('click', function(){ active = {type:'section', id: el.dataset.id}; render(); });
  });
  toc.querySelectorAll('.toc-subject[data-overview]').forEach(function(el){
    el.addEventListener('click', function(){
      const key = el.dataset.overview;
      expandedSubjects[key] = !expandedSubjects[key];
      active = {type:'overview', id: key};
      render();
    });
  });
  toc.querySelector('.toc-brand[data-home]').addEventListener('click', function(){ active = {type:'home'}; render(); });
  toc.querySelector('.toc-semester[data-semester]').addEventListener('click', function(){ active = {type:'semester', id:'1'}; render(); });
}

function findSection(id){
  for(const key in DATA){
    const found = DATA[key].sections.find(function(s){ return s.id===id; });
    if(found) return {subjKey: key, subj: DATA[key], sec: found};
  }
  return null;
}

function driveLinkHTML(key, label){
  const link = DRIVE_LINKS[key];
  if(link){
    return '<a href="' + link + '" target="_blank" rel="noopener">' + label + '</a>';
  }
  return '<span style="color:#B5AF9E;">' + label + ' (add your Drive link in the code to make this clickable)</span>';
}

function renderHome(){
  let html = '<div class="eyebrow">PopStudies26</div><h1 class="section-title">Welcome</h1>';
  html += '<div class="subject-intro">This is a study reference built for the MA Population Policy and Human Development program at Chulalongkorn University, meant for checking a formula or re-reading a summary on your phone between classes or on the commute. Everything here follows the lecture slides directly, organized by semester, subject, and session.</div>';
  html += '<div class="fun-fact"><span class="fun-fact-tag">Worth knowing</span>The world’s population passed 8 billion people in November 2022, according to the UN. Roughly everything in this program, fertility, mortality, migration, policy, is really about understanding how that number moves and what it means for the people behind it.</div>';
  html += '<h2 class="block-title block-notes">Semesters</h2>';
  html += '<div class="semester-card" data-semester="1"><div class="semester-card-title">Semester 1</div><div class="semester-card-sub">5 subjects · First Trimester 2026</div></div>';
  document.getElementById('main-inner').innerHTML = html;
  document.querySelector('.semester-card[data-semester]').addEventListener('click', function(){ active = {type:'semester', id:'1'}; render(); });
}

function backLinkHTML(label){
  return '<button class="back-link" data-back="1">← ' + label + '</button>';
}

function renderSemester(id){
  let html = backLinkHTML('Home');
  html += '<div class="eyebrow">Semester ' + id + '</div><h1 class="section-title">Subjects</h1>';
  html += '<div class="subject-intro">Five courses this trimester, shared across the same room and the same cohort. Pick one to see its sessions.</div>';
  html += '<div class="subject-grid">';
  for(const key in DATA){
    const subj = DATA[key];
    const count = subj.sections.length;
    const teaser = subj.teaser || 'Materials not uploaded yet.';
    html += '<div class="subject-card" data-overview="' + key + '"><div class="subject-card-title">' + subj.label + '</div><div class="subject-card-teaser">' + teaser + '</div><div class="subject-card-count">' + (count ? count + ' sessions' : 'no sessions yet') + '</div></div>';
  }
  html += '</div>';
  document.getElementById('main-inner').innerHTML = html;
  document.querySelectorAll('.subject-card[data-overview]').forEach(function(el){
    el.addEventListener('click', function(){
      const key = el.dataset.overview;
      expandedSubjects[key] = true;
      active = {type:'overview', id: key};
      render();
    });
  });
  document.querySelector('.back-link[data-back]').addEventListener('click', function(){ active = {type:'home'}; render(); });
}

function renderOverview(key){
  const subj = DATA[key];
  let html = backLinkHTML('Semester 1');
  html += '<div class="eyebrow">Subject overview</div><h1 class="section-title">' + subj.label + '</h1>';

  if(subj.intro){
    html += '<div class="subject-intro">' + subj.intro + '</div>';
  }
  if(subj.funFact){
    html += '<div class="fun-fact"><span class="fun-fact-tag">Worth knowing</span>' + subj.funFact + '</div>';
  }

  html += '<h2 class="block-title block-materials">Materials</h2><ul class="materials">';
  const hasLocalFiles = subj.sections.some(function(s){ return s.filePath; });
  if(hasLocalFiles){
    html += '<li>Lecture slides are hosted directly, open each session to download.<span class="mat-tag">SLIDES</span></li>';
  } else {
    html += '<li>' + driveLinkHTML(key, 'Open lecture slide folder (Google Drive)') + '<span class="mat-tag">DRIVE</span></li>';
  }
  html += '<li>' + subj.textbook + '<span class="mat-tag">TEXTBOOK</span></li>';
  html += '</ul>';

  html += '<h2 class="block-title block-notes">Notes by session</h2>';
  if(subj.sections.length === 0){
    html += '<div class="empty-note">Nothing uploaded for this subject yet.</div>';
  } else {
    html += '<ul class="overview-list">';
    subj.sections.forEach(function(sec){
      const count = sec.notes.length;
      html += '<li><a data-id="' + sec.id + '">' + sec.title + '</a><br><span class="overview-count">' + (count ? count + ' notes' : 'not covered yet') + '</span></li>';
    });
    html += '</ul>';
  }

  document.getElementById('main-inner').innerHTML = html;
  document.querySelectorAll('.overview-list a[data-id]').forEach(function(el){
    el.addEventListener('click', function(){ active = {type:'section', id: el.dataset.id}; render(); });
  });
  document.querySelector('.back-link[data-back]').addEventListener('click', function(){ active = {type:'semester', id:'1'}; render(); });
}

const sectionTabs = {};

function sectionTabList(subj, sec){
  const tabs = [{key:'slides', label:'Slides'}];
  if(sec.summary && sec.summary.length) tabs.push({key:'summary', label:'Summary'});
  tabs.push({key:'notes', label:'Notes'});
  if(sec.formulas && sec.formulas.length) tabs.push({key:'formulas', label:'Formulas'});
  tabs.push({key:'exercises', label:'Exercises'});
  if(sec.worksheet) tabs.push({key:'worksheet', label:'Worksheet'});
  return tabs;
}

function tabContentHTML(tabKey, subj, sec){
  if(tabKey === 'slides'){
    let html = '<h2 class="block-title block-materials">Materials</h2><ul class="materials">';
    if(sec.filePath){
      html += '<li>' + sec.lecture + '<button class="view-btn" onclick="openPdf(\'' + sec.filePath + '\')">View slides</button><span class="mat-tag">PDF</span></li>';
    } else {
      html += '<li>' + sec.lecture + '<span class="mat-tag">SLIDES (not hosted yet)</span></li>';
    }
    if(sec.textbookRef){
      html += '<li>' + subj.textbook + '<span class="mat-tag">' + sec.textbookRef.toUpperCase() + '</span></li>';
    }
    if(sec.extraFiles && sec.extraFiles.length){
      sec.extraFiles.forEach(function(ef){
        html += '<li>' + ef.label + '<button class="view-btn" onclick="openPdf(\'' + ef.filePath + '\')">Open</button><span class="mat-tag">' + (ef.tag || 'PDF') + '</span></li>';
      });
    }
    html += '</ul>';
    html += '<div id="pdf-panel"><div id="pdf-panel-bar">'
      + '<button class="pdf-panel-btn" onclick="closePdf()">Close viewer</button>'
      + '<button class="pdf-panel-btn" onclick="fullscreenPdf()">Full screen</button>'
      + '<a class="pdf-panel-btn" id="pdf-open-tab" href="" target="_blank" rel="noopener">Open in new tab</a>'
      + '</div><iframe id="pdf-frame" src=""></iframe></div>';
    return html;
  }
  if(tabKey === 'summary'){
    let html = '<h2 class="block-title block-summary">Summary \u2014 start here</h2><div class="summary-box">';
    sec.summary.forEach(function(p){ html += '<p>' + p + '</p>'; });
    html += '</div>';
    return html;
  }
  if(tabKey === 'notes'){
    let html = '<h2 class="block-title block-notes">Notes</h2>';
    if(sec.notes.length){
      html += '<ul class="notes">';
      sec.notes.forEach(function(n){ html += '<li>' + n + '</li>'; });
      html += '</ul>';
    } else {
      html += '<div class="empty-note">Not covered yet. Ask Claude to add this session\'s notes once we go through it.</div>';
    }
    return html;
  }
  if(tabKey === 'formulas'){
    let html = '<h2 class="block-title block-formulas">Formulas</h2><ul class="formulas">';
    sec.formulas.forEach(function(f){
      html += '<li><span class="fname">' + f.name + '</span><span class="fx">' + f.expr + '</span>';
      if(f.symbols && f.symbols.length){
        html += '<div class="def-list">';
        f.symbols.forEach(function(s){ html += '<div class="def-row"><span class="def-sym">' + s.sym + '</span> = ' + s.def + '</div>'; });
        html += '</div>';
      } else if(f.def){
        html += '<span class="fdef">' + f.def + '</span>';
      }
      if(f.example){
        html += '<div class="example-box"><span class="example-label">Example</span>' + f.example + '</div>';
      }
      html += '</li>';
    });
    html += '</ul>';
    return html;
  }
  if(tabKey === 'exercises'){
    let html = '<h2 class="block-title block-exercises">Exercises</h2>';
    if(sec.exercises.length){
      html += '<input type="text" id="exercise-search" class="exercise-search" placeholder="Search these exercises...">';
      html += '<div id="exercise-no-results" class="empty-note" style="display:none;">No exercises match that search.</div>';
      sec.exercises.forEach(function(item){
        html += '<div class="quiz-item" data-search="' + (item.q + ' ' + item.a).toLowerCase().replace(/"/g,'&quot;') + '"><div class="quiz-q">' + item.q + '<span class="quiz-toggle">reveal</span></div><div class="quiz-a">' + item.a + '</div></div>';
      });
    } else {
      html += '<div class="empty-note">No exercises added yet.</div>';
    }
    return html;
  }
  if(tabKey === 'worksheet'){
    const ws = sec.worksheet;
    let html = '<h2 class="block-title block-exercises">Worksheet</h2>';
    html += '<div class="ws-instructions"><span class="ws-instructions-label">Instructions</span>' + ws.instructions + '</div>';
    ws.dataSheets.forEach(function(sheet){
      html += '<div class="ws-data"><div class="ws-data-title">' + sheet.title + '</div><table class="ws-table">';
      sheet.rows.forEach(function(r){ html += '<tr><td>' + r.label + '</td><td>' + r.value + '</td></tr>'; });
      html += '</table></div>';
    });
    html += '<div class="ws-data-title ws-questions-title">Practice Questions</div>';
    ws.questions.forEach(function(q, i){
      const typeClass = q.type === 'interpretation' ? 'ws-interpretation' : 'ws-formula';
      const typeLabel = q.type === 'interpretation' ? 'Interpretation' : 'Formula';
      html += '<div class="quiz-item ' + typeClass + '"><div class="quiz-q"><span class="ws-q-text"><span class="ws-q-tag">' + typeLabel + '</span>' + (i+1) + '. ' + q.prompt + '</span><span class="quiz-toggle">reveal</span></div><div class="quiz-a">' + q.answer + '</div></div>';
    });
    return html;
  }
  return '';
}

function renderSection(id){
  const found = findSection(id);
  if(!found) return;
  const subj = found.subj;
  const sec = found.sec;

  const tabs = sectionTabList(subj, sec);
  if(!sectionTabs[id] || !tabs.some(function(t){ return t.key === sectionTabs[id]; })){
    sectionTabs[id] = tabs.some(function(t){ return t.key==='summary'; }) ? 'summary' : 'slides';
  }
  const activeTab = sectionTabs[id];

  let html = backLinkHTML(subj.label);
  html += '<div class="eyebrow">' + subj.label + '</div><h1 class="section-title">' + sec.title + '</h1>';

  html += '<div class="tab-bar">';
  tabs.forEach(function(t){
    html += '<button class="tab-btn ' + (t.key===activeTab?'active':'') + '" data-tab="' + t.key + '">' + t.label + '</button>';
  });
  html += '</div>';

  html += '<div class="tab-panel">' + tabContentHTML(activeTab, subj, sec) + '</div>';

  document.getElementById('main-inner').innerHTML = html;

  document.querySelectorAll('.tab-btn[data-tab]').forEach(function(el){
    el.addEventListener('click', function(){ sectionTabs[id] = el.dataset.tab; renderSection(id); playFadeIn(); });
  });
  document.querySelectorAll('.quiz-item').forEach(function(el){
    el.querySelector('.quiz-q').addEventListener('click', function(){
      el.classList.toggle('open');
      el.querySelector('.quiz-toggle').textContent = el.classList.contains('open') ? 'hide' : 'reveal';
    });
  });
  const exerciseSearch = document.getElementById('exercise-search');
  if(exerciseSearch){
    exerciseSearch.addEventListener('input', function(){
      const q = exerciseSearch.value.trim().toLowerCase();
      const items = document.querySelectorAll('.quiz-item[data-search]');
      let anyVisible = false;
      items.forEach(function(el){
        const match = el.dataset.search.indexOf(q) !== -1;
        el.hidden = !match;
        if(match) anyVisible = true;
      });
      document.getElementById('exercise-no-results').style.display = anyVisible ? 'none' : 'block';
    });
  }
  document.querySelector('.back-link[data-back]').addEventListener('click', function(){
    expandedSubjects[found.subjKey] = true;
    active = {type:'overview', id: found.subjKey};
    render();
  });
}

function openPdf(path){
  document.getElementById('pdf-frame').src = path;
  document.getElementById('pdf-open-tab').href = path;
  document.getElementById('pdf-panel').style.display = 'block';
  document.getElementById('pdf-panel').scrollIntoView({behavior:'smooth', block:'start'});
}
function closePdf(){
  document.getElementById('pdf-panel').style.display = 'none';
  document.getElementById('pdf-frame').src = '';
}
function fullscreenPdf(){
  const panel = document.getElementById('pdf-panel');
  if(panel.requestFullscreen){ panel.requestFullscreen(); }
  else if(panel.webkitRequestFullscreen){ panel.webkitRequestFullscreen(); }
}

function getTheme(){
  const saved = localStorage.getItem('popstudies26_theme');
  if(saved) return saved;
  return window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
}
function applyTheme(theme){
  if(theme === 'dark'){
    document.documentElement.setAttribute('data-theme', 'dark');
  } else {
    document.documentElement.removeAttribute('data-theme');
  }
  const btn = document.getElementById('theme-toggle');
  if(btn) btn.textContent = theme === 'dark' ? '\u2600 Light mode' : '\u263D Dark mode';
}
function toggleTheme(){
  const current = document.documentElement.getAttribute('data-theme') === 'dark' ? 'dark' : 'light';
  const next = current === 'dark' ? 'light' : 'dark';
  localStorage.setItem('popstudies26_theme', next);
  applyTheme(next);
}
applyTheme(getTheme());

function playFadeIn(){
  const mainInner = document.getElementById('main-inner');
  mainInner.classList.remove('fade-in');
  void mainInner.offsetWidth;
  mainInner.classList.add('fade-in');
}

function render(){
  renderTOC();
  if(active.type === 'home'){ renderHome(); }
  else if(active.type === 'semester'){ renderSemester(active.id); }
  else if(active.type === 'overview'){ renderOverview(active.id); }
  else { renderSection(active.id); }
  window.scrollTo(0,0);
  playFadeIn();
}

const SITE_PASSWORD = "pstudies7777";

function checkPassword(){
  const input = document.getElementById('gate-input').value;
  const err = document.getElementById('gate-error');
  if(input === SITE_PASSWORD){
    sessionStorage.setItem('popstudies26_unlocked', 'yes');
    document.getElementById('gate').style.display = 'none';
    document.getElementById('app').style.display = 'flex';
    render();
  } else {
    err.textContent = 'Wrong password, try again.';
  }
}

document.getElementById('gate-input').addEventListener('keydown', function(e){
  if(e.key === 'Enter') checkPassword();
});

if(sessionStorage.getItem('popstudies26_unlocked') === 'yes'){
  document.getElementById('gate').style.display = 'none';
  document.getElementById('app').style.display = 'flex';
  render();
}
</script>
